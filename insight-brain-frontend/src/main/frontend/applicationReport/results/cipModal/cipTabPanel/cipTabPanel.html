<div id="informationPanel" class="iq-cip-tab-panel">
  <div class="iq-tab-bar">
    <a ng-click="vm.selectedTab = 'componentInfo'"
       class="iq-tab"
       ng-class="{ active: vm.selectedTab === 'componentInfo' }">
      Comp. Info
    </a>
    <a ng-click="vm.selectedTab = 'policy'"
       class="iq-tab"
       ng-class="{ active: vm.selectedTab === 'policy' }">
      Policy
    </a>
    <a ng-click="vm.selectedTab = 'similar'"
       class="iq-tab"
       ng-class="{ active: vm.selectedTab === 'similar'}">
      Similar
    </a>
    <a ng-click="vm.selectedTab = 'occurrences'"
       class="iq-tab"
       ng-class="{ active: vm.selectedTab === 'occurrences' }">
      Occurrences
    </a>
    <a ng-if="!vm.isComponentUnknown()"
       ng-click="vm.selectedTab = 'licenses'"
       class="iq-tab"
       ng-class="{ active: vm.selectedTab === 'licenses' }">
      Licenses
    </a>
    <a ng-if="!vm.isComponentUnknown()"
       ng-click="vm.selectedTab = 'vulnerabilities'"
       class="iq-tab"
       ng-class="{ active: vm.selectedTab === 'vulnerabilities' }">
      Vulnerabilities
    </a>
    <a ng-if="!vm.isComponentUnknown()"
       ng-click="vm.selectedTab = 'labels'"
       class="iq-tab"
       ng-class="{ active: vm.selectedTab === 'labels' }">
      Labels
    </a>
    <a ng-click="vm.selectedTab = 'claimComponent'"
       class="iq-tab"
       ng-class="{ active: vm.selectedTab === 'claimComponent' }">
      Claim Comp.
    </a>
    <a ng-if="!vm.isComponentUnknown()"
       ng-click="vm.selectedTab = 'auditLog'"
       class="iq-tab"
       ng-class="{ active: vm.selectedTab === 'auditLog' }">
      Audit Log
    </a>
  </div>
  <div ng-switch="vm.selectedTab" class="tab-content">
    <div ng-switch-when="componentInfo" information-panel></div>
    <div ng-switch-when="policy" cip-policy-violations></div>
    <div ng-switch-when="similar"><!-- TODO --></div>
    <cip-occurrences ng-switch-when="occurrences" pathnames="vm.selectedComponent.pathnames"></cip-occurrences>
    <div ng-switch-when="licenses" cip-license-editor></div>
    <div ng-switch-when="vulnerabilities" cip-vulnerability-editor></div>
    <div ng-switch-when="labels" cip-label-editor></div>
    <div ng-switch-when="claimComponent"><!-- TODO --></div>
    <div ng-switch-when="auditLog"><!-- TODO --></div>
  </div>
</div>
