<div ng-controller='PolicyEditorController' style='width:830px'>
	<form style='margin-bottom:0px' name='inlinePolicyEditor'>
		<input ng-click='click()' type='text' placeholder='New Policy' ng-model='policy.name' style='margin-bottom:0px' required>
		<span ng-show='policy'><span threat-box selected='policy.threatLevel' one='1' zero='0 (None)'></span></span>
		<div ng-show='policy' style='padding-top:10px'>
			<div inline-constraint-editor='policy.constraints[0]'>
				<input type="text"  ng-model="constraint.name" ng-change="validateConstraint()" placeholder='Constraint Name...' required>
				<div class='control-group' style="margin-bottom:0px;">
					<div class='well' style="min-height:120px;max-height:120px;overflow:auto;">
						<div style="text-align:left;" ng-repeat="condition in constraint.conditions">
							<span ng-include='"../assets/components/policy-editor/condition-editor.html"'></span>
							<div class="btn-group" style='vertical-align:top'>
								<button class="btn" type='button' ng-click="removeCondition($index)" title="Remove Condition" ng-disabled="constraint.conditions.length <= 1"><i class="icon-minus-sign"></i></button>
								<button class="btn" type='button' ng-click="addCondition()" title="Add Condition"><i class="icon-plus-sign"></i></button>
							</div>
						</div>
					</div>
				</div>
				<div style='padding-left:25px'>
					Components violate this constraint when
					<select ng-model="constraint.operator"
							ng-change="validateConstraint()"
							ng-options="operator.value as operator.name for operator in constraintConditionChoices"
							required style='magin:0'>
						<option value="" ng-selected="constraint.operator == null">any/all</option>
					</select>
					of the above conditions are true.
				</div>
			</div>
			<div clm-alerts='alerts'></div>
			<div style='text-align:right'>
				<button class='btn' type='button' ng-click='cancel()'>Cancel</button>
				<button class='btn btn-primary' type='button' ng-disabled='inlinePolicyEditor.$invalid' ng-click='savePolicy()'>Save</button>
			</div>
		</div>
	</form>
</div>
