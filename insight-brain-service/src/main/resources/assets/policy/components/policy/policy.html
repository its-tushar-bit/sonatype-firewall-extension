<div id="policy" style='min-width:955px'>
	<script type='text/ng-template' id='policy-quick-add'>
<div>
	<div ng-if='!policy'>
		<button type='button' class='btn add-new new-entity-button' ng-click='click()'>
			<i class='icon icon-plus'></i> New Policy
		</button>
	</div>
	<div ng-if='policy' class='border-box'>
		<div clm-include='"../assets/components/policy-editor/policy-inline-editor.html"'></div>
	</div>
</div>
	</script>
	<div class="content-section">
		<div load-error='error' reload='doLoad()'></div>
		<div style='margin:25px' ng-show='!applicablePolicies && !error'>
			<h5><i class='icon-time'></i> Loading...</h5>
		</div>
		<div class='fade' ng-class='{in : applicablePolicies }'>
			<div clm-alerts='alerts' class='policies'></div>
			<!-- Note that i check for .editable in ng-show, this is because I ALWAYS want to show the section header for the app tests -->
			<div id='{{applicablePolicy.ownerId}}' ng-repeat='applicablePolicy in applicablePolicies' ng-show='applicablePolicy.editable || applicablePolicy.policies.length > 0'>
				<div class="content-header">
					<h4>
						<span ng-switch='applicablePolicy.editable'>
							<span ng-switch-when='true'>{{applicablePolicy.ownerName}} Policies</span>
							<span ng-switch-default>Policies Inherited from {{applicablePolicy.ownerName}}</span>
						</span>
                        <div class='common-expand-toggle' ng-switch on='isExpanded(applicablePolicy)'>
                            <a ng-switch-when="false" ng-click='toggleAll(applicablePolicy)'><i class="glyphicons-halflings-sonatype expand"></i></a>
                            <a ng-switch-when="true" ng-click='toggleAll(applicablePolicy)'><i class="glyphicons-halflings-sonatype collapse"></i></a>
                        </div>
                    </h4>
				</div>
				<div ng-if='applicablePolicy.editable' class='policies' style='margin-bottom:5px'>
					<div inline-policy-creator></div>
				</div>
				<div ng-switch='applicablePolicy.policies.length'>
					<div ng-switch-when='0'><em style="margin-left:25px;">No policies defined</em></div>
					<div ng-switch-default>
                      <div policy-items='applicablePolicy.policies' editable='applicablePolicy.editable' remove='viewRemovePolicy'></div>
					</div>
				</div>				
			</div>
		</div>
	</div>
	<div error-Modal></div>
</div>
