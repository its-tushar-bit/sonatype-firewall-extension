<div id="help-menu" class="dropdown iq-dropdown iq-dropdown--help-menu">
  <a
    id="help-menu-dropdown-toggle"
    class="iq-dropdown-toggle iq-dropdown-toggle--main-header"
    data-toggle="dropdown"
  >
    <nx-font-awesome-icon
      icon="vm.faQuestionCircle"
      size="'2x'"
    ></nx-font-awesome-icon>
  </a>
  <div class="dropdown-menu iq-dropdown-menu iq-dropdown-menu--main-header">
    <h4 class="iq-dropdown-menu__title">Support Options</h4>
    <a
      id="getting-started-link"
      ui-sref="gettingStarted"
      title="Getting Started"
      class="iq-dropdown-menu__link--main-header"
    >
      Getting Started
    </a>
    <a
      id="documentation-link"
      href="http://links.sonatype.com/products/clm/doc/{{::vm.majorMinorVersion}}"
      title="Go to Online Help"
      target="_blank"
      rel="noreferrer"
      class="iq-dropdown-menu__link--main-header"
    >
      Online Help
    </a>
    <a
      id="support-link"
      href="http://links.sonatype.com/products/clm/support"
      title="Submit a request to Sonatype support"
      target="_blank"
      rel="noreferrer"
      class="iq-dropdown-menu__link--main-header"
    >
      Request Support
    </a>
  </div>
</div>
