<html lang="en" ng-app="insightApp">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>Application Management</title>
<link type="text/css" href="bootstrap/bootstrap-2.2.2.min.css" rel="stylesheet" />
<link type="text/css" href="insight.css?${build.timestamp}" rel="stylesheet" />
<script type='text/javascript'>
var clmBuildTimestamp = '${build.timestamp}';
</script>
<script type='text/javascript' src='jquery/jquery-1.7.2.min.js'></script>
<script type='text/javascript' src='bootstrap/bootstrap-2.2.2.min.js'></script>
<script type='text/javascript' src='angular/angular-1.0.3.min.js'></script>
<script type='text/javascript' src='angular/angular-sanitize-1.0.3.min.js'></script>
<script type='text/javascript' src='InsightApp.js?${build.timestamp}'></script>
<script type='text/javascript' src='js/Hudson.js?${build.timestamp}'></script>
<script type='text/javascript' src='InsightPolicyController.js?${build.timestamp}'></script>
<script type='text/javascript' src='LabelController.js?${build.timestamp}'></script>
</head>
<body style="height: 100%;">
	<div class="navbar navbar-fixed-top">
		<div class="navbar-inner">
			<div style='width:950px;margin:auto'>
				<a class="title brand" href="#"><img src='img/sonatype-32.png' alt='Logo'/> <span class='brand-header'>Sonatype CLM</span></a>
				<ul class="nav pull-right" style='padding-right:25px' ng-controller='TabController'>
					<li ng-class='{ active : tabUrl == "/policy"}' data-placement='bottom' data-title='Policies' tip><a href="#" ng-click="policyTabClick($event)"><img src='img/glyphicons_263_bank.png' alt='Policies'/></a></li>
					<li ng-class='{ active : tabUrl == "/labels"}' data-placement='bottom' data-title='Labels' tip><a href="#" ng-click="labelTabClick($event)"><img src='img/glyphicons_065_tag.png' alt='Labels'/></a></li>
					<li ng-class='{ active : tabUrl == "/license-group"}' data-placement='bottom' data-title='License Groups' tip><a href="#" ng-click="licenseGroupTabClick($event)"><img src='img/glyphicons_332_certificate.png' alt='License Groups'/></a></li>
				</ul>
			</div>
		</div>
	</div>
<div class='page-content' ng-cloak>
	<div class="container">
		<div class="tab-content" ng-view></div>
	</div>
</div>
</body>
</html>
