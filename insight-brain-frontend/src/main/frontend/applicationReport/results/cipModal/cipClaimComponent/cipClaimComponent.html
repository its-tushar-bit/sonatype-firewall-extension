<div id="claim-component-editor" class="claimComponent">
  <div ng-show="vm.loading" class="iq-spinner__wrapper">
    <i class="fa fa-spin fa-circle-o-notch iq-spinner__icon"></i>Loading
  </div>
  <div ng-show="vm.error" class="alert alert-error">
    <h4>Error</h4>
    <p>{{vm.error}}</p>
    <p>
      <button type="button" class="btn btn-danger btn-error" ng-click="vm.error = null">
        <i class="icon-white icon-arrow-left"></i> Back
      </button>
    </p>
  </div>
  <div class="well" ng-hide="vm.loading || vm.error">
    <form name="vm.claimForm" novalidate disablenav>
      <table>
        <tr>
          <td>
            <div class="form-horizontal">
              <div
                id="cip-claim-group-id"
                class="control-group"
                ng-class="{ error : vm.claimForm.$submitted && vm.claimForm.groupId.$error.required }"
              >
                <label class="control-label">Group ID</label>
                <div class="controls">
                  <input name="groupId" class="input-xlarge" type="text" ng-model="vm.claimData.groupId" required />
                </div>
              </div>
              <div
                id="cip-claim-artifact-id"
                class="control-group"
                ng-class="{ error : vm.claimForm.$submitted && vm.claimForm.artifactId.$error.required }"
              >
                <label class="control-label">Artifact ID</label>
                <div class="controls">
                  <input
                    name="artifactId"
                    class="input-xlarge"
                    type="text"
                    ng-model="vm.claimData.artifactId"
                    required
                  />
                </div>
              </div>
              <div
                id="cip-claim-version"
                class="control-group"
                ng-class="{ error : vm.claimForm.$submitted && vm.claimForm.version.$error.required }"
              >
                <label class="control-label">Version</label>
                <div class="controls">
                  <input name="version" class="input-xlarge" type="text" ng-model="vm.claimData.version" required />
                </div>
              </div>
              <div id="cip-claim-classifier" class="control-group">
                <label class="control-label">Classifier</label>

                <div class="controls">
                  <input name="classifier" class="input-xlarge" type="text" ng-model="vm.claimData.classifier" />
                </div>
              </div>
            </div>
          </td>
          <td>
            <div class="form-horizontal">
              <div
                id="cip-claim-extension"
                class="control-group"
                ng-class="{ error : vm.claimForm.$submitted && vm.claimForm.extension.$error.required }"
              >
                <label class="control-label">Extension</label>
                <div class="controls">
                  <input name="extension" class="input-xlarge" type="text" ng-model="vm.claimData.extension" required />
                </div>
              </div>
              <div
                id="cip-claim-created-date"
                class="control-group"
                ng-class="{ error : vm.claimForm.createTimeText.$dirty && vm.claimForm.createTimeText.$error.pattern }"
              >
                <label class="control-label">Created</label>
                <div class="controls">
                  <div class="input-append date">
                    <input
                      name="createTimeText"
                      class="span2"
                      type="text"
                      ng-model="vm.claimData.createTimeText"
                      ng-pattern="/^(0?[1-9]|1[012])\/(0?[1-9]|[12][0-9]|3[01])\/(199\d|[2-9]\d{3})$/"
                    /><span class="add-on"><i class="icon-calendar"></i></span>
                  </div>
                </div>
              </div>
              <div id="cip-claim-comment" class="control-group">
                <label class="control-label">Comment</label>
                <div class="controls">
                  <textarea name="comment" class="input-xlarge" ng-model="vm.claimData.comment"> </textarea>
                </div>
              </div>
            </div>
          </td>
        </tr>
        <tr>
          <td id="validation-error-messages" class="validation-error">{{vm.getValidationMessage()}}</td>
          <td>
            <div class="controls" style="text-align: right">
              <button
                type="none"
                id="cip-claim-submit"
                class="btn btn-primary"
                ng-show="!vm.isClaimedComponent()"
                ng-disabled="!vm.claimForm.$dirty"
                ng-click="vm.claimComponent()"
              >
                Claim
              </button>
              <button
                type="none"
                id="cip-claim-revoke"
                class="btn btn-danger btn-error"
                ng-show="vm.isClaimedComponent()"
                ng-click="vm.openRevokeClaimDialog()"
              >
                Revoke Claim
              </button>
              <button
                type="none"
                id="cip-claim-cancel"
                class="btn"
                ng-show="vm.isClaimedComponent()"
                ng-disabled="!vm.claimForm.$dirty"
                ng-click="vm.resetFormFromServerData()"
              >
                Cancel
              </button>
              <button
                type="none"
                id="cip-claim-update"
                class="btn btn-primary"
                ng-show="vm.isClaimedComponent()"
                ng-disabled="!vm.claimForm.$dirty"
                ng-click="vm.updateComponent()"
              >
                Update
              </button>
            </div>
          </td>
        </tr>
      </table>
    </form>
  </div>
</div>
