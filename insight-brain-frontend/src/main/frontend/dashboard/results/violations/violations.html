<div id="dashboard-violations">
  <div class="iq-tile iq-tile--dashboard-table-container" maximize-container-height>
    <div class="iq-scrollable iq-scrollable--fixed-table" detect-scrollbar="vm.appliedFilter">
      <table class="iq-table iq-table--fixed iq-table--dashboard-violations">
        <thead class="dashboard-headers iq-dashboard-headers iq-table--fixed__header">
          <tr class="iq-table-row"
              sort="vm.results.violations.sortFields"
              on-sort-change="vm.sortResults('violations', sortFields)">
            <th class="iq-cell iq-cell--header iq-cell--threat" sort-column="-threatLevel,-firstOccurrenceTime">
              <span class="iq-cell__text--header">Threat</span>
            </th><!--
         --><th class="iq-cell iq-cell--header iq-cell--policy" sort-column="policyName,-firstOccurrenceTime">
              <span class="iq-cell__text--header">Policy</span>
            </th><!--
         --><th class="iq-cell iq-cell--header iq-cell--application" sort-column="applicationName,-threatLevel">
              <span class="iq-cell__text--header">Application</span>
            </th><!--
         --><th class="iq-cell iq-cell--header iq-cell--component" sort-column="derivedComponentName,-threatLevel">
              <span class="iq-cell__text--header">Component</span>
            </th><!--
         --><th class="iq-cell iq-cell--header iq-cell--age"
                sort-column="-firstOccurrenceTime,-threatLevel"
                sort-inverted="true">
              <span class="iq-cell__text--header">Age</span>
            </th>
          </tr>
        </thead>
        <tbody id="dashboard-results"
               class="iq-violations-results iq-table iq-table--fixed__content"
               form-mask="vm.maskController"
               mask-message="">
          <tr violations-table-row risk="risk"
              ng-repeat="risk in vm.results.violations.results | limitTo: vm.maxResults | emptyToEnd:vm.results.violations.sortFields"
              class="iq-table-row">
          </tr>
        </tbody>
      </table>
      <dashboard-common-results results="vm.results.violations.results"
                                is-violations-tab="true"
                                needs-acknowledgement="vm.needsAcknowledgement"
                                max-results="vm.maxResults"
                                max-days-old="vm.appliedFilter.maxDaysOld"
                                error="vm.results.violations.error"
                                reload="vm.reload()">
      </dashboard-common-results>
    </div>
  </div>
</div>
