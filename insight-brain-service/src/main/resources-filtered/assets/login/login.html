<html lang="en" ng-app="loginApp">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>CLM Management</title>
<link href="../../assets/css/clm-server.css?${build.timestamp}" rel="stylesheet" />
<link rel='shortcut icon' href='favicon.ico' />
<script src='../../assets/lib/jquery/jquery-1.8.3.min.js'></script>
<script src="../../assets/lib/bootstrap/bootstrap-2.3.1.min.js"></script>
<script src='../../assets/lib/angular/angular-${angularjs.version}.min.js'></script>
<script src='LoginApp.js?${build.timestamp}'></script>
</head>
<body ng-controller='loginController'>
	<div class="first-row navbar navbar-fixed-top">
		<div class="navbar-inner">
			<div class="container-fluid">
				<a class="title brand" href="#"> <img src="../../assets/img/sonatype-32.png" alt="Logo" height="32" width="32" />&nbsp;Sonatype CLM
				</a>
			</div>
		</div>
	</div>
	<div style="position: absolute; top: 50%; margin-top: -150px; left: 0; width: 100%;">
		<div class="well" style="width: 400px; margin-left: auto; margin-right: auto; height: 200px;">
			<form name="loginForm" class="form-horizontal">
				<h2 style="text-align: center;">Welcome to CLM</h2>
				<div class="control-group">
					<label class="control-label">Username</label>
					<div class="controls">
						<input type="text" placeholder="Enter username..." ng-model="data.username" ng-required="true">
					</div>
				</div>
				<div class="control-group">
					<label class="control-label">Password</label>
					<div class="controls">
						<input type="password" placeholder="Enter password..." ng-model="data.password" ng-required="true">
					</div>
				</div>
				<div class="control-group">
					<div class="controls">
						<button type="none" class="btn btn-primary" ng-click="signIn()" ng-disabled="loginForm.$invalid">Sign in</button>
					</div>
				</div>
			</form>
		</div>
	</div>
</body>
</html>
