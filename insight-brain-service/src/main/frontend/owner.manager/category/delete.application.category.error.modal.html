<div id="delete-application-category-error-modal" class="clm-modal">
  <div class="clm-modal-header">
    <h2><i class="fa size-20px fa-trash"></i>Delete Application Category</h2>
  </div>
  <div class="clm-modal-footer error">
    <div class="section with-icon"><i class="fa fa-warning"></i>{{::'You cannot delete this application category because
      it is associated with the following policies: ' + vm.tagPolicyList.join(', ')}}
    </div>
    <button class='btn' type='button' ng-click="$dismiss()">OK</button>
  </div>
</div>
