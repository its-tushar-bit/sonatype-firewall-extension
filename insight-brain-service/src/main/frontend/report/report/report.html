<div class="container">
  <div load-error='error' reload='doLoad()'></div>
  <div ng-hide='error' style="width:960px; margin:auto">
    <div ng-hide='application'><h5><i class='icon icon-time'></i> Loading...</h5></div>
    <div ng-if='application' ng-class='{"report--expanded-coverage": expandedCoverage}'>
      <div id='report-title' ng-class='{"report__title--expanded-coverage": expandedCoverage, "report__title": !expandedCoverage}' style="width:940px; margin:auto">
        <strong>{{application.name}}</strong> - {{reportTime | date:'yyyy-MM-dd'}} - <em>{{reportTitle}}</em>
      </div>
      <div id='evaluationReportContainer' expandable-iframe='reportUrl'></div>
    </div>
  </div>
</div>
