<div>
	<div load-error='error' reload='doLoad()'></div>
	<div class='content-container' style='text-align:center;width:370px;margin:25px auto' ng-show='labels == null && !error'>
		<h5><i class='icon-time'></i> Loading...</h5>
	</div>
	<div ng-show='!error && labels != null'>
		<div class='add-section'>
          <button type='button' class='btn btn-primary' ng-click='editLabel()'><i class="icon-white icon-plus-sign"></i> New Label</button>
		</div>
		<div style='padding-left:25px'>
			<h4>{{selectedApplication.name}} Labels</h4>
			<div>
				<div ng-repeat='label in labels | orderBy:"label"' style='display:inline-block;padding:5px;'  ng-click='editLabel(label)'>
                  <div class="labelContainer"  ng-class="{active: selectedLabel.id == label.id}">
					<span class="clmLabel {{label.color}}Label" style="padding-right: 15px;">
                      {{label.label}}
                    </span>
                    <span class="icon-remove-circle deleteHoverTransparent" ng-click="deleteLabel(label)"></span>
                  </div>
				</div>
				<em ng-show='labels.length == 0'>No labels available</em>
			</div>
			<div ng-include='editorUrl'></div>
	    </div>
    </div>
    <div error-Modal></div>
</div>
