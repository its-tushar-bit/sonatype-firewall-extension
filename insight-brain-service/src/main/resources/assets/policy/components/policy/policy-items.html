<div class="accordion" id="policies">
	<div class="accordion-group" ng-repeat='policy in policies'>
		<div class="common-accordion-header">
			<div style="display:inline;">
				<span class="threat-box threat-level-{{policy.threatLevel}}">{{policy.threatLevel}}</span>&nbsp;<b style='vertical-align: middle'>{{policy.name}}</b>
			</div>
			<div class="floatRight" style="float:right;" ng-show='editable'>
				<div class='btn-group hover-buttons'>
					<a class="btn btn-mini policy-button" title="Edit Policy" relative-href='/{{policy.id}}'"><i class="icon-pencil" style="margin-top: 0px;"></i></a>
					<a class="btn btn-mini policy-button" title="Remove Policy" ng-click="remove(policy)"><i class="icon-trash" style="margin-top: 0px;"></i></a>
				</div>
			</div>
		</div>
		<a class="common-accordion-toggle" data-toggle="collapse" data-parent="policies" href="#collapse{{policy.id}}"></a>
		<div id="collapse{{policy.id}}" class="common-accordion-body accordion-body collapse">
			<div class="accordion-inner">
				<table>
					<tr class="constraints">
						<td class="header">Constraints:</td>
						<td><span class="constraint-name" ng-repeat="constraint in policy.constraints">{{constraint.name}}</span></td>
					</tr>
					<tr class="actions">
						<td class="header">Actions:</td>
						<td>
							<table style="height: 40px;">
								<tr>
									<td class="action-item" ng-repeat="stage in getActionStages()"><span>{{stage.name}}</span> <br> <img
										ng-src='{{getStageIconPath(stage, policy)}}' style="height: 20px; width: 20px;" /></td>
								</tr>
							</table>
						</td>
					</tr>
					<tr>
						<td ng-show='editable' colspan="2" style="padding-top: 10px;"><a class='btn btn-primary pull-right'>Edit</a></td>
					</tr>
				</table>
			</div>
		</div>
	</div>
</div>
