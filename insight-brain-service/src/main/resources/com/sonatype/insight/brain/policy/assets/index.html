<!DOCTYPE html>
<html lang="en" ng-app="insightApp">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>Policy Management</title>
<link type="text/css" href="jquery/jquery.ui.selectmenu.css" rel="stylesheet" />
<link type="text/css" href="jquery/jquery-ui.css" rel="stylesheet" />
<link type="text/css" href="bootstrap/bootstrap.css" rel="stylesheet" />
<link type="text/css" href="bootstrap/bootstrap-responsive.css" rel="stylesheet" />
<link type="text/css" href="slickgrid/slick.grid.css" rel="stylesheet">
<link type="text/css" href="slickgrid/slick.grid.custom.css" rel="stylesheet">
<link type="text/css" href="insight.css" rel="stylesheet" />
<script type='text/javascript' src='jquery/jquery.min.js'></script>
<script type='text/javascript' src='jquery/jquery-ui.min.js'></script>
<script type='text/javascript' src='jquery/jquery.ui.selectmenu.min.js'></script>
<script type='text/javascript' src='jquery/jquery.event.drag-2.0.min.js'></script>
<script type='text/javascript' src='bootstrap/bootstrap.js'></script>
<script type='text/javascript' src='angular/angular-1.0.2.js'></script>
<script type='text/javascript' src='slickgrid/slick.core.js'></script>
<script type='text/javascript' src='slickgrid/slick.grid.js'></script>
<script type='text/javascript' src='slickgrid/slick.dataview.js'></script>
<script type='text/javascript' src='slickgrid/slick.rowselectionmodel.js'></script>
<script type='text/javascript' src='slickgrid/slick.checkboxselectcolumn.js'></script>
<script type='text/javascript' src='SlickGridComponent.js'></script>
<script type='text/javascript' src='InsightApp.js'></script>
<script type='text/javascript' src='InsightPolicyController.js'></script>
</head>
<body style="height: 100%; padding-top: 60px;">
	<div class="container">
		<div class="navbar navbar-fixed-top">
			<div class="navbar-inner">
				<a class="brand pull-right" href="#">Application Management</a>
				<ul class="nav pull-right">
					<li class="active"><a href="#policy" data-toggle="tab">Policies</a></li>
					<li><a href="#label" data-toggle="tab">Labels</a></li>
					<li><a href="#licenseGroup" data-toggle="tab">License Groups</a></li>
				</ul>
			</div>
		</div>
		<div class="tab-content">
			<div class="tab-pane active" id="policy" ng-controller="InsightPolicyController">
				<div ng-show="!state.showAddPolicyScreen" class="span6 offset4 no-content">No Policies have been defined.<br><a href="#" ng-click="createPolicyClick()">Create</a> a new Policy.</div>
				<div ng-show="state.showAddPolicyScreen">
					<div class="page-header">Create a new Policy</div>
					<div class="form-horizontal">
					    <div class="control-group">
					        <label class="control-label" for="policyName">Name</label>
					    	<div class="controls">
						        <input type="text" id="policyName" placeholder="Enter Policy Name..." ng-change="validatePolicy()" ng-model="state.policyName">
					    	</div>
					    </div>
					    <div class="control-group">
					    	<label class="control-label" for="policyConstraints">Constraints</label>
					    	<div class="controls">
					    	    <div style="width:100%;" ng-show="state.policyConstraintCount">
						            <table width="100%">
									    <tr>
										    <td width="99%"></td>
										    <td><button class="btn" data-toggle="modal" data-target="#newConstraintModal" title="Add new Constraint"><i class="icon-plus-sign"></i></button></td>
										    <td><button class="btn" ng-click="enableConstraint()" title="Enable selected Constraint(s)"><i class="icon-ok-circle"></i></button></td>
										    <td><button class="btn" ng-click="disableConstraint()" title="Disable selected Constraint(s)"><i class="icon-remove-circle"></i></button></td>
										    <td><button class="btn" ng-click="removeConstraint()" title="Delete selected Constraint(s)"><i class="icon-trash"></i></button></td>
										</tr>
									</table>
									<slickgrid id="policyConstraintGrid" style="height:200px;" data="state.policyConstraintList" table-def="state.policyConstraintTableDefinition"></slickgrid>
					            </div>
					    	</div>
					    </div>
					    <div class="control-group">
					    	<label class="control-label" for="policyActions">Actions</label>
					    	<div class="controls">
					    	    <div style="height: 100px;" class="well">
					    	    	<div class="span3 offset3" style="padding-top:30px;">TODO</div>
					    	    </div>
					    	</div>
					    </div>
					    <div style='text-align:right'>
						    <button type='none' class='btn btn-primary' ng-click="savePolicyClick()" ng-disabled="!state.policyValid">Save</button>
							<button type='none' class='btn' ng-click="cancelPolicyClick()">Cancel</button>
						</div>
					</div>
					<div id="newConstraintModal" class="modal hide fade">
						<div class="modal-header">
						    <button type="button" class="close" data-dismiss="modal">×</button>
						    <h3>New Policy Constraint</h3>
						</div>
						<div class="modal-body">
						    <p>One fine body…</p>
						</div>
						<div class="modal-footer">
						    <button class="btn btn-primary">Add</button>
						    <button class="btn" data-dismiss="modal">Cancel</button>
						</div>
					</div>
				</div>
			</div>
			<div class="tab-pane" id="label">
			    <div class="span6 offset4 no-content">Label content is under development..</div>
			</div>
			<div class="tab-pane" id="licenseGroup">
			    <div class="span6 offset4 no-content">License Group content is under development..</div>
			</div>
		</div>
	</div>
</body>
</html>
