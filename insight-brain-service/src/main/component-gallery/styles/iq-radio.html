<item-description>
  <marked>
    **.iq-radio** is a default class that provides custom styling for radio buttons in much the same way that we do for checkboxes.
  </marked>
</item-description>

<item-example-html>
  <form>
    <div class="form-group">
      <label class="iq-radio"> 
        <input type="radio" id="radio1" class="iq-radio__input" name="repo-list">
        <span class="iq-radio__circle"></span>Glen's Repositories
      </label>
      <label class="iq-radio"> 
        <input type="radio" id="radio2" class="iq-radio__input" name="repo-list">
        <span class="iq-radio__circle"></span>Andrey's Repositories
      </label>
      <label class="iq-radio"> 
        <input type="radio" id="radio3" class="iq-radio__input" name="repo-list">
        <span class="iq-radio__circle"></span>Micah's Repositories
      </label>
      <label class="iq-radio iq-radio--disabled"> 
        <input type="radio" id="radio4" class="iq-radio__input" name="repo-list" disabled="disabled">
        <span class="iq-radio__circle"></span>Brandon's Repositories
      </label>
    </div>
  </form>
</item-example-html>
