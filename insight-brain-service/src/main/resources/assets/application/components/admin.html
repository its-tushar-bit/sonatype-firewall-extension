<div class='face' style="padding-left: 10px;">
		<div ng-controller='ProprietaryConfigurationController' style="max-width: 430px;">
			<div style="padding-top: 10px;">
				<div ng-show='loadError'>An Error Occurred</div>
				<div ng-show='!loadError && !proprietary'><i class='icon-time'></i> Loading</div>
				<div ng-show='!loadError && proprietary'>
					<div list-editor place-holder='Proprietary Package' max-length='50' entries='packages' set-error='setEditorError' validator='validatePackage'></div>
				</div>
				<div>
				    <span ng-show='error' class="alert alert-error" style>{{error}}</span>
					<span ng-show='!saving && proprietary' style="float: right;">
						<button class="btn" ng-click="reset()">Reset</button>
						<button class="btn btn-primary" ng-click="save()">Save</button>
					</span>
					<span ng-show='saving' style='height:30px'><i class='icon-time'></i> Saving</span>
				</div>
			</div>
		</div>
</div>
