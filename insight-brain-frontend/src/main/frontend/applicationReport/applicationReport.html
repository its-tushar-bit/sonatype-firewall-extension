<div class="iq-root-container" id="application-report" maximize-container-height>
  <aside class="iq-sidebar iq-sidebar--theme-dark" id="application-report-sidebar">
    <label>
      <input type="checkbox" ng-model="vm.aggregate" ng-change="vm.setAggregateReportEntries(vm.aggregate)">
      Aggregate
    </label>
    <label>
      <input type="checkbox" ng-model="vm.sortByPolicy" ng-change="vm.setSorting(vm.sortByPolicy)">
      Sort By Policy
    </label>
    <label>
      <input type="checkbox" ng-model="vm.hasFilter" ng-change="vm.setFiltering(vm.hasFilter)">
      Do Filtering
    </label>
  </aside><!--
--><main class="iq-body-container">
    <application-report-results></application-report-results>
  </main>
</div>
