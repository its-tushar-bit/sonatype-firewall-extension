<div class="tile-container tile-scroll-container iq-tile-scroll-container--success-metrics"
     load-wrapper="vm.error"
     loading="!vm.loaded"
     reload="vm.doLoad()">
  <iq-back-button state="labs.successMetrics"></iq-back-button>
  <div class="iq-tile iq-tile--chart" >
    <summary-statement-tile averages-data="vm.averagesData"
                            success-metrics="vm.successMetrics"
                            on-delete="vm.goToList()">
    </summary-statement-tile>
  </div>
  <div ng-if="vm.activeApplicationCount !== 0">
    <div class="iq-tile iq-tile--chart">
      <violation-averages-chart averages-data="vm.averagesData"></violation-averages-chart>
    </div>
    <div ng-if="!vm.isMttrDisabled()" class="iq-tile iq-tile--chart">
      <mttr-chart mttr-data="vm.mttrData"></mttr-chart>
    </div>
    <div class="iq-tile iq-tile--chart">
      <application-counts-chart application-counts-data="vm.applicationCountsData"></application-counts-chart>
    </div>
    <div class="iq-tile iq-tile--chart">
      <component-counts-chart component-data="vm.componentCountsData"></component-counts-chart>
    </div>
  </div>
</div>
