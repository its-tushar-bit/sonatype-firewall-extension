<label class="iq-radio"
       ng-class="{'iq-radio--disabled': vm.isDisabled}">
  <input type="radio"
         id="{{::vm.getId()}}"
         class="iq-radio__input"
         ng-disabled="vm.isDisabled"
         ng-model="vm.model"
         ng-value="vm.value"
         ng-change="vm.onClick({value:vm.value})">
  <span class="iq-radio__circle"></span><ng-transclude></ng-transclude>
</label>
