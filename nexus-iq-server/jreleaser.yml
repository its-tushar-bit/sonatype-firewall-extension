environment:
  properties:
    jdkPathPrefix: 'nexus-iq-server/target/jdks'
    jdkDirectoryPrefix: 'temurin_17.0.2'
    jdkFilePrefix: 'jdk-17.0.2+8'

project:
  stereotype: CLI

assemble:
  jlink:
    nexus-iq-server:
      active: ALWAYS
      imageName: '{{distributionName}}-{{projectVersion}}'
      targetJdks:
        - path: '{{jdkPathPrefix}}/{{jdkDirectoryPrefix}}_mac_x86_64/{{jdkFilePrefix}}/Contents/Home'
          platform: 'osx-x86_64'
          extraProperties:
            archiveFormat: TGZ
        - path: '{{jdkPathPrefix}}/{{jdkDirectoryPrefix}}_mac_aarch64/{{jdkFilePrefix}}/Contents/Home'
          platform: 'osx-aarch_64'
          extraProperties:
            archiveFormat: TGZ
        - path: '{{jdkPathPrefix}}/{{jdkDirectoryPrefix}}_linux_x86_64/{{jdkFilePrefix}}'
          platform: 'linux-x86_64'
          extraProperties:
            archiveFormat: TGZ
        - path: '{{jdkPathPrefix}}/{{jdkDirectoryPrefix}}_linux_musl_x86_64/{{jdkFilePrefix}}'
          platform: 'linux_musl-x86_64'
          extraProperties:
            archiveFormat: TGZ
        - path: '{{jdkPathPrefix}}/{{jdkDirectoryPrefix}}_linux_aarch64/{{jdkFilePrefix}}'
          platform: 'linux-aarch_64'
          extraProperties:
            archiveFormat: TGZ
        - path: '{{jdkPathPrefix}}/{{jdkDirectoryPrefix}}_windows_x86_64/{{jdkFilePrefix}}'
          platform: 'windows-x86_64'
      options:
        longFileMode: POSIX
        bigNumberMode: POSIX
      jdeps:
        enabled: false
      moduleNames:
        - java.base
        - java.compiler
        - java.instrument
        - java.logging
        - java.management
        - java.management.rmi
        - java.naming
        - java.net.http
        - java.prefs
        - java.rmi
        - java.scripting
        - java.se
        - java.security.jgss
        - java.security.sasl
        - java.sql
        - java.sql.rowset
        - java.transaction.xa
        - java.xml
        - java.xml.crypto
        - jdk.accessibility
        - jdk.attach
        - jdk.charsets
        - jdk.compiler
        - jdk.crypto.cryptoki
        - jdk.crypto.ec
        - jdk.dynalink
        - jdk.hotspot.agent
        - jdk.httpserver
        - jdk.incubator.foreign
        - jdk.incubator.vector
        - jdk.internal.ed
        - jdk.internal.jvmstat
        - jdk.internal.le
        - jdk.internal.opt
        - jdk.internal.vm.ci
        - jdk.jcmd
        - jdk.jconsole
        - jdk.jdi
        - jdk.jdwp.agent
        - jdk.jfr
        - jdk.jpackage
        - jdk.jshell
        - jdk.jsobject
        - jdk.jstatd
        - jdk.localedata
        - jdk.management
        - jdk.management.agent
        - jdk.management.jfr
        - jdk.naming.dns
        - jdk.naming.rmi
        - jdk.net
        - jdk.nio.mapmode
        - jdk.random
        - jdk.sctp
        - jdk.security.auth
        - jdk.security.jgss
        - jdk.unsupported
        - jdk.xml.dom
        - jdk.zipfs
      java:
        version: '17'
        groupId: com.sonatype.insight.brain
        artifactId: insight-brain-service
        mainClass: com.sonatype.insight.brain.service.InsightBrainService
        jvmOptions:
          universal:
            - --add-opens=java.base/java.lang=ALL-UNNAMED
            - --add-opens=java.base/java.util=ALL-UNNAMED
            - --add-opens=java.base/java.security=ALL-UNNAMED
            - --add-opens=java.base/sun.security.rsa=ALL-UNNAMED
            - --add-opens=java.base/sun.security.x509=ALL-UNNAMED
            - --add-opens=java.base/sun.security.util=ALL-UNNAMED
            - --add-opens=java.xml/com.sun.org.apache.xerces.internal.jaxp.datatype=ALL-UNNAMED
      mainJar:
        path: 'nexus-iq-server/target/insight-brain-service-{{projectVersion}}-server.jar'
    nexus-iq-cli:
      active: ALWAYS
      imageName: '{{distributionName}}-{{projectVersion}}'
      targetJdks:
        - path: '{{jdkPathPrefix}}/{{jdkDirectoryPrefix}}_mac_x86_64/{{jdkFilePrefix}}/Contents/Home'
          platform: 'osx-x86_64'
          extraProperties:
            archiveFormat: TGZ
        - path: '{{jdkPathPrefix}}/{{jdkDirectoryPrefix}}_mac_aarch64/{{jdkFilePrefix}}/Contents/Home'
          platform: 'osx-aarch_64'
          extraProperties:
            archiveFormat: TGZ
        - path: '{{jdkPathPrefix}}/{{jdkDirectoryPrefix}}_linux_x86_64/{{jdkFilePrefix}}'
          platform: 'linux-x86_64'
          extraProperties:
            archiveFormat: TGZ
        - path: '{{jdkPathPrefix}}/{{jdkDirectoryPrefix}}_linux_musl_x86_64/{{jdkFilePrefix}}'
          platform: 'linux_musl-x86_64'
          extraProperties:
            archiveFormat: TGZ
        - path: '{{jdkPathPrefix}}/{{jdkDirectoryPrefix}}_linux_aarch64/{{jdkFilePrefix}}'
          platform: 'linux-aarch_64'
          extraProperties:
            archiveFormat: TGZ
        - path: '{{jdkPathPrefix}}/{{jdkDirectoryPrefix}}_windows_x86_64/{{jdkFilePrefix}}'
          platform: 'windows-x86_64'
      options:
        longFileMode: POSIX
        bigNumberMode: POSIX
      jdeps:
        enabled: false
      moduleNames:
        - java.base
        - java.instrument
        - java.logging
        - java.management
        - java.management.rmi
        - java.naming
        - java.net.http
        - java.prefs
        - java.rmi
        - java.scripting
        - java.se
        - java.security.jgss
        - java.security.sasl
        - java.sql
        - java.sql.rowset
        - java.transaction.xa
        - java.xml
        - java.xml.crypto
        - jdk.attach
        - jdk.charsets
        - jdk.crypto.cryptoki
        - jdk.crypto.ec
        - jdk.dynalink
        - jdk.hotspot.agent
        - jdk.internal.ed
        - jdk.internal.jvmstat
        - jdk.internal.le
        - jdk.internal.opt
        - jdk.jdi
        - jdk.jdwp.agent
        - jdk.jfr
        - jdk.localedata
        - jdk.management
        - jdk.management.agent
        - jdk.management.jfr
        - jdk.naming.dns
        - jdk.naming.rmi
        - jdk.net
        - jdk.nio.mapmode
        - jdk.random
        - jdk.sctp
        - jdk.security.auth
        - jdk.security.jgss
        - jdk.unsupported
        - jdk.xml.dom
        - jdk.zipfs
      java:
        version: '17'
        groupId: com.sonatype.insight.brain
        artifactId: nexus-iq-cli
        mainClass: com.sonatype.insight.scan.cli.PolicyEvaluatorCli
      mainJar:
        path: 'nexus-iq-server/target/nexus-iq-cli-{{projectVersion}}.jar'