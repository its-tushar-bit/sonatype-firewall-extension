<div load-wrapper="vm.loadError" loading="!vm.actionStages" reload="vm.doLoad()">
  <div
    id="notifications-disabled-message"
    ng-if="!vm.isNotificationsSupported"
    class="iq-alert iq-alert--info iq-alert--form-item"
  >
    <i class="fa fa-info-circle"></i>Notifications are not supported by your license.
    <span ng-if="vm.isFirewallSupported">(Exclusions apply for firewall supported licenses)</span>
  </div>
  <table id="policy-edit-notifications" class="iq-table">
    <thead>
      <tr class="iq-table-row">
        <th class="iq-cell iq-cell--header">RECIPIENT</th>
        <th class="iq-cell iq-cell--header" ng-repeat="stage in vm.actionStages">{{::stage.shortName | uppercase}}</th>
        <th
          class="iq-cell iq-cell--header iq-cell--continuous-monitoring"
          ng-class="{disabled: !vm.isMonitoringSupported}"
        >
          CONTINUOUS MONITORING
        </th>
        <th class="iq-cell iq-cell--header iq-cell--header--noborder"></th>
      </tr>
    </thead>
    <tbody>
      <tr ng-if="!vm.hasRecipients()" class="iq-table-row">
        <td class="iq-cell iq-cell--empty" colspan="{{vm.actionStages.length + 3}}">No notifications configured</td>
      </tr>
      <tr
        class="iq-table-row"
        ng-repeat="recipient in vm.recipients"
        data-recipient="{{::vm.getDisplayName(recipient)}}"
      >
        <td class="iq-cell iq-cell--recipient">
          <svg ng-if="::recipient.projectKey" viewBox="0 0 32 32" class="svg-slate-16px">

            ></path>
          </svg>
          <i
            class="fa slate size-16px"
            ng-if="::!recipient.projectKey"
            ng-class="::{'fa-envelope': recipient.emailAddress, 'fa-puzzle-piece': recipient.roleId }"
          ></i
          ><!--
       -->{{::vm.getDisplayName(recipient)}}
        </td>
        <td ng-repeat="stage in vm.actionStages" class="iq-cell tm-stage-{{::stage.stageTypeId}}">
          <iq-checkbox
            on-click="vm.toggleStage(recipient, stage.stageTypeId)"
            is-checked="vm.hasStage(recipient, stage.stageTypeId)"
            is-disabled="vm.isCheckboxForStageDisabled(recipient, stage.stageTypeId)"
            tooltip="{{ !vm.isNotificationsSupportedForStage(stage.stageTypeId) ? 'Notifications are not supported by your license.' : '' }}"
            data-tooltip-placement="top"
            data-tooltip-append-to-body="true"
          >
          </iq-checkbox>
        </td>
        <td class="iq-cell tm-continuous-monitoring">
          <iq-checkbox
            on-click="vm.toggleStage(recipient, 'continuous-monitoring')"
            is-checked="vm.hasStage(recipient, 'continuous-monitoring')"
            is-disabled="vm.disabled || !vm.isMonitoringSupported"
            data-tooltip="{{:: vm.isMonitoringSupported ? '' : 'Policy Monitoring is not supported by your license'}}"
            data-tooltip-placement="top"
            data-tooltip-append-to-body="true"
          >
          </iq-checkbox>
        </td>
        <td class="iq-cell">
          <button
            class="iq-btn iq-btn--tertiary iq-btn--icon-only tm-delete-btn"
            type="button"
            ng-click="vm.removeRecipient(recipient)"
            ng-disabled="vm.disabled"
          >
            <!--
         --><i class="fa fa-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="iq-policy-editor__add-notification">
    <ng-form name="vm.addRecipientForm">
      <div class="iq-form-row">
        <div class="iq-form-group">
          <label class="iq-label" for="recipient-type" ng-class="{ disabled: vm.isNotificationsFormDisabled() }"
            >Recipient Type</label
          >
          <dropdown-selector
            id="recipient-type"
            class="iq-policy-editor__editor-notification-type"
            ng-model="vm.recipientType"
            name="recipient-type"
            options="vm.recipientTypeOptions"
            item-as-class="true"
            ng-disabled="vm.isNotificationsFormDisabled()"
            ng-change="vm.resetNotifications()"
          >
          </dropdown-selector>
        </div>
        <div class="iq-form-group" ng-if="vm.recipientType === vm.recipientTypes.EMAIL">
          <label class="iq-label" for="recipient-email" ng-class="{ disabled: vm.isNotificationsFormDisabled() }"
            >Email Address</label
          >
          <input
            clm-input
            id="recipient-email"
            class="iq-text-input iq-policy-editor__editor-notification-email"
            name="recipient-email"
            type="email"
            ng-model="vm.recipientToAdd"
            ng-disabled="vm.isNotificationsFormDisabled()"
            unique-validator="vm.getEmails()"
            ng-keypress="$event.keyCode == 13 && vm.addRecipient($event)"
            messages="{unique: 'Email already exists'}"
          />
        </div>
        <div class="iq-form-group" ng-if="vm.recipientType === 'Role'">
          <label class="iq-label" for="recipient-role" ng-class="{ disabled: vm.isNotificationsFormDisabled() }"
            >Role</label
          >
          <dropdown-selector
            id="recipient-role"
            option-name-param="roleName"
            ng-model="vm.recipientToAdd"
            name="recipient-role"
            options="vm.getAvailableRoles()"
            no-options-string="All roles are being notified."
            empty-option-string="-- Select Role --"
            ng-disabled="vm.isNotificationsFormDisabled()"
          >
          </dropdown-selector>
        </div>
        <span ng-if="vm.recipientType === vm.recipientTypes.WEBHOOK && vm.isWebhooksSupported">
          <div class="iq-form-group">
            <label class="iq-label" for="recipient-webhook" ng-class="{disabled: vm.isNotificationsFormDisabled()}">
              Select Webhook
            </label>
            <dropdown-selector
              id="recipient-webhook"
              option-name-param="displayName"
              ng-model="vm.recipientToAdd"
              name="recipient-webhook-select"
              options="vm.getAvailableWebhooks()"
              no-options-string="No applicable Webhook."
              empty-option-string="-- Select Webhook --"
              undefined-options-string="-- Select Webhook --"
              ng-disabled="vm.isNotificationsFormDisabled()"
            >
            </dropdown-selector>
          </div>
        </span>
        <span ng-if="vm.recipientType === vm.recipientTypes.JIRA">
          <div class="iq-form-group">
            <label
              class="iq-label"
              for="recipient-jira-project"
              ng-class="{ disabled: vm.isNotificationsFormDisabled() }"
              >Project</label
            >
            <dropdown-selector
              id="recipient-jira-project"
              option-name-param="name"
              ng-model="vm.recipientToAdd"
              name="recipient-project"
              ng-change="vm.recipientToAddIssueType = null"
              options="vm.availableJiraProjects"
              no-options-string="No applicable projects available."
              empty-option-string="-- Select Project --"
              ng-disabled="vm.isNotificationsFormDisabled()"
            >
            </dropdown-selector>
          </div>
          <div class="iq-form-group">
            <label
              class="iq-label"
              for="recipient-jira-issue-type"
              ng-class="{ disabled: vm.isNotificationsFormDisabled() || !vm.recipientToAdd }"
            >
              Issue Type
            </label>
            <dropdown-selector
              id="recipient-jira-issue-type"
              option-name-param="name"
              ng-model="vm.recipientToAddIssueType"
              name="recipient-issue-type"
              options="vm.recipientToAdd.issueTypes"
              no-options-string="No applicable issue type."
              empty-option-string="-- Select Issue Type --"
              undefined-options-string="-- Select JIRA Project --"
              ng-disabled="vm.isNotificationsFormDisabled()"
            >
            </dropdown-selector>
          </div>
        </span>
        <div class="iq-form-group">
          <button
            id="editor-notification-add"
            class="iq-btn"
            type="button"
            ng-click="vm.addRecipient()"
            ng-class="{ disabled: vm.isAddButtonDisabled() }"
            ng-disabled="vm.isAddButtonDisabled()"
          >
            <i class="fa fa-plus"></i>Add
          </button>
        </div>
      </div>
    </ng-form>
    <div load-error="vm.jiraError" reload="vm.doLoad()" message="'Error loading JIRA projects: '"></div>
    <div load-error="vm.webhookError" reload="vm.doLoad()" message="'Error loading webhooks: '"></div>
  </div>
</div>
