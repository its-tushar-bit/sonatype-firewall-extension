<html lang="en" ng-app="dashboardApp">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>CLM Management</title>
    <link href="//netdna.bootstrapcdn.com/twitter-bootstrap/2.3.1/css/bootstrap-combined.no-icons.min.css" rel="stylesheet">
	<link href="//netdna.bootstrapcdn.com/font-awesome/3.1.1/css/font-awesome.css" rel="stylesheet">
    <link href="../css/management.css?${build.timestamp}" rel="stylesheet"/>
    <link rel='shortcut icon' href='../favicon.ico'/>
    <script type='text/javascript'>
        var clmBuildTimestamp = '${build.timestamp}';
    </script>
    <script src='../jquery/jquery-1.8.3.min.js'></script>
    <script src="//netdna.bootstrapcdn.com/twitter-bootstrap/2.3.1/js/bootstrap.min.js"></script>
    <script src='../angular/angular-1.0.6.min.js'></script>
    <script src='../angular/angular-sanitize-1.0.6.min.js'></script>
    <script src='//angular-ui.github.com/ui-router/build/angular-ui-states.js'></script>
    <script src="http://angular-ui.github.io/bootstrap/ui-bootstrap-tpls-0.3.0.js"></script>
    <script src='../CLMLocation.js?${build.timestamp}'></script>
    <script src='../AngularCommon.js?${build.timestamp}'></script>
    <script src='../js/Resource.js?${build.timestamp}'></script>
    <script src='../js/Hudson.js?${build.timestamp}'></script>
    <script src='../ManagementApp.js?${build.timestamp}'></script>
</head>
<body ng-controller='dashboardController'>
	<div class="navbar navbar-fixed-top">
		<div class="navbar-inner">
			<div class="container-fluid">
				<a class="title brand" href="#">
					<img src="../img/sonatype-32.png" alt="Logo" height="32" width="32"/>&nbsp;Sonatype CLM
				</a>
				<form class='form-search'>
					<div class="input-append">
						<input type="text" class="span2 search-query">
						<button type="submit" class="btn btn-primary">Search</button>
					</div>
				</form>
				<span class="pull-right">
					<i class='icon-user  icon-2x'></i>&nbsp;<a href="#">User Name&nbsp;<i class='icon-cog icon-2x'></i></a>
				</span>
			</div>
		</div>
	</div>
	<div class="navbar navbar-inverse navbar-fixed-top navbar-second-row">
		<div class="navbar-inner">
			<div class="container-fluid">
				<div class="btn-group">
					<button class="btn btn-inverse btn-black">{{ $state.selectedDashboard.name }}</button>
					<button class="btn btn-inverse btn-black dropdown-toggle" data-toggle="dropdown">
				  		<span class="caret"></span>
					</button>
					<ul class="dropdown-menu">
						<li ng-repeat="dashboard in availableDashboards">
							<a href='#/{{dashboard.state}}'>{{ dashboard.name }}</a>
						</li>
				  	</ul>
				</div>
			</div>
		</div>
	</div>
	<div class="third-row">
		<div ui-view />
	</div>
</body>
</html>
