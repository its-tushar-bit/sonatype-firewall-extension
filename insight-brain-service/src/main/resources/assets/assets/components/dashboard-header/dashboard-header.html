<script type='text/ng-template' id='change-password'>
  <div class='modal-header'>
    <button type="button" class="close"  ng-click='$dismiss()' aria-hidden="true">&times;</button>
    <h3>Change Password</h3>
  </div>
  <form name='passwordForm' class='form-horizontal' style='margin-bottom:0px' ng-submit='save()'>
    <div class='modal-body'>
      <div class="control-group">
        <label class="control-label" for='originalPassword'>Current password</label>
        <div class="controls">
          <input type="password" id="originalPassword" name="originalPassword" class="input-large" ng-model='result.originalPassword' required focus-input='true'>
        </div>
      </div>
      <hr/>
      <div class="control-group">
        <label class="control-label" for='newPassword'>New password</label>
        <div class="controls">
          <input type="password" id="newPassword" name="newPassword" class="input-large" ng-model='result.newPassword' required>
        </div>
      </div>
      <div class="control-group" ng-class='{ error : passwordForm.confirmPassword.$error.match }'>
        <label class="control-label" for='confirmPassword'>Confirm new password</label>
        <div class="controls">
          <input type="password" id="confirmPassword" name='confirmPassword' class="input-large" ng-model='result.confirmPassword' required match='{{result.newPassword}}'>
          <span ng-show='passwordForm.confirmPassword.$error.match' class="help-inline">Does not match</span>
        </div>
      </div>
    </div>
    <div class='modal-footer'>
      <span style="margin:0px;padding: 4px 35px 4px 14px;float:left;" ng-class="{'alert alert-error': error }" ng-show="error">{{error}}</span>
      <button type='button' class="btn" ng-click='$dismiss()'>Cancel</button>
      <button type='submit' class="btn btn-primary" ng-disabled='passwordForm.$invalid || submitActive'>Change</button>
    </div>
  </form>
</script>
<div class="first-row navbar navbar-fixed-top">
  <div class="navbar-inner">
    <div class="container-fluid">
      <a class="title brand" href="#">
        <img src="img/sonatype-32.png" alt="Logo" height="32" width="32"/>&nbsp;Sonatype CLM
      </a>
      <ul class='inline dashboard-navigation'>
        <li ng-repeat="dashboard in availableDashboards" ng-class='{ "selected" : dashboard == selectedDashboard }'>
          <a ng-href='{{dashboard.href}}' tooltip='{{dashboard.name}}' tooltip-placement='bottom'>
            <i class='glyphicons-sonatype' ng-class='dashboard.icon'></i>
          </a>
        </li>
      </ul>
      <div class="pull-right">
        <ul class='inline dashboard-menus'>
          <li>
            <div class="btn-group pull-right">
              <a class="btn dropdown-toggle" data-toggle="dropdown" href="javascript:;">
                <i class='glyphicons-sonatype user'></i><span class="user-name">{{ username }}</span>
                <span class="caret"></span>
              </a>
              <ul class="dropdown-menu dropdown-menu-arrow">
                <li ng-controller='ChangePassword' ng-show='canChangePassword()'><a ng-click="change()">Change Password</a></li>
                <li ng-controller='LogoutController'><a ng-click="logout()">Logout</a></li>
              </ul>
            </div>
          </li>
        </ul>
        <ul class='inline dashboard-menus'>
          <li>
            <div class="btn-group pull-right">
              <a class='dropdown-toggle' data-toggle="dropdown" href="#">
                <i class='glyphicons-sonatype cogwheel'></i>
              </a>
              <ul class="dropdown-menu dropdown-menu-arrow">
                <li class="disabled"><a tabindex="-1" href="#">System Preferences</a></li>
                <li class="divider"></li>
                <li ng-class="{'active': $state.is('management.security.users') }">
                  <a href='index.html#/management/security/users'>Users</a>
                </li>
                <li ng-class="{'active': $state.is('management.security.global') }">
                  <a href='index.html#/management/security/global'>Global Roles</a>
                </li>
                <li ng-class="{'active': $state.is('management.configuration.productlicense') }">
                  <a href='index.html#/management/configuration/productlicense'>Product License</a>
                </li>
                <li ng-class="{'active': $state.is('management.configuration.proprietarypackages') }">
                  <a href='index.html#/management/configuration/proprietarypackages'>Proprietary Packages</a>
                </li>
                <li ng-class="{'active': $state.includes('management.configuration.ldap') }">
                  <a href='index.html#/management/configuration/ldap'>LDAP</a>
                </li>
              </ul>
            </div>
          </li>
          <li>
            <div class="btn-group pull-right">
              <a class='dropdown-toggle' data-toggle="dropdown" href="#">
                <i class='glyphicons-sonatype help'></i>
              </a>
              <ul class="dropdown-menu dropdown-menu-arrow">
                <li class="disabled"><a tabindex="-1" href="#">Support Options</a></li>
                <li class="divider"></li>
                <li>
                  <a href="http://links.sonatype.com/products/clm/doc" title="Go to Online Help" target="_blank">Online Help</a>
                </li>
              </ul>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
