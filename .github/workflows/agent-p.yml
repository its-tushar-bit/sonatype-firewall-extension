#
# Sonatype Guide - Agentic Patches Workflow
# This workflow was automatically created by the Sonatype Guide GitHub App.
# Learn more: https://guide.sonatype.com
#
# Required secrets:
#   - AGP_GITHUB_TOKEN: GitHub PAT with 'repo' scope (optional, for orgs that restrict GITHUB_TOKEN)
#   - RC_USERNAME: Docker registry username (org secret)
#   - RC_PASSWORD: Docker registry password (org secret)
#
# Optional secrets (needed when agentic mode is enabled):
#   - AWS_ROLE_TO_ASSUME: AWS IAM role ARN for OIDC authentication (required for Bedrock AI agent)
#   - ANTHROPIC_API_KEY: Anthropic API key (only needed if NOT using AWS Bedrock)
#

name: Sonatype Guide - Agent P

on:
  schedule:
    # Run Monday to Friday at 8:07 UTC
    # Minute :07 dodges GitHub's top-of-hour queue contention.
    - cron: '7 6 * * 1-5'   # 06:07 UTC
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout (defaults to branch where workflow was triggered)'
        required: false
        type: string
      mode:
        description: 'Run mode: full or security'
        required: false
        default: 'full'
      vulnerabilities:
        description: 'JSON array of vulnerabilities to fix'
        required: false
      dry-run:
        description: 'Run in dry-run mode (no PRs created)'
        required: false
        default: 'false'
        type: boolean
      verbose:
        description: 'Enable verbose output (may expose sensitive data in logs)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: agp-workflow
  cancel-in-progress: false

jobs:
  agp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Generate .npmrc
        id: npmrc
        run: |
          AUTH_TOKEN=$(echo -n "${RC_USERNAME}:${RC_PASSWORD}" | base64)
          NPMRC_CONTENT=$(cat <<'NPMRC'
          always-auth=true
          registry=https://sonatype.repo.sonatype.app/repository/npm-all/
          //sonatype.repo.sonatype.app/repository/npm-all/:_auth=AUTH_TOKEN_PLACEHOLDER
          NPMRC
          )
          NPMRC_CONTENT="${NPMRC_CONTENT//AUTH_TOKEN_PLACEHOLDER/$AUTH_TOKEN}"
          NPMRC_BASE64=$(echo -n "$NPMRC_CONTENT" | base64 -w 0)
          echo "content=$NPMRC_BASE64" >> "$GITHUB_OUTPUT"
        env:
          RC_USERNAME: ${{ secrets.RC_USERNAME }}
          RC_PASSWORD: ${{ secrets.RC_PASSWORD }}

      - name: Run AGP
        uses: sonatype/agp-action@v1
        with:
          mode: ${{ inputs.mode }}
          vulnerabilities: ${{ inputs.vulnerabilities }}
          create-pr: 'true'
          dry-run: ${{ inputs.dry-run }}
          verbose: ${{ inputs.verbose }}
          # Monorepo mode: AGP auto-discovers all projects in the repository
          # working-directory: 'ui'
          docker-registry: sonatype.repo.sonatype.app/docker-all
          docker-username: ${{ secrets.RC_USERNAME }}
          docker-password: ${{ secrets.RC_PASSWORD }}
          npmrc-content: ${{ steps.npmrc.outputs.content }}
          maven-settings-xml: |
            <?xml version="1.0" encoding="UTF-8"?>
            <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
              <servers>
                <server>
                  <id>sonatype-repo-cloud</id>
                  <username>${{ secrets.RC_USERNAME }}</username>
                  <password>${{ secrets.RC_PASSWORD }}</password>
                </server>
              </servers>
              <mirrors>
                <mirror>
                  <id>sonatype-repo-cloud</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://sonatype.repo.sonatype.app/repository/maven-private/</url>
                </mirror>
              </mirrors>
              <profiles>
                <profile>
                  <id>repository-manager-support</id>
                  <repositories>
                    <repository>
                      <id>central</id>
                      <url>https://repo1.maven.org/maven2</url>
                      <snapshots>
                        <enabled>true</enabled>
                      </snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>central</id>
                      <url>https://repo1.maven.org/maven2</url>
                      <snapshots>
                        <enabled>true</enabled>
                      </snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                <activeProfile>repository-manager-support</activeProfile>
              </activeProfiles>
            </settings>
        env:
          # TODO: Remove once agp image is rebuilt with .com default URL
          AGP_API_URL: https://api.guide.sonatype.com
          # Use custom PAT if provided, otherwise fall back to github.token
          # Organizations may restrict github.token permissions, requiring a PAT
          GITHUB_TOKEN: ${{ secrets.AGP_GITHUB_TOKEN || github.token }}
