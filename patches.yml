---
version: "1.0"
github:
  api:
    url: "https://api.github.com"
    timeout: 30
global:
  maxConcurrentPrs: 6
  dryRun: false
  reviewers:
  - "team-lead"
  labels:
  - "dependencies"
  - "automated"
  pr:
    title: "chore(deps): update {dependency} to {version}"
    description: "Updates {dependency} from {currentVersion} to {version}\n\n### Changes\n\
      {changelog}\n\n### Analysis\n{analysis}\n\n### Additional Information\n- Package:\
      \ {ecosystem}:{dependency}\n- Update Type: {updateType}\n- Breaking Changes:\
      \ {breakingChanges}\n- Security Impact: {securityImpact}"
    commitMessage: "chore(deps): update {dependency} to {version}"
  notifications:
    slack:
      channel: "#dependency-updates"
    email:
      recipients:
      - "mjohnson@sonatype.com"
  rollback:
    enabled: true
    maxAttempts: 3
    onFailure: "notify"
  projects:
    "insight-brain":
      path: "."
      type: "maven"
      enabled: true
      testCommand: "mvn clean install -DskipTests"
    insight-brain-frontend:
      path: "insight-brain-frontend"
      type: "yarn"
      enabled: true
      testCommand: "true" # root project will run a build
scm:
  provider: "GITHUB"
  owner: "sonatype"
  name: "insight-brain"
  apiUrl: "https://api.github.com"
