<div authorization-wrapper="isAuthorized">
  <div class="iq-tile iq-tile--sys-prefs iq-tile--breadcrumb">
    <div breadcrumb state-override="role.name"></div>
  </div>
  <div load-wrapper="error" reload="doLoad()" ng-class="{'container' : error}" class="iq-tile iq-tile--sys-prefs">
    <h5 ng-if='!role'>
      <i class='icon-time'></i> Loading...
    </h5>
    <div ng-if='role'>
      <div class="iq-tile__actions" ng-controller="DeleteRoleController" ng-if="dirtyRole.id">
        <button class="btn" ng-click="deleteRole()" id='delete-role' ng-disabled="readOnly">
          <i class="icon icon-minus-sign"></i> Delete Role
        </button>
      </div>
      <div class="iq-tile-header">
        <div class="iq-tile-header__title">
          <h2>
            <span id='role-title'>{{::role.name || 'New Role'}}</span>
          </h2>
        </div>
      </div>
    </div>
    <div class="iq-tile__content">
      <form name="roleEditor" class="clm-form">
        <h2>Role Details</h2>
        <div clm-control-group for="roleName" label="Role Name">
          <input id="roleName"
                 name="roleName"
                 type="text"
                 maxlength="60"
                 ng-required="true"
                 ng-disabled='readOnly'
                 is-duplicate
                 is-duplicate-array='roles'
                 is-duplicate-id-field='id'
                 messages="{duplicate: 'Name is already in use'}"
                 clm-input
                 valid-name-characters
                 ng-model="dirtyRole.name"
                 focus-input="role">
        </div>
        <div clm-control-group for="roleDescription" label="Role Description">
          <textarea id="roleDescription" name="roleDescription"
                    ng-required="true" maxlength="255" ng-disabled='readOnly'
                    clm-input ng-model="dirtyRole.description"></textarea>
        </div>
        <h2>Permissions</h2>
        <table class="inline-table">
          <tbody ng-repeat="permissionCategory in dirtyRole.permissionCategories">
            <tr>
              <td>
                <h3>{{::permissionCategory.displayName}}</h3>
              </td>
            </tr>
            <tr ng-repeat="permission in permissionCategory.permissions">
              <td>
                <div class="inline-control">
                  <div class="checkbox toggle-checkbox">
                    <label>
                      <input type="checkbox"
                             toggle-checkbox
                             data-on="Can"
                             data-off="Cannot"
                             ng-model="permission.allowed"
                             ng-disabled='readOnly'>
                      <span>{{::permission.displayName}}</span>
                    </label>
                  </div>
                </div>
              </td>
              <td>
                {{::permission.description}}
              </td>
            </tr>
          </tbody>
        </table>
      </form>
      <div clm-alerts="editorAlerts"></div>
      <button class="btn btn-primary"
              ng-disabled="!isDirty() || roleEditor.$invalid || submitActive || readOnly"
              ng-click="save()">
        Save
      </button>
      <button class="btn btn-link btn-cancel" type="button" ng-click="cancel()">Cancel</button>
    </div>
  </div>
</div>
