<item-description>
  <marked>
    `.iq-tile-header` is used for tile titles and placed within `.iq-tile`
  </marked>
</item-description>

<item-example-html>
  <div class="iq-tile">
    <div class="iq-tile-header">
      <div class="iq-tile-header__title">
        <i class="fa fa-flask iq-tile-header__icon"></i>
        <h1>Success Metrics</h1>
      </div>
    </div>
  </div>

  <div class="iq-tile">
    <div class="iq-tile-header">
      <div class="iq-tile-header__title">
        <i class="fa fa-flask iq-tile-header__icon"></i>
        <h1>Success Metrics</h1>
      </div>
      <div class="iq-tile-header__subtitle">
        Success Metrics is an experimental feature providing high level statistics
        on the value you are realizing from Lifecycle.
      </div>
    </div>
  </div>
</item-example-html>
