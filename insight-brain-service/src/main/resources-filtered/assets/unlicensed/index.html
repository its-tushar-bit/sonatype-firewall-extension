<html lang="en" ng-app="Admin">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>Sonatype CLM Server</title>
<link type="text/css" href="../assets/bootstrap/bootstrap-2.3.1.min.css" rel="stylesheet" />
<link type="text/css" href="../assets/css/insight.css?${build.timestamp}" rel="stylesheet" />
<link rel='shortcut icon' href='../assets/favicon.ico' />
<script type='text/javascript'>
    var clmBuildTimestamp = '${build.timestamp}';
</script>
<script type='text/javascript' src='../assets/jquery/jquery-1.8.3.min.js'></script>
<script type='text/javascript' src='../assets/bootstrap/bootstrap-2.3.1.min.js'></script>
<script type='text/javascript' src='../assets/angular/angular-1.0.6.min.js'></script>
<script type='text/javascript' src='../assets/angular/angular-sanitize-1.0.6.min.js'></script>
<script type='text/javascript' src='../assets/angular/ng-upload-0.2.0.js'></script>
<script type='text/javascript' src='../assets/CLMLocation.js?${build.timestamp}'></script>
<script type='text/javascript' src='../assets/AngularCommon.js?${build.timestamp}'></script>
<script type='text/javascript' src='../application-assets/AdminController.js?${build.timestamp}'></script>
</head>
<body>
	<div class="navbar navbar-fixed-top">
		<div class="navbar-inner">
			<div style='width: 950px; margin: auto;'>
				<a class="title brand" href="#"> <img src='../assets/img/sonatype-32.png' alt='Logo' /> <span class='brand-header'>Sonatype CLM</span>
				</a>
			</div>
		</div>
	</div>
	<div class='page-content' ng-controller='AdminController'>
		<div class='container'>
			<div class='modal' style='width: 300px; margin-left: -150px;'>
				<div class='modal-header'>
					<h4>
						<span>Install License</span>
					</h4>
				</div>
				<form ng-upload='installLicense()' action='{{uploadUrl}}' class='form' style='margin: 0px;' method='post'>
					<div class='modal-body'>
						<div class='control-group'>
							<label class='control-label' for='file'>Select a license file to upload:</label>
							<div class='controls'>
								<input type="file" name="file" />
							</div>
						</div>
					</div>
					<div class="modal-footer">
						<input type="submit" class="btn btn-primary upload-submit"
							value="Submit" />
					</div>
				</form>
			</div>
			<div id="licenseInstalledModal" data-backdrop="static" class="modal hide">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">&times;</button>
					<h3>License Installed!</h3>
				</div>
				<div class="modal-body">
					<p>Your license has been installed.  The page will reload in a moment, or <a href='#' ng-click='licenseInstalled()'>refresh</a> now</p>
				</div>
				<div class="modal-footer">
					<button class="btn" ng-click="licenseInstalled()">OK</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
