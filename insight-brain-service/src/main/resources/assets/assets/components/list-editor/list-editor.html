<div style='margin:auto;width:510px'>
  <form ng-submit='add()' name='neditor' class="clm-form list-editor-form">
    <div clm-control-group for="current-entry" label="{{placeHolder}}">
      <div class='input-append controls'>
        <input clm-input type='text' id="current-entry" name='currentEntry' ng-model='currentEntry' max='{{maxLength}}'
               placeholder='Enter {{placeHolder}}' list-editor-validator required entersubmit messages="messages || {}">
        <button class='btn' ng-disabled='neditor.$invalid' title='Add {{placeHolder}}'>Add</button>
      </div>
    </div>
  </form>
  <div class='well well-small list-editor-well'>
    <div>
      <table>
        <tr ng-repeat='entry in entries'>
          <td>
            <div title='{{entry}}'>{{entry}}</div>
          </td>
          <td>
            <button class='btn btn-mini' ng-click='remove($index)' title='Remove {{placeHolder}}'>
              <i class='icon-minus-sign'></i>
            </button>
          </td>
        </tr>
      </table>
    </div>
  </div>
</div>
