<span class="dropdown-selector dropdown">
  <a class="selected-item" ng-class="{disabled: vm.disabled}" data-toggle="dropdown">{{vm.currentlySelectedText()}}<span
          class="caret"></span></a>
  <ul class="dropdown-menu">
    <li ng-repeat="item in vm.options" ng-click="vm.selectItem(item)">
      <a>{{vm.optionNameParam ? item[vm.optionNameParam] : item}}</a>
    </li>
  </ul>
</span>
