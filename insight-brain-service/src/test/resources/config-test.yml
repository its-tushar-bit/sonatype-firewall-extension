logging:
  # The default level of all loggers. Can be OFF, ERROR, WARN, INFO, DEBUG, TRACE, or ALL.
  level: DEBUG
  loggers:
    "eu.medsea.mimeutil.MimeUtil2": INFO
    "org.apache.http": INFO
    "org.eclipse.jetty": INFO
    "com.ning.http.client": INFO
    "org.springframework.jdbc.datasource.init.ResourceDatabasePopulator": INFO
    "org.apache.directory": ERROR
    "com.sonatype.insight.error.ErrorResponseGenerator": TRACE
    "org.apache.shiro.realm.AuthenticatingRealm": INFO
  console:
    logFormat: "%date %level [%thread%X{DC}] %logger - %msg%n"
