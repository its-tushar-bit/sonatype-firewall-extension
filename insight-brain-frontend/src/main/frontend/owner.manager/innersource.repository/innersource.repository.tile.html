<div id="owner-pill-innersource-repository"
     class="iq-tile"
     load-wrapper="vm.error"
     loading="vm.loading"
     reload="vm.load()"
     ng-if="vm.isInnerSourceRepositorySupported && (vm.isOrg || vm.isApp)">
  <div class="iq-tile-header">
    <div class="iq-tile-header__title">
      <h2>InnerSource Repository</h2>
    </div>
    <div class="iq-tile-header__subtitle">
      <span>Configure a repository to identify InnerSource components</span>
    </div>
  </div>
  <div class="iq-tile-content">
    <div class="iq-list">
      <h4 class="iq-list__title">Configuration</h4>
      <div class="iq-list iq-list--clickable">
        <ul>
          <li class="iq-list__item" ng-click="vm.editInnerSourceRepository()">
            <i class="fa fa-chevron-right iq-pull-right"></i>
            <span class="test-list-item-title" ng-if="vm.innerSourceRepository">
              <span ng-if="!vm.innerSourceRepository.inherited">
                {{vm.innerSourceRepository.baseUrl}}
              </span>
              <span ng-if="vm.innerSourceRepository.inherited">
                Inherit from {{vm.innerSourceRepository.ownerName}} ({{vm.innerSourceRepository.baseUrl}})
              </span>
            </span>
            <span class="test-list-item-title" ng-if="!vm.innerSourceRepository">
              InnerSource repository connection not configured
            </span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
