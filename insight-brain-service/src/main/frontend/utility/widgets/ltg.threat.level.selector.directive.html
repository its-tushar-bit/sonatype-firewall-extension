<span class="ltg-threat-level-selector dropdown">
  <a class="selected-threat-level threat-level-background threat-level-{{vm.threatLevelModel}}"
     ng-class="{disabled: vm.disabled}" data-toggle="dropdown">{{vm.threatLevelModel}}</a><!--
  --><a class="caret-button" ng-class="{disabled: vm.disabled}" data-toggle="dropdown"><span class="caret"></span></a>
  <ul class="dropdown-menu">
    <li ng-repeat="threatLevel in vm.threatLevels" ng-click="vm.selectLevel(threatLevel)">
      <a class="threat-level-background threat-level-{{threatLevel}}">{{threatLevel}}</a>
    </li>
  </ul>
</span>
