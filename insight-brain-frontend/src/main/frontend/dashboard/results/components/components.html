<div id="dashboard-components">
  <div class="iq-tile iq-tile--dashboard-table-container" maximize-container-height>
    <div class="iq-scrollable iq-scrollable--fixed-table" detect-scrollbar="vm.appliedFilter">
      <table class="iq-table iq-table--fixed iq-table--dashboard-components">
        <thead class="iq-dashboard-headers iq-table--fixed__header">
          <tr class="iq-table-row components-row"
              sort="vm.results.components.sortFields"
              on-sort-change="vm.sortResults('components', sortFields)">
            <th class="iq-cell iq-cell--header iq-cell--component-name" sort-column="derivedComponentName">
              <span class="header-text">Name</span>
            </th><!--
         --><th class="iq-cell iq-cell--header iq-cell--affected-apps iq-cell--split-line"
                sort-column="-affectedApplications">
              <span class="header-text">Affected Apps</span>
            </th><!--
         --><th class="iq-cell iq-cell--header iq-cell--total-risk" sort-column="-score">
              <span class="header-text">Total Risk</span>
            </th><!--
         --><th class="iq-cell iq-cell--header iq-cell--critical-risk" sort-column="-scoreCritical">
              <span class="header-text">Critical</span>
              <div class="iq-threat-indication critical"></div>
            </th><!--
         --><th class="iq-cell iq-cell--header iq-cell--severe-risk" sort-column="-scoreSevere">
              <span class="header-text">Severe</span>
              <div class="iq-threat-indication severe"></div>
            </th><!--
         --><th class="iq-cell iq-cell--header iq-cell--moderate-risk" sort-column="-scoreModerate">
              <span class="header-text">Moderate</span>
              <div class="iq-threat-indication moderate"></div>
            </th><!--
         --><th class="iq-cell iq-cell--header iq-cell--low-risk" sort-column="-scoreLow" colspan="2">
              <span class="header-text">Low</span>
              <div class="iq-threat-indication none"></div>
            </th>
          </tr>
        </thead>

        <tbody id="dashboard-results"
               class="iq-components-results iq-table--fixed__content"
               form-mask="vm.maskController"
               mask-message="">
          <tr class="iq-table-row iq-clickable"
              ng-repeat="component in vm.results.components.results | limitTo: vm.maxResults"
              ng-click="vm.goToComponentDetails(component)">
            <td class="iq-cell iq-cell--component-name iq-cell--label"
                iq-tooltip
                tooltip-attach-to-body
                tooltip-delay=500
                tooltip-only-on-overflow="true"
                tooltip-text="{{::component.derivedComponentName}}">{{component.derivedComponentName}}</td><!--
         --><td class="iq-cell iq-cell--affected-apps">{{::component.affectedApplications}}</td><!--
         --><td class="iq-cell iq-cell--heatmap iq-cell--total-risk {{::vm.getTextColorClass(component.score)}}"
                 ng-attr-style="background-color: {{::vm.getColor(component.score)}}">{{::component.score}}</td><!--
         --><td class="iq-cell iq-cell--heatmap iq-cell--critical-risk {{::vm.getTextColorClass(component.scoreCritical)}}"
                 ng-attr-style="background-color: {{::vm.getColor(component.scoreCritical)}}">
              {{::component.scoreCritical}}
            </td><!--
         --><td class="iq-cell iq-cell--heatmap iq-cell--severe-risk {{::vm.getTextColorClass(component.scoreSevere)}}"
                 ng-attr-style="background-color: {{::vm.getColor(component.scoreSevere)}}">
              {{::component.scoreSevere}}
            </td><!--
         --><td class="iq-cell iq-cell--heatmap iq-cell--moderate-risk {{::vm.getTextColorClass(component.scoreModerate)}}"
                 ng-attr-style="background-color: {{::vm.getColor(component.scoreModerate)}}">
              {{::component.scoreModerate}}
            </td><!--
         --><td class="iq-cell iq-cell--heatmap iq-cell--low-risk {{::vm.getTextColorClass(component.scoreLow)}}"
                 ng-attr-style="background-color: {{::vm.getColor(component.scoreLow)}}">
              {{::component.scoreLow}}
            </td><!--
         --><td class="iq-cell iq-cell--chevron {{::vm.getTextColorClass(component.scoreLow)}}"
                 ng-attr-style="background-color: {{::vm.getColor(component.scoreLow)}}">
              <i class="fa fa-chevron-right"></i>
            </td>
          </tr>
        </tbody>
      </table>
      <dashboard-common-results results="vm.results.components.results"
                                is-violations-tab="false"
                                needs-acknowledgement="vm.needsAcknowledgement"
                                max-results="vm.maxResults"
                                error="vm.results.components.error"
                                reload="vm.reload()">
      </dashboard-common-results>
    </div>
  </div>
</div>
