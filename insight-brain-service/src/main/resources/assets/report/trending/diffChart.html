<div ng-controller='DiffChartCtrl' class='diff-chart'>
  <ul class='inline'>
    <li ng-repeat='barGraphData in barGraphDatas' ng-class="{ 'striped-li': ($index % 2 == 0) }">
      <h2 class="section-header" style="margin: 0" ng-switch='$index'>
        <span ng-switch-when='0'>Security</span>
        <span ng-switch-when='1'>License</span>
        <span ng-switch-when='2'>Quality</span>
        <span ng-switch-when='3'>Other</span>
      </h2>
      <div bar-chart data='barGraphData' selector='barGraphSelector' diff-selector='barGraphDiffSelector'
           color-renderer='barGraphRenderer' text-renderer='barGraphTextRenderer' y-Max='barGraphMax'
           background-color='getBackgroundColor($index)' height='160' width='100'></div>
    </li>
  </ul>
</div>
