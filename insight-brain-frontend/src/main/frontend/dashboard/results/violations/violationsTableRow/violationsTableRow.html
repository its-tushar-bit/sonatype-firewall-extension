<td class="iq-cell iq-cell--threat iq-cell--link">
  <a ng-href="{{::vm.violationHref}}">
    <span class="iq-threat-indication" threat-class="vm.risk.threatLevel"></span>
    <span class="iq-threat-number">{{::vm.risk.threatLevel}}</span>
  </a>
</td><!--
--><td class="iq-cell iq-cell--label iq-cell--policy iq-cell--link"
       iq-tooltip
       tooltip-attach-to-body
       tooltip-class="dashboard-tooltip"
       tooltip-delay=500
       tooltip-only-on-overflow="true"
       tooltip-text="{{::vm.risk.policyName}}">
  <a ng-href="{{::vm.violationHref}}">
    {{::vm.risk.policyName}}
  </a>
</td><!--
--><td class="iq-cell iq-cell--application iq-cell--link"
       iq-tooltip
       tooltip-attach-to-body
       tooltip-class="dashboard-tooltip"
       tooltip-delay=500
       tooltip-only-on-overflow="true"
       tooltip-text="{{::vm.risk.applicationName}}">
  <a ng-href="{{::vm.violationHref}}">
    {{::vm.risk.applicationName}}
  </a>
</td><!--
--><td class="iq-cell iq-cell--component iq-cell--link"
       iq-tooltip
       tooltip-attach-to-body
       tooltip-class="dashboard-tooltip {{::!vm.risk.displayName && vm.risk.pathnames ? 'pathname' : ''}}"
       tooltip-delay=500
       tooltip-only-on-overflow="true"
       tooltip-overflow-element-selector=".truncate-ellipsis"
       tooltip-text="{{::vm.risk.derivedComponentName}}">
  <a ng-href="{{::vm.violationHref}}">
    <component-display component="vm.risk" truncate="true"></component-display>
  </a>
</td><!--
--><td class="iq-cell iq-cell--age iq-cell--link">
  <a ng-href="{{::vm.violationHref}}">
    {{::vm.risk.firstOccurrenceTime | terseAgo}}
  </a>
</td><!--
--><td class="iq-cell iq-cell--chevron iq-cell--link">
  <a ng-href="{{::vm.violationHref}}">
    <i class="fa fa-chevron-right"></i>
  </a>
</td>
