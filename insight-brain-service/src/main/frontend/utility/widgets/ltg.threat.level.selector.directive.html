<span class="ltg-threat-level-selector dropdown">
  <a class="selected-threat-level threat-level-background threat-level-{{vm.threatLevelModel}}"
     data-toggle="dropdown">{{vm.threatLevelModel}}</a><!--
  --><a class="caret-button" data-toggle="dropdown"><span class="caret"></span></a>
  <ul class="dropdown-menu">
    <li ng-repeat="threatLevel in vm.threatLevels">
      <a ng-click="vm.selectLevel(threatLevel)" class="threat-level-background threat-level-{{threatLevel}}">{{threatLevel}}</a>
    </li>
  </ul>
</span>
