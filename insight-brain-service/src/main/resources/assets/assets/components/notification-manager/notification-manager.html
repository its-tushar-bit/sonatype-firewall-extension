<div id="editNotificationsModal" class="modal hide fade" data-backdrop="static" ng-controller="NotificationManagementController">
	<div class="modal-header">
		<h3>Notifications</h3>
	</div>
	<div class="modal-body">
		<div class='form-horizontal'>
			<table>
				<tr>
					<td>
						<div class="input-append">
							<form ng-submit="addNotificationEmail()" name='neditor'>
								<input type="text" name='email' class="span6" ng-model="currentNotificationEmail" placeholder='Enter Email Address...' email-input required
									entersubmit>
								<button class="btn" ng-disabled="neditor.$invalid" title="Add Notification Email">Add</button>
							</form>
						</div>
					</td>
				</tr>
				<tr>
					<td>
						<div class="well well-small" style="padding: 3px; margin-bottom: 5px; overflow-y: auto; overflow-x: hidden; height: 120px; max-height: 120px;">
							<table class="table table-condensed" style="margin-bottom: 0px;">
								<tr ng-repeat="notificationEmail in notificationEmailList">
									<td style="width: 1%; max-width: 400px; overflow: hidden; border-top: 0px !important; border-bottom: 1px solid #DDDDDD;">
										<div style="overflow: hidden;">{{notificationEmail}}</div>
									</td>
									<td style="width: 99%; text-align: right; border-top: 0px !important; border-bottom: 1px solid #DDDDDD;">
										<button class="btn btn-mini" ng-click="removeNotificationEmail($index)" title="Remove Notification Email">
											<i class="icon-minus-sign"></i>
										</button>
									</td>
								</tr>
							</table>
						</div>
					</td>
				</tr>
			</table>
		</div>
	</div>
	<div class="modal-footer">
		<div>
			<div style="padding-top: 5px; float: left; color: #b94a48;">
				<span ng-show='neditor.email.$error.invalid'>Enter a valid email address</span> <span ng-show='neditor.email.$error.unique'>Enter a unique
					email address</span>
			</div>
			<button class="btn" ng-click="cancelNotificationEmail()">Cancel</button>
			<button class="btn btn-primary" ng-click="doneNotificationEmail()">Done</button>
		</div>
	</div>
</div>
