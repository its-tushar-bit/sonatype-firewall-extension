<div class="container-fluid">
	<div class="btn-group">
		<button class="btn btn-inverse btn-black">{{ selectedDashboard }}</button>
		<button class="btn btn-inverse btn-black dropdown-toggle" data-toggle="dropdown">
	  		<span class="caret"></span>
		</button>
		<ul class="dropdown-menu">
			<li ng-repeat="dashboard in availableDashboards">
				<a href='#' ng-click='changeDashboard(dashboard);'>{{ dashboard }}</a>
			</li>
	  	</ul>
	</div>
</div>
