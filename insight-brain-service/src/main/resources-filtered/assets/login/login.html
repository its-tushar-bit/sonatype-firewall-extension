<html lang="en" ng-app="LoginApp">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>CLM Management</title>
<link href="../assets/css/clm-server.css?${build.timestamp}" rel="stylesheet" />
<link rel='shortcut icon' href='favicon.ico' />
<script src='../assets/lib/jquery/jquery-1.8.3.min.js'></script>
<script src="../assets/lib/bootstrap/bootstrap-2.3.1.min.js"></script>
<script src='../assets/lib/angular/angular-${angularjs.version}.min.js'></script>
<script src='../assets/lib/Base64.js'></script>
<script src='../assets/util/AngularCommon.js?${build.timestamp}'></script>
<script src='../assets/util/CLMLocation.js?${build.timestamp}'></script>
<script src='../assets/js/Hudson.js?${build.timestamp}'></script>
<script src='LoginApp.js?${build.timestamp}'></script>
</head>
<body ng-controller='LoginController'>
	<div class="first-row navbar navbar-fixed-top">
		<div class="navbar-inner">
			<div class="container-fluid">
				<a class="title brand" href="#"> <img src="../assets/img/sonatype-32.png" alt="Logo" height="32" width="32" />&nbsp;Sonatype CLM
				</a>
			</div>
		</div>
	</div>
	<div style="position: absolute; top: 50%; margin-top: -150px; left: 0; width: 100%;">
		<div class="well" style="width: 450px; margin-left: auto; margin-right: auto; background-color:#e8e8e8" ng-show='!redirecting'>
			<form name="loginForm" class="form-horizontal">
				<h2 style="text-align: center;">Welcome to CLM</h2>
				<hr/>
				<div class="control-group">
					<label class="control-label" for='user'>Username</label>
					<div class="controls">
						<input type="text" id='user' placeholder="Enter Username" ng-model="data.username" ng-required="true" autofill>
					</div>
				</div>
				<div class="control-group">
					<label class="control-label" for='password'>Password</label>
					<div class="controls">
						<input type="password" id='password' placeholder="Enter Password" ng-model="data.password" ng-required="true" autofill>
					</div>
				</div>
				<div class="control-group">
					<div class="controls">
						<button type="submit" class="btn btn-primary" ng-click="signIn()" ng-disabled="loginForm.$invalid || processing">Sign in</button>
					</div>
				</div>
			</form>
			<div ng-show='loginError' class='alert alert-error'>{{loginError}}</div>
		</div>
		<div ng-show='redirecting' style='text-align:center'>
			<em>Redirecting...</em>
		</div>
	</div>
</body>
</html>
