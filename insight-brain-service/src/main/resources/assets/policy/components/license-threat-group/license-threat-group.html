<div>
	<div class='add-section'>
		<button type='button' class='btn btn-primary' ng-click='editLicenseGroup()'><i class="icon-white icon-plus-sign"></i> New License Threat Group</button>
	</div>
	<div class='content-section'>
		<div load-error='error' reload='doLoad()'></div>
		<div class='content-container' style='text-align:center;width:370px;margin:auto' ng-show='!licenseGroups && !error'>
			<h5><i class='icon-time'></i> Loading...</h5>
		</div>
		<div class='common-expand-toggle' ng-switch on='allExpanded'>
			<a ng-switch-when="false" ng-click='toggleAll()'><i class="glyphicons-halflings-sonatype expand"></i> Expand All</a>
			<a ng-switch-when="true" ng-click='toggleAll()'><i class="glyphicons-halflings-sonatype collapse"></i> Collapse All</a>
		</div>
        <form name='inlineLicenseGroupForm' form-Submit='inlineSaveLicenseGroup()'>
            <div class="accordion" id="licenseGroups">
                <div class="accordion-group" ng-repeat='licenseGroup in licenseGroups'>
                    <div class="common-accordion-header">
                        <span threat-box selected='licenseGroup.threatLevel' one='1' zero='No Threat'></span>
                        <span class='inline'>
                            <ng-form name="innerInlineLicenseGroupForm">
                                <span id='licenseGroupName' name='licenseGroupName' ng-model='licenseGroup.name' xeditable href='javascript:;' data-emptytext='License Threat Group Name'
                                    data-type='text' alpha-numeric adjustable='true'></span>
                                <span ng-show="innerInlineLicenseGroupForm.licenseGroupName.$error.alphaNumeric"  style='color: #b94a48;'>Name must be alpha numeric</span>
                            </ng-form>
                        </span>
                        <div class='floatRight'>
                            <!-- Removing because row toggles to edit 
                            <a data-toggle="collapse" data-parent="licenseGroups" href="#collapse{{licenseGroup.id}}" style='text-decoration:none'>
                                <i class="icon-list"></i>
                            </a>
                            -->
                            <div class='btn-group'>
                                <a class="btn btn-mini" title="Edit License Threat Group" ng-click='editLicenseGroup(licenseGroup)' type="button"><i class='icon-pencil'></i></a>
                                <a type="button" class="btn btn-mini" title="Remove License Threat Group" ng-click='confirmDeleteLicenseGroup(licenseGroup)'><i class='icon-trash'></i></a>
                            </div>
                        </div>
                    </div>
                    <a class="common-accordion-toggle" data-toggle="collapse" data-parent="licenseGroups" href="#collapse{{licenseGroup.id}}"></a>
                    <div id="collapse{{licenseGroup.id}}" class="common-accordion-body accordion-body collapse">
                        <div class="accordion-inner">
                            <b>Licenses</b>
                            <ul class="unstyled">
                                <li ng-repeat='l in licenseGroup.licenses | orderBy: l.licenseId'>
                                    {{getDisplayName(l.licenseId)}}</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
            <div ng-show='hasInlineChanges()' class='floatRight'>
                <button class="btn" ng-click='inlineRevertLicenseGroups()' type="button">Cancel</button>
                <button class="btn btn-primary" ng-disabled='!canSaveInlineEdit()'>Save</button>
            </div>
        </form>
		<div id='licenseModal' data-backdrop='static' class='modal hide fade'>
			<div class='modal-header'>
				<h3 ng-show='selectedGroup.id == null'>Add License Threat Group</h3>
				<h3 ng-show='selectedGroup.id != null'>Edit License Threat Group</h3>
			</div>
			<div ng-include='editorUrl'></div>
		</div>
		<div id='deleteLicenseGroupModal' data-backdrop='static' class='modal hide fade'>
			<div class='modal-header'>
				<button type='button' class='close' data-dismiss='modal'>&times;</button>
				<h3>Delete License Threat Group?</h3>
			</div>
			<div class='modal-body'>
				<p>Are you sure you want to delete the license threat group <strong>{{selectedGroup.name}}</strong>?</p>
			</div>
			<div class='modal-footer'>
				<button class='btn' data-dismiss='modal'>Cancel</button>
				<button class='btn btn-danger' ng-disabled='!deletedEnabled' ng-click='deleteLicenseGroup();'>Delete
				</button>
			</div>
		</div>
	</div>
	<div error-Modal></div>
</div>
