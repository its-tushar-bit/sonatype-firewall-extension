<div>
  <div class="modal-header">Processing Changes</div>
  <div class="modal-body" ng-if="!vm.error">
    <div ng-if="!vm.reevaluated">Evaluating Component</div>
    <div ng-if="vm.reevaluated">Retrieving Details</div>
    <div class="progress progress-striped active">
      <div class="bar" ng-style="{ width: (vm.reevaluated ? '50%' : '10%') }"></div>
    </div>
  </div>
  <div ng-if="vm.error">
    <div class="modal-body">
      <div ng-if="!vm.reevaluated">An error occurred reevaluating the component. ({{error}})</div>
      <div ng-if="vm.reevaluated">{{error}}</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" ng-click='vm.doProcess()'>Retry</button>
      <button class="btn" ng-click="$dismiss()">Close</button>
    </div>
  </div>
</div>
