<html lang="en" ng-app="managementApp" ng-strict-di>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title ng-bind="'IQ Server - ' + ($state.current.data.title ? $state.current.data.title : '')">IQ Server - Management</title>
    <link href="css/style.css?${build.timestamp}" rel="stylesheet"/>
    <link rel='shortcut icon' href='favicon.ico'/>
    <script type='text/javascript'>
        var clmBuildTimestamp = '${build.timestamp}', clmServerVersion = '${project.version}',
            angularDebug = ${angular.debug};
    </script>
    <script src='js/external.js?${build.timestamp}'></script>
    <script src='js/configuration.js?${build.timestamp}'></script>
    <script src='js/core.js?${build.timestamp}'></script>
    <script src='js/dashboard.js?${build.timestamp}'></script>
    <script src='js/policy.js?${build.timestamp}'></script>
    <script src='js/util.js?${build.timestamp}'></script>
    <script src='js/report.js?${build.timestamp}'></script>
</head>
<body>
  <div main-header></div>
  <div ng-show='!error'>
    <div ui-view></div>
  </div>
  <div ng-cloak ng-if='error' class='alert alert-error' style='margin:86px auto;width:50%;max-width:400px'>
    <h3>Error</h3>
    <p>An unrecoverable error has occurred while loading the page.</p>
    <p>Please try to reload the page, if the problem persists contact your server administrator. ({{error}})</p>
  </div>
  <script type="text/ng-template" id="unsaved-modal">
    <div class="modal-header"><h3>Unsaved Changes</h3></div>
    <div class="modal-body">The page may contain unsaved changes, continuing will discard them.</div>
    <div class="modal-footer">
      <button type="button" class="btn btn-link btn-cancel" ng-click="$dismiss()">Cancel</button>
      <button type="button" class="btn btn-danger pull-right" ng-click="$close()">Continue</button>
    </div>
  </script>
</body>
</html>
