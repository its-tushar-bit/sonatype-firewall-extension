<div>
  <div load-error='error' reload='doLoad()'></div>
  <div class='content-container' style='text-align:center;width:370px;margin:25px auto' ng-show='labels == null && !error'>
    <h5><i class='icon-time'></i> Loading...</h5>
  </div>
  <div ng-show='!error && labels != null'>
    <div class='add-section'>
      <div inline-label-creator></div>
    </div>
    <div class="content-section">
      <div class="content-header">
        <h4>{{selectedApplication.name}} Labels</h4>
      </div>
      <div class="label-list">
        <div ng-repeat='label in labels | orderBy:"label"' style='display:inline-block;'  ng-click='editLabel(label)'>
          <div class="labelContainer" ng-class="{active: selectedLabel.id == label.id}">
            <span class="clmLabel {{label.color}}Label" data-tooltip="{{label.description}}" data-tooltip-placement="bottom"> {{label.label}}</span>
            <span title="Delete {{label.label}} Label" class="icon-remove-circle deleteHoverTransparent" ng-click="deleteLabel(label)"></span></div>
        </div>
        <em ng-show='labels.length == 0'>No labels available</em></div>
      <div ng-include='editorUrl' style="margin-left: 25px;"></div>
    </div>
  </div>
  <div error-Modal></div>
</div>
