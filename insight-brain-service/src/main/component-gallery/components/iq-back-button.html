<item-description>
  <marked>

    Arguments:

    Params      | Type        | Details|
    :---        | :---        | :---
    state       | String      | state to navigate to

    Button text depends on `data.title` configured in the provided state:
    ```js
    $stateProvider.state('home', {
      url: '/home',
      templateUrl: 'app/home.html',
      data: {
        title: 'Gallery Home'
      }
    });
    ```

  </marked>
</item-description>

<item-example-html>
  <iq-back-button state="home"></iq-back-button>
</item-example-html>
