<div class='mid-content'>
  <div load-wrapper="error" reload="doLoad()" ng-if="$state.is('roles')">
    <div authorization-wrapper="isAuthorized">
      <h1 class='page-title'>
        <div class='container roles'>Roles</div>
      </h1>
      <div class='container roles'>
        <div class="role-items">
          <h5 ng-hide='roles'>
            <i class='icon-time'></i> Loading...
          </h5>
          <table ng-show='roles'>
            <tbody>
              <tr ng-repeat="role in roles" class="role-item" ui-sref="roles.editor({roleId: role.id})">
                <td class="role-summary">
                  <h3>{{role.name}}</h3>
                  <div>{{role.description}}</div>
                </td>
                <td>
                  <div class="role-detail-button">
                    <i class="icon-chevron-right"></i>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <div ui-view></div>
</div>
