<item-title></item-title>
<item-description>
  <marked>
    Example of synchronized Trends charts
  </marked>
</item-description>

<div class="iq-tile">
  <div class="iq-tile-header">
    <div class="iq-tile-header__title">
      <h2>Example</h2>
    </div>
  </div>
  <div class="iq-tile-content">
    <table class="iq-table iq-table--pvt-chart-table">
      <thead>
        <th class="iq-cell"></th>
        <th class="iq-cell" ng-class="{inactive: vm.isInactive()}"><h4>12 Week Total</h4></th>
        <th class="iq-cell" ng-class="{inactive: vm.isInactive('all')}"><h4>All Violations</h4></th>
        <th class="iq-cell iq-cell--pvt-gutter"></th>
        <th class="iq-cell" ng-class="{inactive: vm.isInactive('security')}"><h4>Security</h4></th>
        <th class="iq-cell" ng-class="{inactive: vm.isInactive('license')}"><h4>License</h4></th>
        <th class="iq-cell" ng-class="{inactive: vm.isInactive('quality')}"><h4>Quality</h4></th>
        <th class="iq-cell" ng-class="{inactive: vm.isInactive('other')}"><h4>Other</h4></th>
      </thead>
      <tbody>
        <tr class="iq-table-row iq-table-row--pvt-chart-deltas">
          <td class="iq-cell iq-cell--pvt-row-label"><h4>Deltas</h4></td>
          <td class="iq-cell iq-cell--pvt-chart-total" ng-class="{inactive: vm.isInactive()}">
            <div class="iq-cell--pvt-chart-total-number">12</div>
          </td>
          <td class="iq-cell iq-cell--pvt-chart" rowspan="4">
            <div class="iq-violation-trends-chart">
              <render-combined-trends-chart
                      data="vm.totals"
                      statistics="vm.statistics"
                      ng-mouseover="vm.setActive('all')"
                      ng-mouseleave="vm.clearActive()"
                      ng-class="{inactive: vm.isInactive('all')}">
              </render-combined-trends-chart>
            </div>
          </td>
          <td class="iq-cell iq-cell--pvt-gutter" rowspan="4"></td>
          <td class="iq-cell iq-cell--pvt-chart" rowspan="4">
            <div class="iq-violation-trends-chart">
              <render-combined-trends-chart
                      data="vm.security"
                      statistics="vm.statistics"
                      ng-mouseover="vm.setActive('security')"
                      ng-mouseleave="vm.clearActive()"
                      ng-class="{inactive: vm.isInactive('security')}">
              </render-combined-trends-chart>
            </div>
          </td>
          <td class="iq-cell iq-cell--pvt-chart" rowspan="4">
            <div class="iq-violation-trends-chart">
              <render-combined-trends-chart
                      data="vm.license"
                      statistics="vm.statistics"
                      ng-mouseover="vm.setActive('license')"
                      ng-mouseleave="vm.clearActive()"
                      ng-class="{inactive: vm.isInactive('license')}">
              </render-combined-trends-chart>
            </div>
          </td>
          <td class="iq-cell iq-cell--pvt-chart" rowspan="4">
            <div class="iq-violation-trends-chart">
              <render-combined-trends-chart
                      data="vm.quality"
                      statistics="vm.statistics"
                      ng-mouseover="vm.setActive('quality')"
                      ng-mouseleave="vm.clearActive()"
                      ng-class="{inactive: vm.isInactive('quality')}">
              </render-combined-trends-chart>
            </div>
          </td>
          <td class="iq-cell iq-cell--pvt-chart" rowspan="4">
            <div class="iq-violation-trends-chart">
              <render-combined-trends-chart
                      data="vm.other"
                      statistics="vm.statistics"
                      ng-mouseover="vm.setActive('other')"
                      ng-mouseleave="vm.clearActive()"
                      ng-class="{inactive: vm.isInactive('other')}">
              </render-combined-trends-chart>
            </div>
          </td>
        </tr>
        <tr class="iq-table-row iq-table-row--pvt-chart-new">
          <td class="iq-cell iq-cell--pvt-row-label"><h4>New</h4></td>
          <td class="iq-cell iq-cell--pvt-chart-total" ng-class="{inactive: vm.isInactive()}">
            <div class="iq-cell--pvt-chart-total-number">9999</div>
          </td>
        </tr>
        <tr class="iq-table-row iq-table-row--pvt-chart-waived">
          <td class="iq-cell iq-cell--pvt-row-label"><h4>Waived</h4></td>
          <td class="iq-cell iq-cell--pvt-chart-total" ng-class="{inactive: vm.isInactive()}">
            <div class="iq-cell--pvt-chart-total-number">7</div>
          </td>
        </tr>
        <tr class="iq-table-row iq-table-row--pvt-chart-fixed">
          <td class="iq-cell iq-cell--pvt-row-label"><h4>Fixed</h4></td>
          <td class="iq-cell iq-cell--pvt-chart-total" ng-class="{inactive: vm.isInactive()}">
            <div class="iq-cell--pvt-chart-total-number">25</div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="iq-tile">
  <div class="iq-tile-header">
    <div class="iq-tile-header__title">
      <h2>renderCombinedTrendsChart</h2>
    </div>
  </div>
  <div hljs hljs-language="js" hljs-include="'charts/violationTrends/renderCombinedTrendsChart.js'"></div>
</div>
