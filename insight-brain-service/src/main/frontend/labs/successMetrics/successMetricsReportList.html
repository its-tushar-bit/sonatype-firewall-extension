<div id="success-metrics-list" class="tile-container tile-scroll-container">
  <div class="iq-tile" 
       load-wrapper="vm.error" 
       loading="!vm.loaded" 
       reload="vm.$onInit()"
       message="vm.hasDisabledError() ? 'Error:' : undefined"
       can-retry="!vm.hasDisabledError()">
    <div class="iq-tile-header">
      <div class="iq-tile-header__title">
        <i class="fa fa-flask slate iq-tile-header__icon"></i>
        <h1>Success Metrics</h1>
      </div>
      <button id="add-success-metrics-report-btn"
              class="btn btn-tertiary iq-tile__actions"
              ng-click="vm.openAddSuccessMetricsReportModal()">
        <i class="fa fa-plus"></i>
        Add Report
      </button>
      <div class="iq-tile-header__subtitle">
        Success Metrics is an experimental feature providing high-level statistics on the past performance of
        Nexus Lifecycle. If you want to take action on your current policy violations, start with the
        <a ui-sref="dashboard.overview.violations">Dashboard</a>.
      </div>
    </div>
    <div class="iq-action-list">
      <ul>
        <li class="iq-action-list__item iq-action-list__item--empty" ng-if="vm.successMetricsReports.length <= 0">
          No reports have been created.
        </li>
        <li class="iq-action-list__item"
            ng-repeat="report in vm.successMetricsReports"
            ng-click="vm.goToCharts(report.id)">
          <i class="fa fa-chevron-right iq-pull-right"></i>
          {{::report.name}}
        </li>
      </ul>
    </div>
  </div>
</div>
