<html lang="en" ng-app="managementApp">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>CLM Management</title>
    <link href="css/style.css?${build.timestamp}" rel="stylesheet"/>
    <link rel='shortcut icon' href='favicon.ico'/>
    <script type='text/javascript'>
        var clmBuildTimestamp = '${build.timestamp}', clmServerVersion = '${project.version}';
    </script>
    <script src='lib/jquery/jquery-1.8.3.min.js'></script>
    <script src="lib/bootstrap/bootstrap-2.3.1.min.js"></script>
    <script src='lib/angular/angular-${angularjs.version}.min.js'></script>
    <script src='lib/angular/angular-route-${angularjs.version}.min.js'></script>
    <script src='lib/angular/angular-sanitize-${angularjs.version}.min.js'></script>
    <script src='lib/angular-ui-router-0.2.0.min.js'></script>
    <script src='lib/angular-ui-utils-0.0.3.js'></script>
    <script src="lib/ui-bootstrap-tpls-0.6.0.min.js"></script>
    <script src="lib/X-editable/xeditable-0.1.7.min.js"></script>
    <script src='lib/ng-upload-0.3.4.js'></script>
    <script src='lib/Base64.js'></script>
    <script src='lib/zeroclipboard/ZeroClipboard-1.2.3.min.js'></script>
    <script src='js/configuration.js?${build.timestamp}'></script>
    <script src='js/core.js?${build.timestamp}'></script>
    <script src='js/policy.js?${build.timestamp}'></script>
    <script src='js/util.js?${build.timestamp}'></script>
</head>
<body>
  <div dashboard-header></div>
	<div ng-show='!error'>
		<div ui-view></div>
	</div>
	<div ng-if='error' class='alert alert-error' style='margin:86px auto;width:50%;max-width:400px'>
		<h3>Error</h3>
		<p>An unrecoverable error has occurred while loading the page.</p>
		<p>Please try to reload the page, if the problem persists contact your server administrator. ({{error}})</p>
	</div>
	<div id="unsavedModal" class="master-modal modal hide fade" ng-controller="UnsavedController" data-backdrop="static" data-keyboard="false">
		<div class="modal-header"><h3>Unsaved Changes</h3></div>
		<div class="modal-body">The page may contain unsaved changes, continuing will discard them.</div>
		<div class="modal-footer">
			<button type="button" class="btn" ng-click="close(false)">Cancel</button>
			<button type="button" class="btn btn-danger" ng-click="close(true)">Continue</button>
		</div>
	</div>
</body>
</html>
