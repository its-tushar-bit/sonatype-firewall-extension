<div id='licenseGroup' class='row' style='height:100%'>
	<div class='span4' style='height:100%'>
		<div class="content-container content-list" clist>
			<div class="header">License Threat Groups</div>
			<div ng-show='!licenseGroups'><i class='icon-time'></i> Loading</div>
			<div class="body">
				<div ng-repeat='group in licenseGroups | orderBy: group.name' ng-class="{'selected' : selectedGroup.id == group.id}"  ng-click='editLicenseGroup(group)'>
					<i class='icon-chevron-right' style='float:right'></i>
					<span class='threat-level-{{group.threatLevel}} threat-box'></span>&nbsp;<span style='vertical-align:middle'>{{group.name}}</span>
				</div>
			</div>
			<div class="footer">
				<button class="btn btn-add btn-info" ng-click="editLicenseGroup()">
					<i class="icon-white icon-plus-sign"></i> Add License Threat Group
				</button>
			</div>
		</div>
	</div>
	<div class='span8'>
		<div class='content-container' ng-show='selectedGroup == null' style='width:50%;margin:auto;padding:15px;text-align:center'>Select a License Threat Group</div>
		<div class='content-container' ng-show='selectedGroup != null'>
			<div class='modal-header'>
				<button type="button" class="btn btn-mini" style='float:right' ng-click='confirmDeleteLicenseGroup(selectedGroup)' ng-show='selectedGroup.id != null'><i class='icon-trash'></i></button>
				<h3 ng-show='selectedGroup.id == null'>Add License Threat Group</h3>
				<h3 ng-show='selectedGroup.id != null'>Edit License Threat Group</h3>
			</div>
			<div ng-include='editorUrl'></div>
		</div>
	</div>
    <div id='deleteLicenseGroupModal' data-backdrop='static' class='modal hide fade'>
        <div class='modal-header'>
            <button type='button' class='close' data-dismiss='modal'>&times;</button>
            <h3>Delete License Threat Group?</h3>
        </div>
        <div class='modal-body'>
            <p>Are you sure you want to delete the license threat group <strong>{{selectedGroup.name}}</strong>?</p>
        </div>
        <div class='modal-footer'>
            <button class='btn' data-dismiss='modal'>Cancel</button>
            <button class='btn btn-danger' ng-disabled='!deletedEnabled' ng-click='deleteLicenseGroup();'>Delete
            </button>
        </div>
    </div>
    <div error-Modal></div>
</div>
