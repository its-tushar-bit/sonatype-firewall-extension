<div id='license-editor' ng-controller='LicenseEditorController'>
	<div class='load-error' load-error='error' reload='doLoad()'></div>
	<div style='text-align:center;margin:30px' ng-show='!licenses && !error'>
		<h5><i class='icon-time'></i> Loading...</h5>
	</div>
	<div show-if='licenses'>
		<div ng-show='alert' class='alert alert-error'>
			<button type="button" class="close" ng-click='alert = null'>&times;</button>
			<strong>Error</strong> An error occurred while saving the license override. ({{alert}})
		</div>
		<form name='licenseEditorForm' ng-submit='save()'>
			<div style="width:199px;height:212px;overflow:auto;" class="well">
				<!-- TODO this section ought to be scrollable -->
				<ul class="nav nav-list" id="licenseList">
					<li class="nav-header">Declared Licenses</li>
					<li class="license" ng-repeat='licenseId in component.declaredLicenseIds'>
						<img src="public/blue.png"> {{licenses[licenseId].longDisplayName}}</li>
					<li class="divider"></li><li class="nav-header">Observed Licenses</li>
					<li class="license" ng-repeat='licenseId in component.observedLicenseIds'>
						<img src="public/blue.png"> {{licenses[licenseId].longDisplayName}}</li>
				</ul>
			</div>
			<div class="well" style="width:595px">
				<div class="form-horizontal">
					<div class="control-group">
						<label class="control-label">Scope</label>
						<div class="controls">
							<select ng-model='selectedScope'
									ng-options='scope.ownerName for scope in hierarchy'
									required>
							</select>
						</div>
					</div>
					<div class="control-group">
						<label class="control-label" for="licenseselect1376501760921">Status</label>
						<div class="controls" style="text-align:left;">
							<select ng-model='savedState.status'
									ng-options='status.value as status.label for status in statuses'
									required>
							</select>
						</div>
					</div>
					<div class="control-group">
						<label class="control-label" for="license1376501760921">License</label>
						<div class="controls" style="text-align:left;">
							<span ng-switch='savedState.status'>
								<select ng-switch-when='Selected'
										ng-model='savedState.licenseId'
										ng-options='id as license.longDisplayName for (id, license) in selectableLicenses'
										required>
								</select>
								<select ng-switch-when='Overridden'
										ng-model='savedState.licenseId'
										ng-options='id as license.longDisplayName for (id, license) in licenses'
										ng-disabled="savedState.status != 'Overridden'"
										required>
								</select>
							</span>
						</div>
					</div>
					<div class="control-group">
						<label class="control-label" for="comment1376501760921">Comment</label>
						<div class="controls">
							<textarea ng-model='savedState.comment' class="input-xlarge" id="comment1376501760921" rows="3" style="padding:0px;height:62px"></textarea>
						</div>
					</div>
					<div class="controls" style="text-align:right">
						<button type="submit" class="btn btn-primary" ng-disabled="licenseEditorForm.$invalid  || saving">Update</button>
					</div>
				</div>
			</div>
		</form>
	</div>
</div>
