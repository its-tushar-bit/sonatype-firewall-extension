<div class="dropdown-selector dropdown">
  <a class="selected-item" ng-class="{disabled: vm.disabled, 'none-selected': !vm.selectedModel}"
     ng-if="vm.options.length > 0" data-toggle="dropdown">{{vm.getSelectedViewValue()}}<span class="caret"></span></a>
  <ul class="dropdown-menu" ng-if="vm.options.length > 0">
    <li ng-repeat="item in vm.options" ng-click="vm.selectItem(item)">
      <a>{{vm.optionNameParam ? item[vm.optionNameParam] : item}}</a>
    </li>
  </ul>
  <span class="section with-icon warning" ng-if="vm.options.length === 0 && vm.noOptionsString"><i
          class="fa fa-warning"></i>{{vm.noOptionsString}}</span>
</div>
