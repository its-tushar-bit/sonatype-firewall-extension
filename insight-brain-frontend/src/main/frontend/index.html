<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title ng-bind="'IQ Server' + ($state.current.data.title ? ' - ' + $state.current.data.title : '')">IQ Server - Management</title>
    <link rel='shortcut icon' href='favicon.ico?CLM_BUILD_TIMESTAMP'/>

  <link href="style-1.css?CLM_BUILD_TIMESTAMP" rel="stylesheet">
  <link href="style-2.css?CLM_BUILD_TIMESTAMP" rel="stylesheet">

  <script src="bundle.js?CLM_BUILD_TIMESTAMP"></script>

</head>
<body class="iq-body" ng-csp="no-unsafe-eval">
  <main-header ng-if="!$state.params.embeddable" product-edition="{{productEdition}}"></main-header>
  <div ng-show='!error' class="iq-main-view">
    <system-notice></system-notice>
    <change-default-admin-password-notice></change-default-admin-password-notice>
    <div ui-view>
      <div id="login-body-container" class="iq-body-container iq-body-container--single-pane" maximize-container-height>
        <!--
          This element just makes an empty single-pane page behind the login modal. It gets deleted by
          angular-ui-router after login completes
        -->
      </div>
    </div>
    <div id="modal-view"></div>
  </div>
  <div ng-cloak ng-if="error" class="iq-alert iq-alert--error" style="margin:86px auto;width:50%;max-width:400px">
    <i class="fa fa-warning"></i><strong>Error</strong>
    <p>An unrecoverable error has occurred while loading the page.</p>
    <p>Please try to reload the page, if the problem persists contact your server administrator. ({{error}})</p>
  </div>
</body>
</html>
