<div id="ldap-checkusermapping-modal">
  <div class="modal-header">
    <h3>Verify LDAP Field Mappings</h3>
    <span class="icon-question-sign" style="position: absolute;right: 15px;top: 15px;" data-popover="{{infoText}}" data-popover-placement="left"
          data-popover-trigger="mouseenter"></span>
  </div>
  <div class="modal-ldap-user-list">
    <table class="table clm-table-stripe">
      <thead>
      <tr>
        <th>USERNAME</th>
        <th>NAME</th>
        <th>EMAIL</th>
        <th>GROUPS</th>
      </tr>
      </thead>
      <tbody>
      <tr ng-repeat="user in users | orderBy: ['-fieldCount', 'username']">
        <td class="truncate-ellipsis" style="width: 20%; max-width: 1px;" title="{{::user.username}}">{{::user.username}}</td>
        <td class="truncate-ellipsis" style="width: 20%">{{::user.realName}}</td>
        <td class="truncate-ellipsis" style="width: 30%; max-width: 1px;" title="{{::user.email}}">{{::user.email}}</td>
        <td class="truncate-ellipsis" style="width: 30%; max-width: 1px;" title="{{::user.membership}}">{{::user.membership}}</td>
      </tr>
      </tbody>
    </table>
  </div>
  <div class="modal-footer">
    <button class="btn btn-link btn-cancel" ng-click="$close()">Close</button>
  </div>
</div>
