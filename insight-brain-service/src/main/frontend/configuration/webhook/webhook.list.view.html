<div class="scrollable-root-container config tile" maximize-container-height>
  <div load-wrapper="error" reload="doLoad()">
    <div class="container">
      <div id="webhooks-list" class="tile">

        <div class="tile-header webhooks">
          <h2><img src="img/webhooks_20px.png" class="pull-left webhooks-icon" alt="Webhooks">Webhooks</h2>
          <div class="sub-header">
            IQ Server will send a POST request to the specified URL when the associated events occur.
          </div>
        </div>

        <div class="simple-list">
          <h4 class="subsection-header">
            <button class="btn btn-tertiary" ng-click="vm.newWebhook()" id="create-webhook">
              <i class="icon icon-plus"></i> Add a Webhook
            </button>
          </h4>
          <ul>
            <li class="clickable with-subtitle webhook-item" ng-repeat="webhook in vm.webhooks"
                ui-sref="webhooks.edit({webhookId: webhook.id})">
              <div class="title">
                <img src="img/webhooks_16px.png" class="pull-left webhook-icon" alt="Webhooks">
                {{::webhook.url}}
              </div>
              <ul id="webhook-event-type-list">
                <li ng-repeat="eventType in webhook.eventTypes">
                  <i class="fa fa-circle" title="{{::eventType}}"></i>{{::eventType}}
                </li>
              </ul>

              <i class="fa fa-chevron-right"></i>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
