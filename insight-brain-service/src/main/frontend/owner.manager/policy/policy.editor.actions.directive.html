<div load-wrapper="vm.loadError" loading="!vm.actionStages" reload="vm.doLoad()">
  <table>
    <tr class="action-stage" ng-repeat-start="actionStage in vm.actionStages" ng-class="{ expanded: actionStage.isExpanded}">
      <td ng-click="actionStage.isExpanded = !actionStage.isExpanded">
        <div class="twisty-container">
          <span class="twisty" ng-class="{ expand: !actionStage.isExpanded, collapse: actionStage.isExpanded}"></span>
        </div>
        <span>{{::actionStage.stageName}}</span>
      </td>
      <td>
        <label class="radio">
          <input type="radio" ng-model="vm.getActionItem(actionStage.stageTypeId)[0]" ng-value="null" ng-change="vm.conditionallyAddOrRemoveAction(actionStage.stageTypeId, null)"><!--
            --><span>No action</span><!--
                -->
        </label>
      </td>
      <td>
        <label class="radio">
          <input type="radio" ng-model="vm.getActionItem(actionStage.stageTypeId)[0].actionTypeId" value="warn" ng-change="vm.conditionallyAddOrRemoveAction(actionStage.stageTypeId, 'warn')"><!--
            --><span><i class="fa fa-exclamation-triangle warn"></i>Warn</span><!--
                -->
        </label>
      </td>
      <td>
        <label class="radio">
          <input type="radio" ng-model="vm.getActionItem(actionStage.stageTypeId)[0].actionTypeId" value="fail" ng-change="vm.conditionallyAddOrRemoveAction(actionStage.stageTypeId, 'fail')"><!--
            --><span><i class="fa fa-exclamation-circle fail"></i>Fail</span><!--
                -->
        </label>
      </td>
      <td><!--
            --><span class="notification-count">{{vm.getStageNotificationCount(actionStage)}}</span> Notifications
      </td>
    </tr>
    <tr ng-if="actionStage.isExpanded" ng-repeat-end>
      <td colspan="5">CLM-5875 and CLM-5876 to go here</td>
    </tr>
    <tr class="action-stage" ng-class="{ expanded: vm.dirtyPolicy.monitorNotifyActions.isExpanded}">
      <td ng-click="vm.dirtyPolicy.monitorNotifyActions.isExpanded = !vm.dirtyPolicy.monitorNotifyActions.isExpanded">
        <div class="twisty-container">
          <span class="twisty" ng-class="{ expand: !vm.dirtyPolicy.monitorNotifyActions.isExpanded, collapse: vm.dirtyPolicy.monitorNotifyActions.isExpanded}"></span>
        </div>
        <span>Continuous Monitoring</span>
      </td>
      <td></td>
      <td></td>
      <td></td>
      <td><!--
            --><span class="notification-count">{{vm.getMonitoringNotificationCount()}}</span> Notifications
      </td>
    </tr>
    <tr ng-if="vm.dirtyPolicy.monitorNotifyActions.isExpanded">
      <td colspan="5">CLM-5875 and CLM-5876 to go here</td>
    </tr>
  </table>
</div>
