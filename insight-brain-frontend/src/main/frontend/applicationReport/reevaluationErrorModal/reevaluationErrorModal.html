<header class="iq-modal-header">
  <h2><i class="fa fa-refresh"></i>Re-Evaluate Report</h2>
</header>
<div class="iq-modal-footer error">
  <i class="fa fa-warning"></i>Unable to Re-Evaluate Report
  <div class="iq-btn-bar">
    <button class="iq-btn iq-btn--error" ng-click="vm.retry()"><i class="fa fa-refresh"></i>Retry</button>
    <button class="iq-btn" ng-click="vm.cancel()">Cancel</button>
  </div>
</div>
