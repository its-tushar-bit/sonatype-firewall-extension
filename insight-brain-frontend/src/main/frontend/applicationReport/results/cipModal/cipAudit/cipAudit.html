<div load-wrapper="vm.error" loading="vm.auditRecords === undefined" reload="vm.doLoad()">
  <p ng-if="vm.auditRecords.length === 0">No changes were found for this component.</p>
  <div class="iq-scrollable">
    <table
      class="iq-table iq-table--audit-log visual-testing-ignore"
      ng-if="vm.auditRecords.length > 0"
      sort="[vm.sort]"
      on-sort-change="vm.onSortChange(sortFields)"
    >
      <thead>
        <tr class="iq-table-row">
          <th id="audit-date-column-header" class="iq-cell iq-cell--header iq-clickable" sort-column="time">Date</th>
          <th id="audit-user-column-header" class="iq-cell iq-cell--header iq-clickable" sort-column="user">User</th>
          <th id="audit-action-column-header" class="iq-cell iq-cell--header iq-clickable" sort-column="action">
            Action
          </th>
          <th id="audit-detail-column-header" class="iq-cell iq-cell--header iq-clickable" sort-column="detail">
            Detail
          </th>
          <th id="audit-comment-column-header" class="iq-cell iq-cell--header iq-clickable" sort-column="comment">
            Comment
          </th>
        </tr>
      </thead>
      <tbody>
        <tr class="iq-table-row" ng-repeat="record in vm.auditRecords">
          <td class="iq-cell">{{::record.time | date: 'MMM d yyyy, hh:mm:ss a'}}</td>
          <td class="iq-cell">{{::record.user}}</td>
          <td class="iq-cell">{{::record.action}}</td>
          <td class="iq-cell">{{::record.detail}}</td>
          <td class="iq-cell iq-cell--audit-log">{{::record.comment}}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
