<div id="move-app-success-modal">
  <div class="iq-modal-header">
    <h2>
      <i class="fa fa-arrows"></i>Application Moved Successfully!
    </h2>
  </div>
  <div class="iq-modal-content">
    <div class="iq-alert iq-alert--info">
      <i class="fa size-16px fa-info-circle"></i>Please check the following configurations to ensure they do what you expect:
      <ul>
        <li>Policy Notifications</li>
        <li>User Access</li>
      </ul>
    </div>
    <div ng-show="messages" class="iq-alert iq-scrollable">
      <i class="fa size-16px fa-warning"></i>Policy configurations that differ between the old and new parent:
      <ul>
        <li ng-repeat="message in ::messages">{{::message}}</li>
      </ul>
    </div>
  </div>
  <div class="iq-modal-footer">
    <button class="btn btn-primary" ng-click="$close()">OK</button>
  </div>
</div>
