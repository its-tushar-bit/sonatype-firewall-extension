<div id="move-app-error-modal">
  <div class="iq-modal-header">
    <h2><i class="fa fa-arrows"></i>Move Application</h2>
  </div>
  <div class="iq-modal-content">
    <div class="iq-alert iq-alert--info iq-scrollable">
      <h3><i class="fa size-18px fa-warning"></i>Incompatible Destination</h3>
      <div class="iq-list iq-list--bulleted">
        <ul>
          <li ng-repeat="message in ::messages" class="iq-list__item">{{::message}}</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="iq-modal-footer">
    <button class="iq-btn iq-btn--primary" ng-click="$close()">OK</button>
  </div>
</div>
