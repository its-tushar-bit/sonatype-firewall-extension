<div>
	<p ng-show='!policies.length'>No Policies have been defined.</p>
	<div ng-repeat='policy in policies' class="policy-item" ng-click="policy.expanded=!policy.expanded;">
		<table style="width:100%;">
			<tr ng-hide="policy.expanded">
				<td>
					<span class="threat-box threat-level-{{policy.threatLevel}}">{{policy.threatLevel}}</span>&nbsp;<b style='vertical-align:middle'>{{policy.name}}</b>
				</td>
				<td ng-show='editable' style="width:1%;vertical-align:top;">
					<div class='btn-group hover-buttons'>
						<a class="btn btn-mini policy-button" title="Edit Policy" relative-href='/{{policy.id}}'"><i
							class="icon-pencil" style="margin-top:0px;"></i></a>
						<a class="btn btn-mini policy-button" title="Remove Policy" ng-click="remove(policy)"><i
							class="icon-trash" style="margin-top:0px;"></i></a>
					</div>
				</td>
			</tr>
			<tr ng-show="policy.expanded" class="well">
				<td>
					<span class="threat-box threat-level-{{policy.threatLevel}}">{{policy.threatLevel}}</span>&nbsp;<b style='vertical-align:middle'>{{policy.name}}</b>
					<table style="margin-top:10px;">
						<tr class="constraints">
							<td class="header">Constraints:</td>
							<td>
								<span class="constraint-name" ng-repeat="constraint in policy.constraints">{{constraint.name}}</span>
							</td>
						</tr>
						<tr class="actions">
							<td class="header">Actions:</td>
							<td>
								<table>
									<tr>
										<td class="action-item" ng-repeat="stage in getActionStages()">
											<span>{{stage.name}}</span>
											<br>
											<img ng-src='{{getStageIconPath(stage, policy)}}' style="height:40px;width:40px;"/>
										</td>
									</tr>
								</table>
							</td>
						</tr>
					</table>
				</td>
				<td ng-show='editable' style="width:1%;vertical-align:top;">
					<div class='btn-group'>
						<a class="btn btn-mini policy-button" title="Edit Policy" relative-href='/{{policy.id}}'"><i
							class="icon-pencil" style="margin-top:0px;"></i></a>
						<a class="btn btn-mini policy-button" title="Remove Policy" ng-click="remove(policy)"><i
							class="icon-trash" style="margin-top:0px;"></i></a>
					</div>
				</td>
			</tr>
		</table>
	</div>
	<br>
