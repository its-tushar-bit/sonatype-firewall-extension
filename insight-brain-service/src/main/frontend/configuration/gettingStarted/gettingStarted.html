<section id="getting-started" class="iq-body-container iq-body-container--single-pane" maximize-container-height>
  <header class="iq-tile">
    <div class="iq-tile-header">
      <div class="iq-tile-header__title">
        <h1>Welcome to IQ Server</h1>
      </div>
      <div class="iq-tile-header__subtitle" load-wrapper="vm.error" loading="vm.isLoading()" reload="vm.$onInit()">
        You can access this page at any time from the help menu.
        <i class="glyphicons-sonatype medium help iq-icon--getting-started-reference"></i>
      </div>
    </div>
  </header>

  <div ng-if="vm.isDataLoaded()">

    <section class="iq-tile iq-alert" id="hds-unreachable-warning" ng-if="vm.shouldDisplayHdsUnreachable">
      <div class="iq-tile-header">
        <div class="iq-tile-header__title">
          <h2><i class="fa fa-warning"></i>HDS unreachable</h2>
        </div>
        <div class="iq-tile-header__subtitle">
          See IQ Server log for details.
        </div>
      </div>
    </section>

    <product-license-summary ng-if="vm.license" license="vm.license"></product-license-summary>

    <system-setup ng-if="vm.isAuthorizedToViewSystemSetup()"></system-setup>

    <learning-topics></learning-topics>

  </div>
</section>
