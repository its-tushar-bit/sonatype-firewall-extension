<div>
  <div class='marginless-alert' clm-alerts='syncAlerts'></div>
  <div class="root-container" maximize-container-height>
    <div class="navigation-container">
      <div class="tree-view" ng-controller="OwnerTreeViewController">
        <div class="tree-view-header">
          Organizations and Applications
        </div>
        <div load-wrapper="error" loading="!organizations" reload="doLoad()">
          <div class="tree-view-filter search input-prepend">
            <span class="add-on">
              <i role="button" class="fa fa-filter"
                 ng-class="{ 'fa-filter': !filter.value, 'fa-times': filter.value }"
                 ng-click="filter.value = ''"></i>
            </span>
            <input type="text" ng-model="filter.value" autocomplete="off" placeholder="App or Org Name">
          </div>
          <h4 ng-if="filter.value && filter.value.length >= 3">
            Filter Results
          </h4>
          <div ng-if="rootOrganization" class="tree-view-root-organization-group">
            <a class="tree-view-item"
               ng-class="{ selected : $state.includes('management.organization-view', {organizationId: rootOrganization.id}) }"
               ui-sref="management.organization-view({organizationId: rootOrganization.id})">
              <i class="fa fa-globe fa-lg tree-view-icon"></i>
              {{rootOrganization.name}}
              <div class="tree-view-new-organization"
                   ng-class="{ hide : !$state.includes('management.organization-view', {organizationId: rootOrganization.id}) }">
                <button class="btn" ng-click="createOrganization()">
                  <i class="fa fa-plus"></i>
                  New Organization
                </button>
              </div>
            </a>
          </div>
          <div class="tree-view-organization-group"
               ng-repeat="organization in organizations | orderBy:'name'"
               ng-if="organization.isVisible">
            <a class="tree-view-item"
               ng-class="{ selected : $state.includes('management.organization-view', {organizationId: organization.id}) }"
               ui-sref="management.organization-view({organizationId: organization.id})"
               ng-click="organization.isExpanded = true">
              <div class="twisty-container"
                    ng-click="$event.preventDefault();
                                $event.stopPropagation();
                                organization.isExpanded =
                                  $state.includes('management.organization-view', {organizationId: organization.id}) || !organization.isExpanded;">
                <span class="twisty"
                      ng-class="{ empty: organization.applications.length == 0,
                                expand: organization.applications.length > 0 && !organization.isExpanded,
                                collapse: organization.applications.length > 0 && organization.isExpanded }"></span>
              </div><!--
           --><i class="fa fa-sitemap tree-view-icon icon-12px inverse"></i><!--
           -->{{organization.name}}
              <div class="tree-view-new-application"
                   ng-class="{ hide : !$state.includes('management.organization-view', {organizationId: organization.id}) }">
                <button class="btn"
                        ng-click="$event.preventDefault();
                                  $event.stopPropagation();
                                  createApplication(organization);">
                  <i class="fa fa-plus"></i>
                  New Application
                </button>
              </div>
            </a>
            <a class="tree-view-item"
               ng-repeat="application in organization.applications | orderBy:'name'"
               ng-if="organization.isExpanded && application.isVisible"
               ui-sref="management.application-view({applicationPublicId: application.publicId})"
               ng-class="{ selected : $state.includes('management.application-view', {applicationPublicId: application.publicId}) }">
              <i class="fa fa-terminal tree-view-icon icon-12px inverse"></i><!--
         -->{{application.name}}
            </a>
          </div>
        </div>
      </div>
    </div><!--
    --><div ui-view class="body-container"></div>
  </div>
</div>
