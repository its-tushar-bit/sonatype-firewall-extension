<div>
  <script type="text/ng-template" id="dashboard-tabs">
    <div class="iq-tab-bar">
      <a id="tab-button-newest" class="iq-tab" ui-sref-active="active" ui-sref=".violations">
        <i class="fa fa-exclamation"></i>Violations<!--
     --><span class="iq-counter" ng-if="vm.latestResultCounts.newestRisk !== undefined">
          {{vm.latestResultCounts.newestRisk}}
        </span>
      </a>
      <a id="tab-button-component" class="iq-tab" ui-sref-active="active" ui-sref=".components">
        <i class="fa fa-cube size-16px"></i>Components<!--
     --><span class="iq-counter" ng-if="vm.latestResultCounts.componentRisk !== undefined">
          {{vm.latestResultCounts.componentRisk}}
      </span>
      </a>
      <a id="tab-button-application" class="iq-tab" ui-sref-active="active" ui-sref=".applications">
        <i class="fa fa-terminal inverse"></i>Applications<!--
     --><span class="iq-counter" ng-if="vm.latestResultCounts.applicationRisk !== undefined">
          {{vm.latestResultCounts.applicationRisk}}
        </span>
      </a>
    </div>
  </script>

  <root-organization-migrate></root-organization-migrate>
  <div class="dashboard-summary iq-dashboard-summary">
    <!-- TODO load-wrapper="vm.error" loading="!vm.owner" reload="vm.doLoad()"-->
    <div class="iq-tile iq-tile--top-tile iq-tile--dashboard">
      <button id="export-results"
              class="btn btn-tertiary iq-tile__actions"
              onclick="document.forms['export-results'].submit();">
        <i class="fa fa-file-o"></i>Export {{getViewTitle()}} Data
      </button>
      <div class="iq-tile-header">
        <div class="iq-tile-header__title">
          <h1>Results</h1>
        </div>
      </div>
      <dashboard-tabs></dashboard-tabs>
    </div>
  </div>
  <div ui-view="dashboard-results"></div>
  <form id="export-results-form" name="export-results" action="{{getExportUrl()}}"  method="post" enctype="multipart/form-data">
    <input type="hidden" name="filter" value="{{getExportRequestJson()}}">
  </form>
</div>
