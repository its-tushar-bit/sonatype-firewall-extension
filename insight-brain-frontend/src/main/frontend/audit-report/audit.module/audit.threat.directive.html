<div id="componentcontainer" style="width:100%;padding-top:5px" load-wrapper="error" reload="vm.doLoad()" loading="!vm.loaded">
  <script type="text/ng-template" id="repository-violation-table-filter">
    <div>
      <div class="pull-right" id="policy-violation-filter">
        <h4>Violations:</h4>
        <ul class="nav nav-pills">
          <li ng-class="{ active : vm.filter.violationState === 'summary' }" id="summary-violations">
            <a ng-click="vm.filter.violationState = 'summary'">Summary</a>
          </li>
          <li ng-class="{ active : vm.filter.violationState === 'all' }" id="all-violations">
            <a ng-click="vm.filter.violationState = 'all'">All</a>
          </li>
          <li ng-class="{ active : vm.filter.violationState === 'quarantined' }" id="quarantined-violations">
            <a ng-click="vm.filter.violationState = 'quarantined'">Quarantined</a>
          </li>
          <li ng-class="{ active : vm.filter.violationState === 'waived' }" id="waived-violations">
            <a ng-click="vm.filter.violationState = 'waived'">Waived</a>
          </li>
        </ul>
      </div>
      <h4>Filter:</h4>
      <ul class="nav nav-pills" id="policy-match-state-filter">
        <li ng-class="{ active : vm.filter.matchState === 'all' }" id="all-matches">
          <a ng-click="vm.filter.matchState = 'all'">All</a>
        </li>
        <li ng-class="{ active : vm.filter.matchState === 'exact' }" id="exact-matches">
          <a ng-click="vm.filter.matchState = 'exact'">Exact</a>
        </li>
        <li ng-class="{ active : vm.filter.matchState === 'unknown' }" id="unknown-matches">
          <a ng-click="vm.filter.matchState = 'unknown'">Unknown</a>
        </li>
      </ul>
    </div>
  </script>
  <div class="sectionBorder">
    <div repository-violation-table-filter="vm.filter"></div>
    <div class="borderedTable">
      <div id="componentTable"></div>
    </div>
    <div id="componentTablePager"></div>
  </div>
</div>
