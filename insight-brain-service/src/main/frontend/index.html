<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title ng-bind="'IQ Server - ' + ($state.current.data.title ? $state.current.data.title : '')">IQ Server - Management</title>
    <link rel='shortcut icon' href='favicon.ico'/>
    <script type='text/javascript'>
        var clmBuildTimestamp = '<%= config.buildTimestamp %>', clmServerVersion = '<%= config.pom.clmVersion %>',
            angularDebug = <%= config.angularDebug %>;
    </script>

  <link href="css/style-1.css?<%= config.buildTimestamp %>" rel="stylesheet">
  <link href="css/style-2.css?<%= config.buildTimestamp %>" rel="stylesheet">

  <script src="bundle.js?<%= config.buildTimestamp %>"></script>

</head>
<body>
  <main-header product-edition="{{productEdition}}"></main-header>
  <div ng-show='!error' class="main-view">
    <system-notice></system-notice>
    <div ui-view></div>
  </div>
  <div ng-cloak ng-if="error" class="iq-alert iq-alert--error" style="margin:86px auto;width:50%;max-width:400px">
    <i class="fa fa-warning"></i><strong>Error</strong>
    <p>An unrecoverable error has occurred while loading the page.</p>
    <p>Please try to reload the page, if the problem persists contact your server administrator. ({{error}})</p>
  </div>
  <script type="text/ng-template" id="unsaved-modal">
    <div class="iq-modal unsaved-modal">
      <div class="iq-modal-header"><h2>Unsaved Changes</h2></div>
      <div class="iq-modal-content">
        <div class="iq-alert">
          <i class="fa fa-warning"></i>The page may contain unsaved changes, continuing will discard them.
        </div>
      </div>
      <div class='iq-modal-footer'>
        <button class='btn btn-primary' ng-click="$close()">Continue</button>
        <button class='btn' ng-click="$dismiss()">Cancel</button>
      </div>
    </div>
  </script>
</body>
</html>
