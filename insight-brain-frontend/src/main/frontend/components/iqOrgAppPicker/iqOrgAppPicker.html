<iq-tree-view-multi-select available="vm.organizations"
                           selected="vm.selectedOrganizations"
                           on-change="vm.onSelectedOrganizationsChange(selected, toggledId)"
                           filter-placeholder="Organization Name"
                           name="organizations"
                           sort-entities="true"
                           class="tm-organization-tree">
  <i class="fa fa-sitemap iq-tree-view__text-icon iq-tree-view__text-icon--inverse inverse"></i>Organizations
</iq-tree-view-multi-select>

<iq-tree-view-multi-select available="vm.applications"
                           selected="vm.selectedApplications"
                           on-change="vm.onSelectedApplicationsChange(selected)"
                           tooltip-generator="'in ' + entity.organizationName"
                           filter-placeholder="Application Name"
                           name="applications"
                           sort-entities="true"
                           class="tm-application-tree">
  <i class="fa fa-terminal iq-tree-view__text-icon iq-tree-view__text-icon--inverse inverse"></i>Applications
</iq-tree-view-multi-select>
