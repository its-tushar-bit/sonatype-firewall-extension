
-repackageclasses zz

-dontusemixedcaseclassnames

-dontoptimize
-dontshrink
-dontnote

-dontwarn com.sonatype.insight.brain.dataaccess.**
-dontwarn com.sonatype.insight.model.**
-dontwarn zz.com.thoughtworks.xstream.**
-dontwarn zz.de.schlichtherle.**
-dontwarn javax.inject.**
-dontwarn javax.persistence.**
-dontwarn javax.servlet.http.**
-dontwarn javax.ws.rs.**
-dontwarn zz.org.apache.**
-dontwarn zz.org.bouncycastle.**
-dontwarn zz.org.joda.**
-dontwarn zz.com.jcraft.jsch.jce.**
-dontwarn zz.com.jcraft.jsch.jgss.**
-dontwarn zz.org.eclipse.jgit.**
-dontwarn zz.com.googlecode.javaewah**

# 3rd party stuff excluded from obfuscation
-keep class !com.sonatype.insight.**,!zz.org.objectweb.** { *; }

# API of this module
-keep class com.sonatype.insight.rm.** { *; }

# DTOs exposed via API
-keep public class com.sonatype.clm.dto.model.** { *; }

# classes with prominent logging to retain their logger name
-keep public class com.sonatype.insight.scan.**Scanner { *; }

-renamesourcefileattribute SourceFile
-keepattributes *Annotation*,Exceptions,InnerClasses,EnclosingMethod,Signature,SourceFile,LineNumberTable

-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

