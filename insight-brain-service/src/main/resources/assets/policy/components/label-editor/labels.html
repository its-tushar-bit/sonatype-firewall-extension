<div id="label" class='row' style='height:100%'>
	<div class='span4' style='height:100%'>
		<div class="content-container content-list" clist>
			<div class="header">Labels</div>
			<div ng-show='!labels'><i class='icon-time'></i> Loading</div>
			<div class="body">
				<div ng-repeat="label in labels | orderBy:'label'" ng-class="{'selected' : selectedLabel.id == label.id}"  ng-click='editLabel(label)'>
					<i class='icon-chevron-right' style='float:right'></i>
					<span class="clmLabel {{label.color}}Label">{{label.label}}</span>
				</div>
			</div>
			<div class="footer">
				<button class="btn btn-add btn-info" ng-click="editLabel()">
					<i class="icon-white icon-plus-sign"></i> Add Label
				</button>
			</div>
		</div>
	</div>
	<div class='span8'>
		<div class='content-container' ng-show='selectedLabel == null' style='width:50%;margin:auto;padding:15px;text-align:center'>Select a Label</div>
		<div class='content-container' ng-show='selectedLabel'>
			<div class="modal-header">
				<button type="button" class="btn btn-mini" style='float:right' ng-click='confirmDeleteLabel(selecedLabel)' ng-show='selectedLabel.id != null'><i class='icon-trash'></i></button>
				<h3 ng-show='selectedLabel.id == null'>Add Label</h3>
				<h3 ng-show='selectedLabel.id != null'>Edit Label</h3>
			</div>
			<div ng-include='editorUrl'>
			</div>
		</div>
	</div>
	<div id="deleteLabelModal" data-backdrop="static" class="modal fade">
        <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal">&times;</button>
            <h3>Delete Label?</h3>
        </div>
        <div class="modal-body">
            <p>Are you sure you want to delete the label <span class="clmLabel {{selectedLabel.color}}Label">{{selectedLabel.label}}</span>?
            </p>
        </div>
        <div class="modal-footer">
            <button class="btn" data-dismiss="modal">Cancel</button>
            <button class="btn btn-danger" ng-disabled='!deletedEnabled' ng-click="deleteLabel()">Delete</button>
        </div>
    </div>
    <div error-Modal></div>
</div>
