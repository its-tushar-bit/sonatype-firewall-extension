<div id="delete-filters-modal" ng-hide="vm.deleteMode || vm.unsavedModalVisible">
  <div class="iq-modal-header">
    <h2>
      <i class="fa size-20px fa-trash"></i>Delete Filters
    </h2>
  </div>
  <form class="clm-form" role="form" name="deleteFilterForm" ng-submit="vm.deleteFilters()">
    <div class="iq-modal-content iq-scrollable" load-wrapper loading="vm.isLoading">
      <div class="section">
        <div class="field" ng-class="{ 'error' : vm.deleteError }">
          <iq-checkbox ng-repeat="(deleteFilter, selected) in vm.filters"
                       label="{{::deleteFilter}}"
                       is-checked="vm.filters[deleteFilter]"
                       on-click="vm.toggleSelected(deleteFilter)">
          </iq-checkbox>
        </div>
      </div>
    </div>
    <div class="iq-modal-footer" ng-class="{ error : vm.deleteError }">
      <div ng-if="vm.deleteError" class="section error">
        <div ng-repeat="error in vm.deleteError" class="with-icon"><i class="fa fa-warning"></i>
          {{::error}}
        </div>
      </div>
      <button ng-if="!vm.deleteError" class="btn btn-primary" type="submit"
              submit-validation submit-type="Delete" submit-dirty="vm.isDirty()">
        Delete
      </button>

      <button ng-if="vm.deleteError" class="btn btn-error" type="submit">
        <i class="fa fa-refresh"></i>Retry
      </button>
      <button id="dismissBtn" class="btn" type="button" ng-click="$dismiss()">Cancel</button>
    </div>
  </form>
</div>
