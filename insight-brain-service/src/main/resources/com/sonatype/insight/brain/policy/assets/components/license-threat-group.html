<div id='licenseGroup'>
    <div ng-show='!features.licenseGroup' class='span6 offset4 no-content'>License Threat Group content is under
        development.
    </div>
    <div ng-show='features.licenseGroup' class='span4 content-container'>
        <table class='table table-striped' style='margin-bottom:0px'>
            <thead>
            <tr>
                <th colspan='2'>License Threat Groups</th>
            </tr>
            </thead>
            <tr ng-repeat='group in licenseGroups | orderBy: group.name'>
                <td style='height:24px'><span class='threat-level-{{group.threatLevel}} threat-box'></span>&nbsp;<span style='vertical-align:middle'>{{group.name}}</span></td>
                <td style='width:60px'>
					<div class='btn-group'>
                        <button ng-click='editLicenseGroup(group);' class='btn btn-mini btn-edit'
                            title='Edit License Threat Group'><i class='icon-pencil' style='margin-top:0px;'></i>
                        </button>
                        <button ng-click='confirmDeleteLicenseGroup(group);' class='btn btn-mini btn-delete'
                            title='Delete License Threat Group'><i class='icon-trash' style='margin-top:0px;'></i>
                        </button>
					</div>
                </td>
            </tr>
            <tfoot>
            <tr>
                <td colspan='2' style='text-align:center;'>
                    <button class='btn btn-add btn-info' ng-click='editLicenseGroup();' width='80%'><i
                            class='icon-white icon-plus-sign'> </i> Add License Threat Group
                    </button>
                </td>
            </tr>
            </tfoot>
        </table>
    </div>
    <div id='licenseGoupEditModal' data-backdrop='static' class='modal hide'>
        <div class='modal-header'>
            <button type='button' class='close' data-dismiss='modal'>&times;</button>
            <h3 ng-show='selectedGroup.id == null'>Add License Threat Group</h3>

            <h3 ng-show='selectedGroup.id != null'>Edit License Threat Group</h3>
        </div>
        <div ng-include='editorUrl'>
        </div>
    </div>
    <div id='deleteLicenseGroupModal' data-backdrop='static' class='modal hide'>
        <div class='modal-header'>
            <button type='button' class='close' data-dismiss='modal'>&times;</button>
            <h3>Delete License Threat Group?</h3>
        </div>
        <div class='modal-body'>
            <p>Are you sure you want to delete the license threat group {{selectedGroup.name}}?</p>
        </div>
        <div class='modal-footer'>
            <button class='btn' data-dismiss='modal'>Cancel</button>
            <button class='btn btn-primary' ng-disabled='!deletedEnabled' ng-click='deleteLicenseGroup();'>Delete
            </button>
        </div>
    </div>
    <div error-Modal></div>
</div>
