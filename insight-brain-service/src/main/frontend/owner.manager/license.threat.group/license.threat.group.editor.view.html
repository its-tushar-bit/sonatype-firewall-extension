<div id="ltg-editor" class="tile-editor-container">
  <div class="tile" load-wrapper="vm.loadError" loading="!vm.dirtyLTG" reload="vm.doLoad()">
    <h2>
      <i class="fa size-20px fa-book slate">
      </i>{{::vm.dirtyLTG.id ? 'Edit' : 'New'}} License Threat Group
    </h2>

    <form name="vm.ltgEditor" class="clm-form" role="form" ng-submit="vm.save()" novalidate form-mask
          mask-attach-to-body>
      <div class="section">
        <div class="inline-fields">
          <div class="field">
            <label for="editor-ltg-name">License Threat Group Name</label>
            <input id="editor-ltg-name" type="text" name="ltg" required
                   ng-model="vm.dirtyLTG.name"
                   ng-maxlength="60"
                   focus-input="true"
                   valid-name-characters
                   is-duplicate is-duplicate-array="vm.siblings" is-duplicate-id-field="id"
                   messages="{duplicate: 'Name is already in use'}"
                   clm-input>
          </div>
          <div class="field">
            <label for="editor-ltg-threat-level">Threat Level</label>
            <threat-level-selector id="editor-ltg-threat-level" ng-model='vm.dirtyLTG.threatLevel'
                                   threat-type="ltg"></threat-level-selector>
          </div>
        </div>
        <div class="field">
          <label for="editor-ltg-included-licenses">Included Licenses</label>
          <double-column-picker id="editor-ltg-included-licenses" list="vm.availableLicenses"
                                filter-placeholder="License Name" left-column-name="Available"
                                right-column-name="Included" item-name-param="longDisplayName"></double-column-picker>
        </div>
      </div>
      <div class="editor-footer" submit-wrapper="vm.submitError" retry="vm.save()">
        <button id="save-ltg-button" class="btn btn-primary" type="submit" submit-validation
                submit-dirty="vm.isLTGDirty()" submit-type="vm.dirtyLTG.id ? 'update' : 'create'">
          {{vm.dirtyLTG.id ? 'Update' : 'Create'}}
        </button><!--
     --><button id="delete-ltg-button" class='btn btn-tertiary' type="button"
                ng-click="vm.deleteLTG()" ng-if="vm.dirtyLTG && !vm.dirtyLTG.$new">
          <i class="fa fa-fw fa-trash"></i>Delete License Threat Group
        </button>
      </div>
    </form>
  </div>
</div>
