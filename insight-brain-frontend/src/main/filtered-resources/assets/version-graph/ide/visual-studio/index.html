<!doctype html>
<html ng-app="version.graph.app" ng-strict-di>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>Component Information Panel</title>
    <link type="text/css" rel="stylesheet" href="../../../version.graph.app.css?${build.timestamp}">
    <script src="../../../brain.client.js?${build.timestamp}"></script>
    <script src="../../protovis.min.js?${build.timestamp}"></script>
    <script src="../../../version.graph.app.js?${build.timestamp}"></script>
    <script>
      var clmEndpoint = {
        type: 'ide',
        migrate: false,
        selectApplication: false,
        viewDetails: true,
        linkTarget: '_self',
        path: '../../'
      };
      var CLM = {
        path: clmEndpoint.path + '../../',
        assetsPath: clmEndpoint.path + '../'
      };

      // disable the context menu to prevent the user from reloading the page
      $(document).bind('contextmenu', function(e) {
        return false;
      });
    </script>
  </head>
  <body information-panel>
    <noscript>
      <div class="alert alert-error alert-centered">
        It appears that javascript is disabled. Please verify security settings for the domain used for your Nexus IQ
        Server.
      </div>
    </noscript>
  </body>
</html>
