<html lang="en" ng-app="policyApp">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>Application Management</title>
    <link type="text/css" href="../assets/lib/bootstrap/bootstrap-2.3.1.min.css" rel="stylesheet"/>
    <link type="text/css" href="../assets/css/insight.css?${build.timestamp}" rel="stylesheet"/>
    <link type="text/css" href="css/policy.css?${build.timestamp}" rel="stylesheet"/>
    <link rel='shortcut icon' href='../assets/favicon.ico'/>
    <script type='text/javascript'>
        var clmBuildTimestamp = '${build.timestamp}';
    </script>
    <script type='text/javascript' src='../assets/lib/jquery/jquery-1.8.3.min.js'></script>
    <script type='text/javascript' src='../assets/lib/bootstrap/bootstrap-2.3.1.min.js'></script>
    <script type='text/javascript' src='../assets/lib/angular/angular-${angularjs.version}.min.js'></script>
    <script type='text/javascript' src='../assets/lib/angular/angular-sanitize-${angularjs.version}.min.js'></script>
    <script type='text/javascript' src='../assets/js/Resource.js?${build.timestamp}'></script>
    <script type='text/javascript' src='../assets/util/AngularCommon.js?${build.timestamp}'></script>
    <script type='text/javascript' src='../assets/util/CLMLocation.js?${build.timestamp}'></script>
    <script type='text/javascript' src='../assets/util/CLMAppLocation.js?${build.timestamp}'></script>
    <script type='text/javascript' src='../assets/components/policy-editor/PolicyEditor.js?${build.timestamp}'></script>
    <script type='text/javascript' src='../assets/components/notification-manager/NotificationManager.js?${build.timestamp}'></script>
    <script type='text/javascript' src='PolicyApp.js?${build.timestamp}'></script>
    <script type='text/javascript' src='../assets/js/Hudson.js?${build.timestamp}'></script>
    <script type='text/javascript' src='components/policy/PolicyController.js?${build.timestamp}'></script>
    <script type='text/javascript' src='components/license-threat-group/LicenseThreatGroupsController.js?${build.timestamp}'></script>
    <script type='text/javascript' src='components/label-editor/LabelsController.js?${build.timestamp}'></script>
</head>
<body style="height: 100%;">
<div class="navbar navbar-fixed-top">
    <div class="navbar-inner">
        <div style='width:950px;margin:auto'>
            <a class="title brand" href="#"><img src='../assets/img/sonatype-32.png' alt='Logo'/> <span
                    class='brand-header'>Sonatype CLM</span></a>
            <ul class="nav pull-right" ng-controller='TabController'>
                <li ng-class='{ active : tabUrl == "/policy"}' data-placement='bottom' data-title='Policies' tip><a
                        href="#" ng-click="policyTabClick($event)"><img src='../assets/img/glyphicons_263_bank.png'
                                                                        alt='Policies'/></a></li>
                <li ng-class='{ active : tabUrl == "/labels"}' data-placement='bottom' data-title='Labels' tip><a
                        href="#" ng-click="labelTabClick($event)"><img src='../assets/img/glyphicons_065_tag.png'
                                                                       alt='Labels'/></a></li>
                <li ng-class='{ active : tabUrl == "/license-threat-group"}' data-placement='bottom'
                    data-title='License Threat Groups' tip><a href="#" ng-click="licenseGroupTabClick($event)"><img
                        src='../assets/img/glyphicons_332_certificate.png' alt='License Threat Groups'/></a></li>
				<li class='divider-vertical'></li>
				<li data-placement='bottom' data-title='Applications Management' tip>
					<a href="../application-assets/index.html#/management"><img src='../assets/img/image_globe.png' style='width:25px;height:25px' alt='Application Management'/></a>
				</li>
            </ul>
        </div>
    </div>
</div>
<div class='page-content tab-content' ng-cloak>
	<div class='container' style='height:100%' ng-view></div>
</div>
</body>
</html>
