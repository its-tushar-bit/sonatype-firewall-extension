<div>
  <script type="text/ng-template" id="policy-trends-dialog-template">
    <div id="policy-trends-dialog">
      <div class="iq-modal-header">
        <h2>Policy Violation Trends</h2>
      </div>
      <div load-wrapper="error" reload="doLoad()" class="iq-modal-content">
        <div ng-if="!policySummaryData && !error" class="policy-trends-loading">
          <i class="fa fa-spin fa-circle-o-notch loading-spinner"></i> Calculating policy violation trends...
        </div>
        <div ng-if="policySummaryData" id="policySummaryData">
          <table class="table policy-summary-table">
            <thead>
            <tr>
              <th class="category-header">CATEGORY</th>
              <th>COUNT</th>
              <th tooltip="Average age of violations in the category" tooltip-placement="top"
                  tooltip-append-to-body="true">
                AVG
              </th>
              <th tooltip="90 percent of violations have been in the category less than this time" tooltip-placement="top"
                  tooltip-append-to-body="true">
                90%
              </th>
              <th colspan="3">DELTA</th>
              <th>WEEKLY DELTAS</th>
              <th>12 WEEK TREND</th>
            </tr>
            </thead>
            <tbody>
            <tr ng-repeat="category in policySummaryData"
                ng-class="{ 'natural' : category.naturalOrder, 'inverse' : category.naturalOrder === false, 'neutral' : category.naturalOrder === undefined }">
              <td>{{category.name}}</td>
              <td>{{category.counts}}</td>
              <td>{{category.avg | terseTimeSpan}}</td>
              <td>{{category.p90 | terseTimeSpan}}</td>
              <td class="delta-column">
                <i class="sonatype-icons pull-left" ng-class="{'up': category.delta > 0, 'down': category.delta < 0}"></i>
              </td>
              <td class="buffer-column"></td>
              <td class="delta-column">{{category.delta}}</td>
              <td>
                <div value-bars data="category.barChartData"></div>
              </td>
              <td>
                <div sparkline class="chart sparkline" data="category.sparklineData"></div>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="iq-modal-footer">
        <button id="policy-trends-dialog-close" class="btn btn-link btn-cancel" ng-click="$dismiss()">Close</button>
      </div>
    </div>
  </script>
  <script type="text/ng-template" id="dashboard-tabs">
    <div class="iq-tab-bar">
      <a id="tab-button-newest" class="iq-tab" ui-sref-active="active" ui-sref=".violations">
        <i class="fa fa-exclamation"></i>Violations<!--
     --><span class="iq-counter" ng-if="vm.latestResultCounts.newestRisk !== undefined">
          {{vm.latestResultCounts.newestRisk}}
        </span>
      </a>
      <a id="tab-button-component" class="iq-tab" ui-sref-active="active" ui-sref=".components">
        <i class="fa fa-cube size-16px"></i>Components<!--
     --><span class="iq-counter" ng-if="vm.latestResultCounts.componentRisk !== undefined">
          {{vm.latestResultCounts.componentRisk}}
      </span>
      </a>
      <a id="tab-button-application" class="iq-tab" ui-sref-active="active" ui-sref=".applications">
        <i class="fa fa-terminal inverse"></i>Applications<!--
     --><span class="iq-counter" ng-if="vm.latestResultCounts.applicationRisk !== undefined">
          {{vm.latestResultCounts.applicationRisk}}
        </span>
      </a>
    </div>
  </script>

  <root-organization-migrate></root-organization-migrate>
  <div class="dashboard-summary iq-dashboard-summary">
    <!-- TODO load-wrapper="vm.error" loading="!vm.owner" reload="vm.doLoad()"-->
    <div class="iq-tile iq-tile--top-tile iq-tile--dashboard">
      <div class="iq-tile__actions">
        <div class="iq-dropdown">
          <button class="btn btn-tertiary"
                  type="button"
                  data-toggle="dropdown"
                  id="view-dropdown">
            View
            <span class="caret"></span>
          </button>
          <div class="dropdown-menu iq-dropdown-menu">
            <div class="iq-dropdown-menu__actions">
              <a id="show-trend-dialog" ng-click="showTrendDialog()" class="btn iq-btn--dropdown">
                <i class="fa fa-calculator"></i>Calculate Trends
              </a>
              <a id="export-results" onclick="document.forms['export-results'].submit();" class="btn iq-btn--dropdown">
                <i class="fa fa-file-o"></i>Export {{getViewTitle()}} Data
              </a>
            </div>
          </div>
        </div>
      </div>
      <div class="iq-tile-header">
        <div class="iq-tile-header__title">
          <h1>Results</h1>
        </div>
      </div>
      <dashboard-tabs></dashboard-tabs>
    </div>
  </div>
  <div ui-view="dashboard-results"></div>
  <form id="export-results-form" name="export-results" action="{{getExportUrl()}}"  method="post" enctype="multipart/form-data">
    <input type="hidden" name="filter" value="{{getFilterJson()}}">
  </form>
</div>
