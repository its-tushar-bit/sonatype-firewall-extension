<html lang="en" ng-app="managementApp" ng-strict-di class="nx-html nx-html--enable-color-schemes">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title ng-bind="($state.current.data.title ? ($state.current.data.title + ' - ') : '') + ($state.current.data.product || 'Lifecycle')">
      Lifecycle
    </title>

    <link rel="icon"  type="image/svg+xml" href="{{($state.current.data.favicon || 'productIcons/Lifecycle') + '.svg?CLM_BUILD_TIMESTAMP'}}" />

    <!-- Fallback Favicon for Safari which doesn't support multiple favicons per domain -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?CLM_BUILD_TIMESTAMP" />

    <link href="style.css?CLM_BUILD_TIMESTAMP" rel="stylesheet" />

    <script src="bundle.js?CLM_BUILD_TIMESTAMP"></script>
  </head>
  <body class="nx-body" ng-csp="no-unsafe-eval">
    <div
      ng-class="$state.current.data.additionalPageClass ? ['nx-page', $state.current.data.additionalPageClass] : ['nx-page']"
    >
      <div class="nx-system-notice-container">
        <system-notice id="system-notice" ng-if="!error"></system-notice>
        <change-default-admin-password-notice ng-if="!error"></change-default-admin-password-notice>
        <base-url-not-set-notice ng-if="!error"></base-url-not-set-notice>
      </div>
      <toast-container></toast-container>
      <navigation-container
        ng-if="!$state.params.embeddable"
        product-edition="productEdition"
        clm-server-version="CLM_SERVER_VERSION"
      ></navigation-container>
      <main-header ng-if="!$state.params.embeddable" clm-server-version="CLM_SERVER_VERSION"></main-header>
      <div id="iq-content" class="nx-page-content nx-page-content--full-width">
        <div id="iq-sidebar-container"></div>
        <div id="iq-footer-container" class="nx-global-footer-2-container" ng-class="{ 'nx-viewport-sized': $state.current.data.viewportSized }">
          <!-- In order for the footer to be displayed correctly at the bottom when login modal is shown, we need an .nx-page-main -->
          <div class="nx-page-main" ng-if="!username"></div>
          <ui-view ng-if="!error" ng-class="{ 'nx-viewport-sized__container': $state.current.data.viewportSized }"></ui-view>
          <div class="nx-page-main nx-page-main--error" ng-if="error">
            <div ng-cloak class="iq-alert iq-alert--error">
              <i class="fa fa-warning"></i><strong>Error</strong>
              <p>An unrecoverable error has occurred while loading the page.</p>
              <p>Please try to reload the page, if the problem persists contact your server administrator. ({{error}})</p>
            </div>
          </div>
          <iq-footer ng-if="!$state.current.data.hideFooter" product-edition="productEdition"></iq-footer>
        </div>
      </div>
    </div>
    <login-modal id="iq-login-modal-container"></login-modal>
    <modal-container></modal-container>
  </body>
</html>
