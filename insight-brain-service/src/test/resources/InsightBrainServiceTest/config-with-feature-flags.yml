# unspecified features are enabled by default. e.g. 'unspecifiedFeature' is enabled
features:
  enabledFeature: true
  disabledFeature: false

# unspecified experimental features are disabled by default. e.g. 'unspecifiedExperimentalFeature' is disabled
experimentalFeatures:
  enabledExperimentalFeature: true
  disabledExperimentalFeature: false
