<div id="move-app-modal" ng-hide="vm.isHidden">

  <div class='clm-modal-header'>
    <h2>
      <i class="fa fa-arrows"></i>Move Application
    </h2>
  </div>

  <form class="clm-form" name="vm.moveApplicationForm" ng-submit="vm.save()"
        form-mask="vm.formMask" mask-message="Updating the application, this may take a few minutes">

    <div class="clm-modal-body" ng-if="!vm.loadError" load-wrapper loading="vm.isLoading()">
      <div class="section">
        <div class="field">
          <label for="selectParentOrganization">
            New Parent Organization
          </label>
          <dropdown-selector id="selectParentOrganization" name="selectParentOrganization"
                             ng-model="vm.selectedOrganization" options="vm.organizations" option-name-param="name"
                             empty-option-string="{{vm.currentOrganizationName}}" class="move-application-dropdown"
                             required clm-input messages="{required: 'Please select organization'}">
          </dropdown-selector>
        </div>
      </div>
    </div>

    <div class="clm-modal-footer" ng-class="{ error : vm.getError() }">
      <div ng-if="vm.getError()" class="section with-icon"><i class="fa fa-warning"></i>{{::vm.getError()}}</div>
      <button ng-if="!vm.getError()" class="btn btn-primary" type="submit" ng-disabled="vm.isLoading()"
              submit-validation submit-type="Move" submit-dirty="vm.selectedOrganization">
        Move
      </button>
      <button ng-if="vm.saveError" class="btn btn-error" type="submit">
        <i class="fa fa-refresh"></i>Retry
      </button>
      <button id="dismissBtn" class="btn" type="button" ng-click="$dismiss()">{{vm.loadError ? "OK" : "Cancel"}}</button>
      <button ng-if="vm.incompatibilities" class="btn btn-tertiary" type="button" ng-click="vm.showIncompatibilities()">
        Details
      </button>
    </div>

  </form>
</div>
