<ul id="cip-occurrences" class="iq-scrollable">
  <li ng-repeat="pathname in vm.parsedPathnames">
    <strong>
      <span ng-if="pathname.isDependency">Dependency</span>
      {{::pathname.basename}}
    </strong>
    <span ng-if="pathname.dirname">
      <em>located at</em>
      <span ng-if="pathname.isDependency">Module</span>
      {{::pathname.dirname}}
    </span>
  </li>
</ul>
