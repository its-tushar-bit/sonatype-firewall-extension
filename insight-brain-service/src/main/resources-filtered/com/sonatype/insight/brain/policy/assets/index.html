<html lang="en" ng-app="policyApp">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>Application Management</title>
    <link type="text/css" href="../assets/bootstrap/bootstrap-2.3.1.min.css" rel="stylesheet"/>
    <link type="text/css" href="../assets/insight.css?${build.timestamp}" rel="stylesheet"/>
    <link type="text/css" href="policy.css?${build.timestamp}" rel="stylesheet"/>
    <link rel='shortcut icon' href='../assets/favicon.ico'/>
    <script type='text/javascript'>
        var clmBuildTimestamp = '${build.timestamp}';
    </script>
    <script type='text/javascript' src='../assets/jquery/jquery-1.7.2.min.js'></script>
    <script type='text/javascript' src='../assets/bootstrap/bootstrap-2.3.1.min.js'></script>
    <script type='text/javascript' src='../assets/angular/angular-1.0.5.min.js'></script>
    <script type='text/javascript' src='../assets/angular/angular-sanitize-1.0.5.min.js'></script>
    <script type='text/javascript' src='../assets/AngularCommon.js?${build.timestamp}'></script>
    <script type='text/javascript' src='../assets/CLMLocation.js?${build.timestamp}'></script>
    <script type='text/javascript' src='PolicyApp.js?${build.timestamp}'></script>
    <script type='text/javascript' src='../assets/js/Hudson.js?${build.timestamp}'></script>
    <script type='text/javascript' src='js/notification-management.js?${build.timestamp}'></script>
    <script type='text/javascript' src='InsightPolicyController.js?${build.timestamp}'></script>
    <script type='text/javascript' src='InsightLicenseGroupController.js?${build.timestamp}'></script>
    <script type='text/javascript' src='LabelController.js?${build.timestamp}'></script>
</head>
<body style="height: 100%;">
<div class="navbar navbar-fixed-top">
    <div class="navbar-inner">
        <div style='width:950px;margin:auto'>
            <a class="title brand" href="#"><img src='../assets/img/sonatype-32.png' alt='Logo'/> <span
                    class='brand-header'>Sonatype CLM</span></a>
            <ul class="nav pull-right" style='padding-right:25px' ng-controller='TabController'>
                <li ng-class='{ active : tabUrl == "/management"}' data-placement='bottom'
                    data-title='Application Management' tip><a href="../application-assets/index.html"><img
                        style='height: 25px;' src='../assets/img/glyphicons_340_globe.png'
                        alt='Application Management'/></a></li>
                <li ng-class='{ active : tabUrl == "/policy"}' data-placement='bottom' data-title='Policies' tip><a
                        href="#" ng-click="policyTabClick($event)"><img src='../assets/img/glyphicons_263_bank.png'
                                                                        alt='Policies'/></a></li>
                <li ng-class='{ active : tabUrl == "/labels"}' data-placement='bottom' data-title='Labels' tip><a
                        href="#" ng-click="labelTabClick($event)"><img src='../assets/img/glyphicons_065_tag.png'
                                                                       alt='Labels'/></a></li>
                <li ng-class='{ active : tabUrl == "/license-threat-group"}' data-placement='bottom'
                    data-title='License Threat Groups' tip><a href="#" ng-click="licenseGroupTabClick($event)"><img
                        src='../assets/img/glyphicons_332_certificate.png' alt='License Threat Groups'/></a></li>
            </ul>
        </div>
    </div>
</div>
<div class='page-content' ng-cloak>
    <div class="container">
        <div class="tab-content" ng-view></div>
    </div>
</div>
</body>
</html>
