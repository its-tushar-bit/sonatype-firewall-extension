<div>
	<div load-error='error' reload='doLoad()'></div>
	<div class='content-container' style='text-align:center;width:370px;margin:25px auto' ng-show='labels == null && !error'>
		<h5><i class='icon-time'></i> Loading...</h5>
	</div>
	<div ng-show='!error && labels != null'>
		<div class='add-section'>
			<button type='button' class='btn btn-primary' ng-click='editLabel()'><i class="icon-white icon-plus-sign"></i> New Label</button>
		</div>
		<div style='padding-left:10px'>
			<h4>{{selectedApplication.name}} Labels</h4>
			<div>
				<div ng-repeat='label in labels | orderBy:"label"' style='display:inline-block;padding:5px;'  ng-click='editLabel(label)'>
					<span class="clmLabel {{label.color}}Label">{{label.label}}</span>
				</div>
				<em ng-show='labels.length == 0'>No labels available</em>
			</div>
			<div ng-include='editorUrl'></div>
		</div>
		<div id="deleteLabelModal" data-backdrop="static" class="modal fade">
	        <div class="modal-header">
	            <button type="button" class="close" data-dismiss="modal">&times;</button>
	            <h3>Delete Label?</h3>
	        </div>
	        <div class="modal-body">
	            <p>Are you sure you want to delete the label <span class="clmLabel {{selectedLabel.color}}Label">{{selectedLabel.label}}</span>?
	            </p>
	        </div>
	        <div class="modal-footer">
	            <button class="btn" data-dismiss="modal">Cancel</button>
	            <button class="btn btn-danger" ng-disabled='!deletedEnabled' ng-click="deleteLabel()">Delete</button>
	        </div>
	    </div>
    </div>
    <div error-Modal></div>
</div>
