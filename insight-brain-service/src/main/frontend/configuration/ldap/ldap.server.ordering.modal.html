<div id="ldap-server-ordering-modal">
  <div class="iq-modal-header">
    <h2>
      <i class="fa fa-pencil size-20px"></i>Reorder LDAP Servers
    </h2>
  </div>
  <form name="vm.ldapOrderForm" role="form" ng-submit="vm.save()" class="clm-form" form-mask="vm.ldapOrderForm">
    <div class="iq-modal-content no-padding scrolling">
      <div class="pull-right toolbar">
        <button class="btn btn-icon-only btn-tertiary" type="button" id="move-to-first" ng-click="vm.moveToFirst(vm.selected)"
                ng-disabled="!vm.selected || vm.store.indexOf(vm.selected) === 0">
          <span class="fa-stack iq-move-to-top">
            <i class="fa fa-angle-up fa-stack-2x"></i>
            <i class="fa fa-arrow-up fa-stack-1x"></i>
          </span>
        </button>
        <button class="btn btn-icon-only btn-tertiary" type="button" id="move-up" ng-click="vm.moveUp(vm.selected)"
                ng-disabled="!vm.selected || vm.store.indexOf(vm.selected) === 0">
          <i class="fa fa-arrow-up"></i>
        </button>
        <button class="btn btn-icon-only btn-tertiary" type="button" id="move-down" ng-click="vm.moveDown(vm.selected)"
                ng-disabled="!vm.selected || vm.store.indexOf(vm.selected) === vm.store.length - 1">
          <i class="fa fa-arrow-down"></i>
        </button>
        <button class="btn btn-icon-only btn-tertiary" type="button" id="move-to-last" ng-click="vm.moveToLast(vm.selected)"
                ng-disabled="!vm.selected || vm.store.indexOf(vm.selected) === vm.store.length - 1">
          <span class="fa-stack iq-move-to-bottom">
            <i class="fa fa-angle-down fa-stack-2x"></i>
            <i class="fa fa-arrow-down fa-stack-1x"></i>
          </span>
        </button>
      </div>
      <div class="simple-list">
        <ul>
          <li class="clickable" ng-repeat="server in vm.store" ng-click="vm.selected = server" id="{{::server.id}}"
              ng-class="{selected: server === vm.selected}">
            <div class="title single-row-text">
              <span>{{$index + 1}}</span><span>{{::server.name}}</span>
            </div>
          </li>
        </ul>
      </div>
    </div>
    <div class="iq-modal-footer" ng-class="{error : vm.error}">
      <div ng-if="vm.error" class="section with-icon"><i class="fa fa-warning"></i> {{vm.error}}</div>
      <button ng-if="!vm.error" class="btn btn-primary" type="submit" submit-validation submit-dirty="vm.isDirty()">
        Save
      </button>
      <button ng-if="vm.error" class="btn btn-error" type="submit"  submit-validation submit-dirty="vm.isDirty()">
        <i class="fa fa-refresh"></i>Retry
      </button>
      <button class="btn" type="button" ng-click="vm.cancel()">Cancel</button>
    </div>
  </form>
</div>
