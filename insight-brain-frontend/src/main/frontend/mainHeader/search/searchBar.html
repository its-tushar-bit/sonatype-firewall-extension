<div id="advanced-search-outer-wrapper">
  <form id="advanced-search-query-form"
        class="iq-form iq-form--advanced-search iq-form--no-border"
        ng-submit="vm.query && vm.search()">
    <input id="advanced-search-input"
           type="text"
           list="advanced-search-suggestions-list"
           class="iq-text-input iq-text-input--advanced-search"
           ng-model="vm.query"
           ng-trim="false"
           placeholder="Start typing your query for suggestions"
           ng-keyup="vm.searchSuggester()">
    <button id="advanced-search-button" class="iq-btn iq-btn--primary" type="submit">
      Search
    </button>
  </form>
  <div id="advanced-search-error" ng-if="vm.error">
    {{vm.error}}
  </div>
  <datalist id="advanced-search-suggestions-list">
    <option ng-repeat="suggestion in vm.suggestions track by $index" value="{{suggestion}}">
  </datalist>
</div>
