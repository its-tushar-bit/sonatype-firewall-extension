<div>
  <div ng-if="!vm.error && vm.isLoading()"><i class="fa fa-spin fa-circle-o-notch loading-spinner"></i>Loading</div>

  <!--ng-if is important for intial-value-->
  <div ng-if="!vm.error && !vm.isLoading()">
    <div ng-transclude></div>
  </div>

  <div load-error="vm.error" reload="vm.reload()" message="vm.errorMessage"/>
</div>
