<div>
  <div authorization-wrapper="isAuthorized">
    <div class="container roles">
      <div breadcrumb state-override="role.name"></div>
    </div>
    <div load-wrapper="error" reload="doLoad()" ng-class="{'container' : error}">
      <h5 ng-if='!role' class='container roles'>
        <i class='icon-time'></i> Loading...
      </h5>
      <div ng-if='role'>
        <h1 class="page-title">
          <div class="container roles">
            <span ng-controller="DeleteRoleController" ng-if="dirtyRole.id && !role.builtIn">
              <button class="btn pull-right" ng-click="deleteRole()"><i class="icon icon-minus-sign"></i> Delete Role</button>
            </span>
            {{::role.name || 'New Role'}}
          </div>
        </h1>
        <div class="container roles">
          <div class="clm-well well">
            <form name="roleEditor" class="clm-form">
              <h2>Role Details</h2>
              <div clm-control-group for="roleName" label="Role Name">
                <input id="roleName" name="roleName" type="text"
                       ng-required="true" ng-maxlength="60" ng-disabled='role.builtIn'
                       clm-input valid-name-characters ng-model="dirtyRole.name" focus-input="role">
              </div>
              <div clm-control-group for="roleDescription" label="Role Description">
                <textarea id="roleDescription" name="roleDescription"
                          ng-required="true" ng-maxlength="255" ng-disabled='role.builtIn'
                          clm-input ng-model="dirtyRole.description"></textarea>
              </div>
              <h2>Permissions</h2>
              <table class="inline-table">
                <tbody ng-repeat="permissionCategory in permissionCategories">
                  <tr>
                    <td>
                      <h3>{{::permissionCategory.displayName}}</h3>
                    </td>
                  </tr>
                  <tr ng-repeat="permission in permissionCategory.permissions">
                    <td>
                      <div class="inline-control">
                        <div class="checkbox toggle-checkbox">
                          <label>
                            <input type="checkbox" toggle-checkbox  data-on="Can" data-off="Cannot" ng-model="permission.allowed" ng-disabled='role.builtIn'>
                            <span>{{::permission.displayName}}</span>
                          </label>
                        </div>
                      </div>
                    </td>
                    <td>
                      {{::permission.description}}
                    </td>
                  </tr>
                </tbody>
              </table>
            </form>
            <div clm-alerts="editorAlerts"></div>
            <button class="btn btn-link btn-cancel" type="button" ng-click="cancel()">Cancel</button>
            <button class="btn btn-primary pull-right" ng-disabled="roleEditor.$invalid || submitActive || role.builtIn" ng-click="save()">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
