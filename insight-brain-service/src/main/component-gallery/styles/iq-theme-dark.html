<item-description>
  <marked>
    `.iq-sidebar--theme-dark` is a purely stylistic modification to the color scheme of the default sidebar.
  </marked>
</item-description>

<item-example-html>

<!-- force sidebar height/width for the sake of this example -->
<style>
  .iq-sidebar--theme-dark {
    height: 600px;
    width: 300px;
  }
</style>

<div class="iq-sidebar iq-sidebar--theme-dark">
  <h2>Sidebar with dark theming</h2>

  <form ng-init="value = null; objectOptions = [{name: 'foo', value: 1}, {name:'bar', value: 2}]">
    <div class="iq-form-group">
      <label>Object options</label>
      <dropdown-selector options="objectOptions" ng-model="value" option-name-param="name" option-value-param="value">
      </dropdown-selector>
    </div>
    <div class="iq-form-group">
      <label class="iq-label">Default</label>
      <input type="text" class="iq-text-input ng-empty ng-pristine">
    </div>
    <fieldset class="iq-checkbox-group iq-form-group">
      <legend class="iq-label">Checkboxes</legend>
      <iq-checkbox label="Subscribe"></iq-checkbox>
      <iq-checkbox label="disabled" is-disabled="true"></iq-checkbox>
    </fieldset>
    <fieldset class="iq-radio-group iq-form-group">
      <legend class="iq-label">Radio buttons</legend>
      <iq-radio model="color.name" value="'red'">Red</iq-radio>
      <iq-radio model="color.name" value="'blue'" is-disabled="true">Blue</iq-radio>
    </fieldset>
  </form>
  <h3>Primary and default buttons are used unmodified</h3>
  <div class="iq-btn-bar">
    <button class="iq-btn iq-btn--tertiary">Tertiary button</button>
  </div>
  
</div>

</item-example-html>
