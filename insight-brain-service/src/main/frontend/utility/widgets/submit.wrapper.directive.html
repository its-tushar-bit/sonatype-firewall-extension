<div>
  <div error="vm.error" message="vm.errorMessage" retry="vm.retry()">
    <div ng-show="vm.error != null" class="iq-alert iq-alert--error">
      <i class="fa fa-warning"></i><span ng-if="vm.error">{{vm.errorDetails(vm.error)}}</span>
      <div class="iq-btn-bar">
        <a href class="btn btn-error"><i class="fa fa-refresh" ng-click="vm.retry()"></i>Retry</a>
      </div>
    </div>
  </div>
  <div ng-if="!vm.error" ng-transclude/>
</div>
