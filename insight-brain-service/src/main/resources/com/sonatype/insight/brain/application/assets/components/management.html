<div id='applicationManagement' xmlns='http://www.w3.org/1999/html'>
    <button class='btn floatLeft' ng-click='registerNewApplication()'><i class='icon-plus'></i> Register New Application
    </button>
    <div class='input-prepend floatRight'>
        <span class='add-on'><i class='icon-search'></i></span>
        <input type='text' ng-model='searchText'/>
    </div>
    <table class='table table-striped' style='margin-bottom:0px'>
        <thead>
        <tr>
            <th style='padding: 0px'>
                <button class='btn' style='width: 100%' ng-click="order('publicId');">
                    Public Id
                    <i ng-class="{ 'icon-chevron-down' : orderColumn == 'publicId' && orderDirection,
                            'icon-chevron-up' : orderColumn == 'publicId' && !orderDirection,
                            'emptyIconGlyph' : orderColumn != 'publicId' }"></i>
                </button>
            </th>
            <th ng-repeat='stage in stages' style='padding: 0px'>
                <button class='btn' style='width: 100%' ng-click="order(stage.id);">
                    {{stage.name}}
                    <i ng-class="{ 'icon-chevron-down' : orderColumn == stage.id && orderDirection,
                            'icon-chevron-up' : orderColumn == stage.id && !orderDirection,
                            'emptyIconGlyph' : orderColumn != stage.id }"></i>
                </button>
            </th>
            <th></th>
        </tr>
        </thead>
        <tr ng-repeat='application in applications | filter: searchText | orderBy: orderBy:!orderDirection'>
            <td style='text-align: center;'>{{application.publicId}}</td>
            <td ng-repeat='stage in stages' style='text-align: center;'>
                <a ng-show='application.policyEvaluation.stage.stageTypeId == stage.id'
                   href='#/report/{{application.publicId}}/{{application.policyEvaluation.scanId}}'>
                    {{application.policyEvaluation.time | date:'yyyy-MM-dd'}}</a>
            </td>
            <td><a href='/policy-assets/index.html?appId={{application.publicId}}'>Manage Policy</a></td>
        </tr>
        <tfoot>
        <tr>
            <td colspan='2' style='text-align:right;'>
            </td>
        </tr>
        </tfoot>
    </table>
    <div id='addApplicationModal' data-backdrop='static' class='modal hide'>
        <div class='modal-header'>
            <button type='button' class='close' data-dismiss='modal'>×</button>
            <h3>Add Application</h3>
        </div>
        <div class='modal-body'>
            <div class='form-horizontal'>
                <div class='control-group'>
                    <label class='control-label' for='inputApplicationId'>Application Public Id</label>

                    <div class='controls'>
                        <input id='inputApplicationId' type='text' ng-model='applicationPublicId'/>
                    </div>
                </div>
            </div>
        </div>
        <div ng-show='addApplicationError'>
            <div class='alert alert-error'>
                <button type='button' class='close' ng-click='clearAddApplicationError()'>&times;</button>
                <strong>Error</strong> {{addApplicationError}}
            </div>
        </div>
        <div class='modal-footer'>
            <button class='btn btn-primary' ng-click='addApplication()' ng-disabled='!applicationPublicId'>Add</button>
        </div>
    </div>
    <div error-Modal></div>
</div>
