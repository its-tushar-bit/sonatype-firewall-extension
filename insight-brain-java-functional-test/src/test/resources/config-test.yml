hdsUrl: "http://localhost:8090"
#hdsUrl: "http://localhost:8080/insight-portal"

# Directory for data files.
sonatypeWork: ./target/sonatype-work/clm-server

showRootOrganization: true

importReferencePoliciesFromHDS: false

logging:
  level: INFO
  loggers:
    "com.sonatype": DEBUG
    "com.sonatype.insight.audit": "OFF"
    "com.sonatype.insight.test.reverseproxy.jetty": INFO
    "com.spotify.docker.client": DEBUG
    "org.apache.directory": ERROR
  appenders:
    - type: console
      logFormat: "%date %-5level [%thread] %logger - %msg%n"

# HTTP-specific options.
server:
  applicationConnectors:
    - type: http
      # The port on which the HTTP server listens for service requests.
      # Because Java cannot drop privileges in a POSIX system, these
      # ports cannot be in the range 1-1024. A port value of 0 will
      # make the OS use an arbitrary unused port.
      port: 9070

  adminConnectors:
    - type: http
      # The port on which the HTTP server listens for administrative
      # requests. Subject to the same limitations as "port".
      port: 9071
