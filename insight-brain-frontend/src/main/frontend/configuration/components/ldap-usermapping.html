<div id="user-group-mapping-form" class="well clm-well">
  <div ng-if='ldapUserMapping == null' class='ldap-loading'>
    <h5><i class='icon icon-time'></i> Loading...</h5>
  </div>
  <div ng-show='ldapUserMapping != null'>
    <form name='ldapUserMappingEditor' class="clm-form" novalidate>
      <div>
        <div class="content-header">
          <h4>User Element Mapping</h4>
        </div>
        <div clm-control-group for="ldap-user-base-dn" label="Base DN">
          <input clm-input type='text' maxlength='255' name='ldap-user-base-dn' id='ldap-user-base-dn'
                 ng-model="ldapUserMapping.userBaseDN">
        </div>
        <div clm-control-group for="ldap-user-subtree" label="User Subtree">
          <input type='checkbox' name='ldap-user-subtree' id='ldap-user-subtree' ng-model="ldapUserMapping.userSubtree">
        </div>
        <div clm-control-group for="ldap-user-object-class" label="Object Class">
          <input clm-input type='text' maxlength='255' name='ldap-user-object-class' id="ldap-user-object-class"
                 ng-model='ldapUserMapping.userObjectClass' required>
        </div>
        <div clm-control-group for="ldap-user-filter" label="User Filter">
          <input clm-input type='text' maxlength='255' name='ldap-user-filter' id='ldap-user-filter'
                 ng-model='ldapUserMapping.userFilter'>
        </div>
        <div clm-control-group for="ldap-user-id-attribute" label="Username Attribute">
          <input clm-input type='text' maxlength='255' name='ldap-user-id-attribute' id='ldap-user-id-attribute'
                 ng-model='ldapUserMapping.userIDAttribute' required>
        </div>
        <div clm-control-group for="ldap-user-real-name-attribute" label="Real Name Attribute">
          <input clm-input type='text' maxlength='255' name='ldap-user-real-name-attribute' id='ldap-user-real-name-attribute'
                 ng-model='ldapUserMapping.userRealNameAttribute' required>
        </div>
        <div clm-control-group for="ldap-user-email-attribute" label="E-mail Attribute">
          <input clm-input type='text' maxlength='255' name='ldap-user-email-attribute' id='ldap-user-email-attribute'
                 ng-model='ldapUserMapping.userEmailAttribute' required>
        </div>
        <div clm-control-group for="ldap-user-password-attribute" label="Password Attribute">
          <input clm-input type='text' maxlength='255' name='ldap-user-password-attribute' id='ldap-user-password-attribute'
                 ng-model='ldapUserMapping.userPasswordAttribute'>
        </div>

        <div class="content-header">
          <h4>Group Element Mapping</h4>
        </div>
        <div class="control-group">
          <label class="control-label" for="ldap-group-mapping-type">Group Type</label>
          <div class="controls">
            <select name='ldap-group-mapping-type' id='ldap-group-mapping-type' ng-model='ldapUserMapping.groupMappingType'
                    ng-options="p for p in groupMappingTypes" required></select>
          </div>
        </div>
        <div ng-show='ldapUserMapping.groupMappingType == "STATIC"'>
          <div clm-control-group for="ldap-group-base-dn" label="Base DN">
            <input clm-input type='text' maxlength='255' name='ldap-group-base-dn' id='ldap-group-base-dn'
                   ng-model='ldapUserMapping.groupBaseDN'>
          </div>
          <div clm-control-group for="ldap-group-subtree" label="Group Subtree">
            <input type='checkbox' name='ldap-group-subtree' id='ldap-group-subtree' ng-model='ldapUserMapping.groupSubtree'>
          </div>
          <div clm-control-group for="ldap-group-object-class" label="Object Class">
            <input clm-input type='text' maxlength='255' name='ldap-group-object-class' id='ldap-group-object-class'
                   ng-model='ldapUserMapping.groupObjectClass' ng-required='isGroupFieldRequired("STATIC")'>
          </div>
          <div clm-control-group for="ldap-group-id-attribute" label="Group ID Attribute">
            <input clm-input type='text' maxlength='255' name='ldap-group-id-attribute' id='ldap-group-id-attribute'
                   ng-model='ldapUserMapping.groupIDAttribute' ng-required='isGroupFieldRequired("STATIC")'>
          </div>
          <div clm-control-group for="ldap-group-member-attribute" label="Group Member Attribute">
            <input clm-input type='text' maxlength='255' name='ldap-group-member-attribute' id='ldap-group-member-attribute'
                   ng-model='ldapUserMapping.groupMemberAttribute' ng-required='isGroupFieldRequired("STATIC")'>
          </div>
          <div clm-control-group for="ldap-group-member-format" label="Group Member Format">
            <input clm-input type='text' maxlength='255' name='ldap-group-member-format' id='ldap-group-member-format'
                   ng-model='ldapUserMapping.groupMemberFormat' ng-required='isGroupFieldRequired("STATIC")'>
          </div>
        </div>
        <div ng-show='ldapUserMapping.groupMappingType == "DYNAMIC"'>
          <div clm-control-group for="ldap-user-member-of-group-attribute"
               label="Member of Attribute">
            <input clm-input type='text' maxlength='255' name='ldap-user-member-of-group-attribute'
                   id='ldap-user-member-of-group-attribute'
                   ng-model='ldapUserMapping.userMemberOfGroupAttribute'
                   ng-required='isGroupFieldRequired("DYNAMIC")'>
          </div>
          <div clm-control-group for="ldap-dynamic-group-search-enabled"
               label="Group Search">
            <span class="group-search-warning">
              <i class="fa fa-exclamation-triangle size-16px"></i><!--
              -->Disabling group search may improve performance, but groups will not appear in search results.
            </span>
            <div class="toggle-checkbox">
              <input type="checkbox" name='ldap-dynamic-group-search-enabled' id='ldap-dynamic-group-search-enabled' toggle-checkbox  data-on="Enabled" data-off="Disabled" ng-model="ldapUserMapping.dynamicGroupSearchEnabled">
            </div>
          </div>
        </div>
      </div>
    </form>
    <div clm-alerts='alerts'></div>
    <button id="ldap-mapping-save"
            class="btn btn-primary"
            ng-disabled="!canSaveEdit()"
            ng-click="save()">
      Save
    </button>
    <button id="ldap-mapping-cancel"
            class="btn"
            ng-disabled="!isDirty()"
            ng-click="reset()">
      Cancel
    </button>
    <button id="ldap-mapping-check"
            class="btn btn-tertiary"
            ng-disabled="ldapUserMappingEditor.$invalid || testInProgress"
            ng-click="checkUserMapping()">
      Check User Mapping
    </button>
    <button id="ldap-mapping-checklogin"
            class="btn btn-tertiary"
            ng-disabled="ldapUserMappingEditor.$invalid || testInProgress"
            ng-click="checkLogin()">
      Check Login
    </button>
    <span ng-show='saving' style='height: 30px'><i class='icon-time'></i> Saving</span>
  </div>
</div>
