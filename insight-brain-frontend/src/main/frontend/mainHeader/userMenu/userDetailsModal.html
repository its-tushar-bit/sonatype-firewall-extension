<div id="user-details-modal">
  <div class="iq-modal-header">
    <h2>Current User Details</h2>
  </div>
  <div class="iq-modal-content">
    <dl class="iq-read-only iq-read-only--user-details-modal">
      <dt>Username:</dt>
      <!--
   -->
      <dd id="user-details-modal-username" class="iq-read-only-data">{{vm.currentUser.username}}</dd>
      <dt>Display Name:</dt>
      <!--
   -->
      <dd id="user-details-modal-display-name" class="iq-read-only-data">{{vm.currentUser.displayName}}</dd>
      <dt>Groups:</dt>
      <!--
   -->
      <dd id="user-details-modal-groups" class="iq-read-only-data">{{vm.getGroups()}}</dd>
    </dl>
  </div>
  <div class="iq-modal-footer">
    <button id="user-details-modal-close" class="iq-btn" ng-click="vm.close()">Close</button>
  </div>
</div>
