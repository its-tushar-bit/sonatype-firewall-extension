<div class='inline-policy-editor' ng-controller='PolicyEditorController' style="width:875px;">
	<form name='inlinePolicyForm'>
		<div class="control-group" ng-class='{ error : inlinePolicyForm.name.$error.alphaNumeric || inlinePolicyForm.name.$error.spaces }'>
			<input name='name' type='text' ng-model='policy.name' style='margin-bottom:0px' required maxlength='60' alpha-numeric has-whitespace='suggestedName'>
			<span class='policy'><span threat-box selected='policy.threatLevel' one='1' zero='0 (None)'></span></span>
			<span ng-show="inlinePolicyForm.name.$error.alphaNumeric" class="help-inline">Must be alpha numeric</span>
			<span ng-show="inlinePolicyForm.name.$error.spaces && !inlinePolicyForm.name.$error.alphaNumeric" class="help-inline">No leading, trailing or double spaces or tabs, suggested name: {{suggestedName}}</span>
		</div> 
		<div>
			<h5>Constraints</h5>
		</div>
		<div class="accordion">
			<div class="accordion-group  accordion-list" ng-repeat='constraint in policy.constraints'>
				<div class="common-accordion-header">
					<span show-if="constraint.name">{{constraint.name}}</span>
					<span show-if="!constraint.name">New Constraint</span>
					<div class='accordion-header-buttons'>
		                <div class='btn-group hover-buttons'>
		                	<a class="btn btn-mini policy-button" title="Edit Constraint" ng-click="editConstraint(constraint)"><i class="icon-pencil" style="margin-top: 0px;"></i></a>
							<a class="btn btn-mini policy-button" title="Remove Constraint" ng-show="policy.constraints.length > 1" ng-click="removeConstraint(constraint)"><i class="icon-minus-sign" style="margin-top: 0px;"></i></a>
	            			<a class="btn btn-mini policy-button" title="Add Constraint" ng-click="addConstraint()"><i class="icon-plus-sign" style="margin-top: 0px;"></i></a>
						</div>
		            </div>
				</div>
				<a class="common-accordion-toggle" data-toggle="collapse" data-parent="policy.constraints" href="#collapse{{constraint.id}}"></a>
				<div id="collapse{{constraint.id}}" class="common-accordion-body accordion-body collapse">
					<div class="accordion-inner nested-accordion">
						<div ng-include='"../assets/components/policy-editor/constraint-editor.html"'></div>
					</div>
				</div>
			</div>
		</div>
		<div>
			<h5>Actions</h5>
		</div>
		<table class="table table-striped table-bordered table-condensed policy-actions" style="border-top: 0; border-right: 0;">
			<thead>    	
				<tr>
					<th></th>
					<th colspan="2">Enforcement Points</th>
					<th></th>
				</tr>
				<tr>
					<th>Stage</th>
					<th style="text-align:center;">Warn</th>
					<th style="text-align:center;">Fail</th>
					<th style="border-right: 1px solid #ddd;">Custom Actions</th>
				</tr>
			</thead>
			<tr ng-repeat="actionStage in actionStages">
				<td>{{actionStage.name}}</td>
				<td style="height: 22px;text-align:center;cursor:pointer;" ng-click='toggleWarnAction(actionStage,policy)'><img ng-show='showWarningIcon(actionStage, policy)' src='../assets/img/policyalert.png' style="height: 20px; width: 20px;" /></td>
				<td style="text-align:center;cursor:pointer;" ng-click='toggleFailureAction(actionStage,policy)'><img ng-show='showFailureIcon(actionStage, policy)' src='../assets/img/policyerror.png' style="height: 20px; width: 20px;" /></td>
				<td style="width:400px;">
					<div style="width:400px;white-space: nowrap;overflow: hidden;text-overflow: ellipsis;">
						<i class="icon-envelope" style="cursor:pointer;padding-right:5px;" ng-click='editNotification(actionStage,policy)'></i>{{getEmailList(actionStage)}}
					</div>
				</td>
			</tr>
		</table>
		<div clm-alerts='alerts'></div>
		<div class='pull-right' style='padding-bottom:10px;'>
			<button class='btn' type='button' ng-click='cancel()'>Cancel</button>
			<button class='btn btn-primary' type='button' ng-click='savePolicy()'>Save</button>
		</div>
	</form>
</div>
