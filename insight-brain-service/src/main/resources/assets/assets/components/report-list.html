<div class='container'>
	<div class='content-container' style='padding: 20px;'>
		<div class='input-prepend floatLeft'>
		<span class='add-on'><i ng-class="{'icon-search': !searchText, 'icon-remove': searchText}"
								ng-click="searchText = ''"></i></span>
			<input type='text' ng-model='searchText' autocomplete="off" type-Ahead='getApplicationNames'/>
		</div>
		<table class='clm-table table table-striped table-bordered' style='margin-bottom:0px; margin-right: 10px;'>
			<thead>
			<tr>
				<th style='padding: 4px; padding-left:8px'
					ng-class="{ 'buttonColumn' : orderColumn != 'name', 'buttonColumn buttonColumnSorted' : orderColumn == 'name' }"
					ng-click="order('name');">
					Application Name
					<i ng-class="{ 'icon-chevron-down' : orderColumn == 'name' && orderDirection,
							'icon-chevron-up' : orderColumn == 'name' && !orderDirection,
							'emptyIconGlyph' : orderColumn != 'name' }"></i>
				</th>
				<th ng-repeat='stage in stages | filterReportColumns ' style='padding: 4px'
						ng-class="{ 'buttonColumn' : orderColumn != stage.id, 'buttonColumn buttonColumnSorted' : orderColumn == stage.id }"
						ng-click="order(stage.id);">
					{{stage.name}} Report
					<i ng-class="{ 'icon-chevron-down' : orderColumn == stage.id && orderDirection,
							'icon-chevron-up' : orderColumn == stage.id && !orderDirection,
							'emptyIconGlyph' : orderColumn != stage.id }"></i>
				</th>
			</tr>
			</thead>
			<tr ng-repeat='application in applications | filter: searchText | orderBy: orderBy:!orderDirection'>
				<td>
					<a href='index.html#/management/application/{{encodeURIComponent(application.publicId)}}/policies'>
						<img ng-src='../rest/application/icon/{{encodeURIComponent(application.publicId)}}'
							onerror="this.src='../assets/img/defaulticon_application.png';"
							style='height: 24px; width: 24px; margin-right:5px;'/>{{application.name}}
					</a>
				</td>
				<td ng-repeat='stage in stages | filterReportColumns'>
					<div ng-show='stageTypeId == stage.id' ng-repeat='(stageTypeId, result) in application.policyEvaluationsResults'>
						<div>
							<a ng-show='stageTypeId == stage.id' class='no-hover-underline' style='vertical-align: middle;'
							   ng-repeat='(stageTypeId, policyEvaluation) in application.policyEvaluations'
							   title='View Report' href='#/report/{{encodeURIComponent(application.publicId)}}/{{stage.id}}'>
								<img src='../assets/img/glyphicons_263_bank.png' />
								<span ng-show='result.criticalComponentCount > 0' class='threat-chiclet threat-chiclet-critical'>{{result.criticalComponentCount}}</span>
						   		<span ng-show='result.severeComponentCount > 0' class='threat-chiclet threat-chiclet-severe'>{{result.severeComponentCount}}</span>
						   		<span ng-show='result.moderateComponentCount > 0' class='threat-chiclet threat-chiclet-moderate'>{{result.moderateComponentCount}}</span>
								<span ng-show='result.criticalComponentCount == 0 && result.severeComponentCount == 0 && result.moderateComponentCount == 0' style="color:#000000;">No violations</span>
							</a>
						</div>
						<div>
							<a ng-show='stageTypeId == stage.id'
								ng-repeat='(stageTypeId, policyEvaluation) in application.policyEvaluations'
				  				title='View Report' href='#/report/{{encodeURIComponent(application.publicId)}}/{{stage.id}}'>
								{{policyEvaluation.time | date:'yyyy-MM-dd'}}</a>
						</div>
				   	</div>
				</td>
			</tr>
		</table>
	</div>
</div>
