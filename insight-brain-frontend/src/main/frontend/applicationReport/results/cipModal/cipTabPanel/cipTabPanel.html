<div id="informationPanel">
  <ul class="nav nav-tabs">
    <li ng-class="{ active: vm.selectedTab === 'componentInfo' }">
      <a ng-click="vm.selectedTab = 'componentInfo'">Component Info</a>
    </li>
    <li ng-class="{ active: vm.selectedTab === 'policy' }">
      <a ng-click="vm.selectedTab = 'policy'">Policy</a>
    </li>
    <li ng-class="{ active: vm.selectedTab === 'similar'}">
      <a ng-click="vm.selectedTab = 'similar'">Similar</a>
    </li>
    <li ng-class="{ active: vm.selectedTab === 'occurrences' }">
      <a ng-click="vm.selectedTab = 'occurrences'">Occurrences</a>
    </li>
    <li ng-if="!vm.isComponentUnknown()" ng-class="{ active: vm.selectedTab === 'licenses' }">
      <a ng-click="vm.selectedTab = 'licenses'">Licenses</a>
    </li>
    <li ng-if="!vm.isComponentUnknown()" ng-class="{ active: vm.selectedTab === 'vulnerabilities' }">
      <a ng-click="vm.selectedTab = 'vulnerabilities'">Vulnerabilities</a>
    </li>
    <li ng-if="!vm.isComponentUnknown()" ng-class="{ active: vm.selectedTab === 'labels' }">
      <a ng-click="vm.selectedTab = 'labels'">Labels</a>
    </li>
    <li ng-class="{ active: vm.selectedTab === 'claimComponent' }">
      <a ng-click="vm.selectedTab = 'claimComponent'">Claim Component</a>
    </li>
    <li ng-if="!vm.isComponentUnknown()" ng-class="{ active: vm.selectedTab === 'auditLog' }">
      <a ng-click="vm.selectedTab = 'auditLog'">Audit Log</a>
    </li>
  </ul>
  <div ng-switch="vm.selectedTab" class="tab-content">
    <div ng-switch-when="componentInfo" information-panel></div>
    <div ng-switch-when="policy" cip-policy-violations></div>
    <div ng-switch-when="similar"><!-- TODO --></div>
    <div ng-switch-when="occurrences"><!-- TODO --></div>
    <div ng-switch-when="licenses" cip-license-editor></div>
    <div ng-switch-when="vulnerabilities" cip-vulnerability-editor></div>
    <div ng-switch-when="labels" cip-label-editor></div>
    <div ng-switch-when="claimComponent"><!-- TODO --></div>
    <div ng-switch-when="auditLog"><!-- TODO --></div>
  </div>
</div>
