<div load-wrapper="error" reload="doLoad()">
  <div authorization-wrapper="isAuthorized">
    <div class="container roles">
      <div breadcrumb state-override="role.name"></div>
    </div>
    <h1 class='page-title'>
      <div class='container roles'>{{role.name}}</div>
    </h1>
    <div class='container roles'>
      <p>{{role.description}}</p>
      <h2>Permissions</h2>
      <table class="inline-table">
        <tbody ng-repeat="permissionCategory in permissionCategories">
          <tr>
            <td>
              <h3>{{permissionCategory.displayName}}</h3>
            </td>
          </tr>
          <tr ng-repeat="permission in permissionCategory.permissions">
            <td>
              <div class="inline-control">
                <div class="checkbox toggle-checkbox">
                  <label>
                    <input type="checkbox" toggle-checkbox disabled data-on="Can" data-off="Cannot" ng-model="permission.allowed">
                    <span>{{permission.displayName}}</span>
                  </label>
                </div>
              </div>
            </td>
            <td>
              {{permission.description}}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
