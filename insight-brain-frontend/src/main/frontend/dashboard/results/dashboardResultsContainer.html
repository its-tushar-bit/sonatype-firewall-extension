<div>
  <root-organization-migrate></root-organization-migrate>
  <div class="dashboard-summary iq-dashboard-summary">
    <div class="iq-tile iq-tile--top-tile iq-tile--dashboard">
      <form id="export-results-form"
            class="iq-tile__actions iq-form iq-form--no-border iq-form--no-padding"
            name="export-results"
            action="{{vm.getExportUrl()}}"
            method="post"
            enctype="multipart/form-data">
        <input type="hidden" name="filter" value="{{vm.getExportRequestJson()}}">
        <button id="export-results" class="btn btn-tertiary">
          <i class="fa fa-file-o"></i>Export {{vm.title}} Data
        </button>
      </form>
      <div class="iq-tile-header">
        <div class="iq-tile-header__title">
          <h1>Results</h1>
        </div>
      </div>
      <dashboard-tabs></dashboard-tabs>
    </div>
  </div>
  <div ui-view></div>
</div>
