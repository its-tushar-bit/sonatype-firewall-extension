<div id="policy-editor-summary" class="summary-tile-container">
  <div class="tile summary-tile" load-wrapper="vm.loadError" loading="!vm.dirtyPolicy" reload="vm.doLoad()">
    <h2>
      <i class="fa size-20px fa-university slate">
      </i>{{::vm.dirtyPolicy.id ? (vm.readOnly ? 'View' : 'Edit') : 'New'}} Policy
    </h2>
    <ul class="nav nav-pills">
      <li class="active"><a data-toggle="pill" id="policy-summary-button" data-target="#policy-edit-summary">Summary</a></li>
      <li ng-if="!vm.isApp"><a data-toggle="pill" id="policy-inheritance-button" data-target="#policy-edit-inheritance">Inheritance</a></li>
      <li><a data-toggle="pill" id="policy-constraints-button" data-target="#policy-edit-constraints">Constraints</a></li>
      <li><a data-toggle="pill" id="policy-actions-button" data-target="#policy-edit-actions">Actions and Notifications</a></li>
      <li><a data-toggle="pill" id="policy-create-button" data-target="#policy-edit-create">Create</a></li>
    </ul>
  </div>
</div>
<div id="policy-editor" class="tile-editor-container tile-scroll-container" scrollspy="#policy-editor-summary">
  <div class="tile" load-wrapper="vm.loadError" loading="!vm.dirtyPolicy" reload="vm.doLoad()">
    <form name="vm.policyEditor" class="clm-form" role="form" ng-submit="vm.save()" novalidate
          form-mask="vm.policyEditorMask" mask-attach-to-body>
      <div id="policy-edit-summary" class="editor-section">
        <div class="editor-section-header">Summary</div>
        <div class="section">
          <div class="inline-fields">
            <div class="field">
              <label for="editor-policy-name" ng-class="{disabled: vm.readOnly}">Policy Name</label>
              <input id="editor-policy-name" type="text" name="policy" required
                     ng-model="vm.dirtyPolicy.name"
                     ng-maxlength="60"
                     focus-input="true"
                     valid-name-characters
                     has-whitespace
                     is-duplicate is-duplicate-array="vm.siblings" is-duplicate-id-field="id"
                     messages="{duplicate: 'Name is already in use'}"
                     ng-disabled="vm.readOnly"
                     clm-input>
            </div>
            <div class="field">
              <label for="editor-policy-threat-level" ng-class="{disabled: vm.readOnly}">Threat Level</label>
              <threat-level-selector id="editor-policy-threat-level"
                                     ng-model='vm.dirtyPolicy.threatLevel' threat-type="policy"
                                     ng-disabled="vm.readOnly"></threat-level-selector>
            </div>
          </div>
        </div>
      </div>
      <div ng-if="!vm.isApp" id="policy-edit-inheritance" class="editor-section">
        <div class="editor-section-header">Inheritance</div>
        <div class="section">
          <div class="inline-fields">
            <div class="field">
              <label for="editor-policy-inherit" ng-class="{disabled: vm.readOnly}">This Policy Inherits to</label>
              <div id="editor-policy-inherit" class="editor-policy-inherit">
                <label class="radio" ng-class="{disabled: vm.readOnly}">
                  <input type="radio" name="policy-inherit" ng-model="vm.hasPolicyCategories" ng-value="false"
                         ng-disabled="vm.readOnly">
                  <span ng-if="::!vm.isRootOrg">All Applications in {{vm.ownerName}}</span>
                  <span ng-if="::vm.isRootOrg">All Applications and Repositories</span>
                </label>
                <label class="radio" ng-class="{disabled: vm.categories.length === 0 || vm.readOnly}">
                  <input type="radio" ng-disabled="vm.categories.length === 0 || vm.readOnly" name="policy-inherit"
                         ng-model="vm.hasPolicyCategories" ng-value="true">
                  <span>Applications of the specified Application Categories in {{ vm.ownerName}}</span>
                </label>
                <association-editor ng-show="vm.hasPolicyCategories" id="associated-categories" items="vm.categories"
                                    checkbox-param="isApplied"
                                    description="name" icon="hexagon"
                                    ng-disabled="vm.readOnly"/>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="policy-edit-constraints" class="editor-section">
        <div class="editor-section-header">Constraints</div>
        <policy-editor-constraints constraints="vm.dirtyPolicy.constraints" is-new-policy="vm.dirtyPolicy.$new"
                                   ng-disabled="vm.readOnly"></policy-editor-constraints>
      </div>
      <div id="policy-edit-actions" class="editor-section">
        <div class="editor-section-header">Actions and Notifications</div>
        <policy-editor-actions actions="vm.dirtyPolicy.actions" monitor-notify-actions="vm.dirtyPolicy.monitorNotifyActions"
                ng-disabled="vm.readOnly"></policy-editor-actions>
      </div>
      <div id="policy-edit-create" class="editor-footer" submit-wrapper="vm.submitError" retry="vm.save()">
        <button id="save-policy-button" type="submit" class="btn btn-primary" submit-validation submit-dirty="vm.isPolicyDirty()"
                submit-type="vm.dirtyPolicy.id ? 'update' : 'create'"
                ng-disabled="vm.readOnly">
          {{vm.dirtyPolicy.id ? 'Update' : 'Create'}}
        </button><!--
        --><button id="delete-policy-button" class='btn btn-tertiary' type="button"
                ng-click="vm.deletePolicy()" ng-if="vm.dirtyPolicy && !vm.dirtyPolicy.$new" ng-disabled="vm.readOnly">
          <i class="fa fa-fw fa-trash"></i>Delete Policy
        </button>
      </div>
    </form>
  </div>
</div>
