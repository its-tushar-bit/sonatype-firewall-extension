<html lang="en" ng-app="managementApp" ng-strict-di>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title ng-bind="'IQ Server - ' + ($state.current.data.title ? $state.current.data.title : '')">IQ Server - Management</title>
    <link rel='shortcut icon' href='favicon.ico'/>
    <script type='text/javascript'>
        var clmBuildTimestamp = '<%= config.buildTimestamp %>', clmServerVersion = '<%= config.pom.clmVersion %>',
            angularDebug = <%= config.angularDebug %>;
    </script>

  <link href="lib/components-font-awesome/css/font-awesome.min.css" rel="stylesheet">
  <link href="lib/glyphicon/glyphicons.css" rel="stylesheet">

  <!--build:css(.tmp) css/lib-scss.css -->
  <link href="scss/bootstrap.css" rel="stylesheet">
  <!-- endbuild -->

  <!-- build:css css/lib.css -->
  <link href="lib/bootstrap/bootstrap-slider-2.0.0.css" rel="stylesheet">
  <link href="lib/bootstrap-toggle/bootstrap2-toggle-2.2.0.css" rel="stylesheet">
  <link href="lib/glyphicon/halflings.css" rel="stylesheet">
  <link href="lib/X-editable/xeditable.css" rel="stylesheet">
  <!-- endbuild -->

  <!--build:css(.tmp) css/style-scss.css -->
  <link href="scss/scss.css" rel="stylesheet">
  <!-- endbuild -->

  <!--build:css css/style.css -->
  <link href="application/application.css" rel="stylesheet">
  <link href="app-security.css" rel="stylesheet">
  <link href="glyphicons-sonatype.css" rel="stylesheet">
  <link href="insight.css" rel="stylesheet">
  <link href="management.css" rel="stylesheet">
  <link href="multi-select.css" rel="stylesheet">
  <link href="report-list.css" rel="stylesheet">
  <link href="sonatype-icons.css" rel="stylesheet">
  <link href="user/user.css" rel="stylesheet">
  <!-- endbuild -->

  <!-- build:js js/lib.js -->
  <script src='lib/jquery/dist/jquery.js'></script>
  <script src="lib/bootstrap/bootstrap-2.3.1.min.js"></script>
  <script src='lib/bootstrap/bootstrap-slider-2.0.0-sonatype-1.js'></script>
  <script src='lib/angular/angular.js'></script>
  <script src='lib/angular-<%= config.pom.angularJsVersion %>/angular-aria.js'></script>
  <script src='lib/angular-<%= config.pom.angularJsVersion %>/angular-cookies.js'></script>
  <script src='lib/angular-<%= config.pom.angularJsVersion %>/angular-route.js'></script>
  <script src='lib/angular-<%= config.pom.angularJsVersion %>/angular-sanitize.js'></script>
  <script src='lib/angular-ui-router-0.2.15.min.js'></script>
  <script src='lib/angular-ui-utils-0.0.3.js'></script>
  <script src="lib/angular-vs-repeat/src/angular-vs-repeat.js"></script>
  <script src="lib/ui-bootstrap-tpls-0.13.4.min.js"></script>
  <script src="lib/bootstrap-toggle/bootstrap2-toggle-2.2.0.js"></script>
  <script src="lib/X-editable/xeditable-0.1.8.min.js"></script>
  <script src='lib/ngUpload/ng-upload.js'></script>
  <script src='lib/d3/d3.js'></script>
  <script src='lib/Base64.js'></script>
  <script src='lib/zeroclipboard/ZeroClipboard-1.3.2.js'></script>
  <script src="lib/fuse.js/src/fuse.js"></script>
  <script src='lib/jquery-ui/ui/minified/effect.min.js'></script>
  <script src='lib/classybrew/build/classybrew.min.js'></script>
  <!-- endbuild -->

  <script src="bundle.js?<%= config.buildTimestamp %>"></script>

</head>
<body>
  <main-header product-edition="{{productEdition}}"></main-header>
  <div ng-show='!error' class="main-view">
    <system-notice></system-notice>
    <div ui-view></div>
  </div>
  <div ng-cloak ng-if='error' class='alert alert-error' style='margin:86px auto;width:50%;max-width:400px'>
    <h3>Error</h3>
    <p>An unrecoverable error has occurred while loading the page.</p>
    <p>Please try to reload the page, if the problem persists contact your server administrator. ({{error}})</p>
  </div>
  <script type="text/ng-template" id="unsaved-modal">
    <div class="clm-modal unsaved-modal">
      <div class="clm-modal-header"><h2>Unsaved Changes</h2></div>
      <div class="clm-modal-body warn">
        <div class="clm-alert alert"><i class="fa fa-warning"></i>The page may contain unsaved changes,
          continuing will discard them.
        </div>
      </div>
      <div class='clm-modal-footer'>
        <button class='btn btn-primary' ng-click="$close()">Continue</button>
        <button class='btn' ng-click="$dismiss()">Cancel</button>
      </div>
    </div>
  </script>
</body>
</html>
