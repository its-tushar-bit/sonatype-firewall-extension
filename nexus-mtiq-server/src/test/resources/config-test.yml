importReferencePoliciesFromHDS: false

# Audit log base path for multi-tenant audit logging
auditLogBasePath: "./target/test-audit-logs"

logging:
  level:
    com.sonatype: DEBUG
    org.apache.directory: ERROR
    org.apache.http.headers: DEBUG
    org.eclipse.jetty.server.HttpChannel: DEBUG
    com.sonatype.insight.brain.concurrent.PerpetualLockManager: TRACE
  pattern:
    console: "%date %-5level [%X{tenant}] [%thread] %logger - %msg%n"

# for tests we disable the health checks
mtiq-health:
  type: mtiq-health
  enabled: false
