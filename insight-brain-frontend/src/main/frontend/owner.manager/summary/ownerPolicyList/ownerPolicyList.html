<div class="simple-list">
  <h4 class="subsection-header" ng-if="!vm.ownerPolicyList.inherited">Local
    <button id="add-policy-button" class="btn btn-tertiary" same-owner-edit-sref="create-policy">
      <i class="fa fa-plus"></i>Add a Policy
    </button>
  </h4>
  <h4 class="subsection-header" ng-if="vm.ownerPolicyList.inherited && vm.ownerPolicyList.policies.length > 0">
    Inherited from {{vm.ownerPolicyList.ownerName}}
  </h4>

  <div class="empty-list" ng-if="!vm.ownerPolicyList.inherited && vm.ownerPolicyList.policies.length <= 0">
    No local policies defined
  </div>
  <table sort="vm.sortFields"
         on-sort-change="vm.sortFields = sortFields"
         class="iq-table policy-list"
         cols="8">
    <thead>
      <tr class="iq-table-row" ng-if="vm.ownerPolicyList.policies.length > 0">
        <th class="iq-cell iq-cell--header policy-list__threat-column" sort-column="-threatLevel">
          <span class="header-text">THREAT</span>
        </th>
        <th sort-column="name, -threatLevel" class="iq-cell iq-cell--header policy-list__name-column">
          <span class="header-text">NAME</span>
        </th>
        <th class="iq-cell iq-cell--header policy-list__stage-column tm-stage-{{::stage.stageTypeId}}"
            sort-column="enforcementAction['{{::stage.stageTypeId}}'], -threatLevel"
            ng-repeat="stage in vm.actionStages">
          <span class="header-text">{{::stage.shortName | uppercase}}</span>
        </th>
        <th class="iq-cell iq-cell--header iq-cell--chevron"></th>
      </tr>
    </thead>
    <tr class="iq-table-row simple clickable"
        ng-repeat="policy in vm.ownerPolicyList.policies | orderBy:vm.sortFields"
        ng-click="vm.onPolicyClick({policyId: policy.id})">
      <td class="iq-cell policy-list__name-column" colspan="2">
        <span class='threat-legend policy-threat-level-{{policy.threatLevel}}'>&nbsp;</span>{{policy.name}}
      </td>
      <td class="iq-cell policy-list__stage-column" ng-repeat="stage in vm.actionStages" class="action">
        <i ng-class="{'fa fa-exclamation-triangle warn' : policy.enforcementAction[stage.stageTypeId] === 'warn',
                    'fa fa-exclamation-circle fail' :policy.enforcementAction[stage.stageTypeId] === 'fail'}"></i><!--
                  --><span>{{policy.enforcementAction[stage.stageTypeId] || 'no action'}}</span>
      </td>
      <td class="iq-cell iq-cell--chevron"><i class="fa fa-chevron-right"></i></td>
    </tr>
  </table>
</div>
