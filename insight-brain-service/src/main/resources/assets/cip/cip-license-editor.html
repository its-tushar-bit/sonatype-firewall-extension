<div id='license-editor' ng-controller='LicenseEditorController'>
	<div class='load-error' load-error='error' reload='doLoad()'></div>
	<div style='text-align:center;margin:30px' ng-show='!licenses && !error'>
		<h5><i class='icon-time'></i> Loading...</h5>
	</div>
	<div ng-show='licenses'>
		<div ng-show='alert' class='alert alert-error'>
			<button type="button" class="close" ng-click='alert = null'>&times;</button>
			<strong>Error</strong> An error occurred while saving the license override. ({{alert}})
		</div>
		<form name='licenseEditorForm' ng-submit='save()'>
			<div style="width:199px;height:212px;overflow:auto;" class="well">
				<ul class="nav nav-list" id="licenseList">
					<li class="nav-header">Declared Licenses</li>
					<li class="license" ng-repeat='licenseWithThreat in component.declaredlicenses'>
						<img ng-src="public/{{getColor(licenseWithThreat.threatLevel)}}.png"> {{licenseWithThreat.license.licenseName}}</li>
					<li class="license" ng-show="isClaimedComponent()">Unavailable, Claimed Component</li>
					<li class="divider"></li><li class="nav-header">Observed Licenses</li>
					<li class="license" ng-repeat='licenseWithThreat in component.observedlicenses'>
						<img ng-src="public/{{getColor(licenseWithThreat.threatLevel)}}.png"> {{licenseWithThreat.license.licenseName}}</li>
					<li class="license" ng-show="isClaimedComponent()">Unavailable, Claimed Component</li>
				</ul>
			</div>
			<div class="well" style="width:595px">
				<div class="form-horizontal">
					<div class="control-group">
						<label class="control-label">Scope</label>
						<div class="controls">
							<select ng-model='override.ownerId'
									ng-options='scope.ownerId as scope.ownerName for scope in hierarchy'
									required>
							</select>
						</div>
					</div>
					<div class="control-group">
						<label class="control-label">Status</label>
						<div class="controls" style="text-align:left;">
							<select ng-model='override.status'
									ng-options='status.value as status.label for status in statuses'
									required>
							</select>
						</div>
					</div>
					<div class="control-group">
						<label class="control-label">License</label>
						<div class="controls" style="text-align:left;">
							<span ng-switch='override.status'>
								<select ng-switch-when='SELECTED'
										ng-model='override.licenseId'
										ng-options='license.id as license.shortDisplayName for (id, license) in selectableLicenses'
										required>
								</select>
								<select ng-switch-when='OVERRIDDEN'
										ng-model='override.licenseId'
										ng-options='license.id as license.shortDisplayName for (id, license) in licenses'
										required>
								</select>
							</span>
						</div>
					</div>
					<div class="control-group">
						<label class="control-label" for="comment1376501760921">Comment</label>
						<div class="controls">
							<textarea ng-model='override.comment' disablenav class="input-xlarge" id="comment1376501760921" maxlength='1000' rows="3" style="padding:0px;height:62px"></textarea>
						</div>
					</div>
					<div class="controls" style="text-align:right">
						<button type="submit" class="btn btn-primary" ng-disabled="!isSubmitEnabled()">Update</button>
					</div>
				</div>
			</div>
		</form>
	</div>
</div>
