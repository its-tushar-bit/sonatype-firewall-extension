<section id="add-success-metrics-report" form-mask="vm.maskController">
  <header class="iq-modal-header">
    <h2>
      <i class="fa fa-flask"></i>Add Report
    </h2>
  </header>
  <form name="vm.addSuccessMetricsReportForm" class="clm-form" novalidate>
    <div class="iq-modal-content iq-scrollable" load-wrapper loading="!vm.loaded" reload="vm.$onInit">
        <div class="section">
          <div class="field">
            <label for="add-success-metrics-report-name">Name</label>
            <input id="add-success-metrics-report-name"
                   name="name"
                   type="text"
                   ng-model="vm.name"
                   focus-input="true"
                   autofocus
                   clm-input
                   ng-required="true"
                   ng-trim="false"
                   has-whitespace-validator
                   valid-name-characters
                   is-duplicate
                   is-duplicate-array="vm.existingReports"
                   is-duplicate-id-field="name"
                   messages="{duplicate: 'Name is already in use'}">
          </div>
        </div>
        <fieldset class="section iq-radio-group">
          <legend>Scope</legend>
          <iq-radio id="add-success-metrics-report-all-applications" model="vm.isAllApplications" value="true"><!--
         --><i class="fa fa-globe"></i> All Applications
          </iq-radio>
          <iq-radio id="add-success-metrics-report-custom" model="vm.isAllApplications" value="false">Custom</iq-radio>
          <iq-org-app-picker ng-if="!vm.isAllApplications"
                             organizations="vm.organizations"
                             applications="vm.applications"
                             selected-applications="vm.selectedApplications"
                             selected-organizations="vm.selectedOrganizations"
                             on-change="vm.onOrgAppSelectionChange(selectedOrganizations, selectedApplications)">
          </iq-org-app-picker>
        </fieldset>
    </div>
    <footer class="iq-modal-footer" ng-class="{ error: vm.error }">
      <p ng-if="vm.error" class="section with-icon"><i class="fa fa-warning"></i>{{::vm.getErrorMessage()}}</p>

      <button id="add-success-metrics-report-submit-btn"
              class="btn"
              ng-class="{ 'btn-error': vm.error, 'btn-primary': !vm.error }"
              ng-click="vm.onSubmit()"
              submit-validation
              submit-type="create"
              submit-dirty="vm.isCreateEnabled()">
        <span ng-if="!vm.error">
          Create
        </span>
        <span ng-if="vm.error">
          <i class="fa fa-refresh"></i> Retry
        </span>
      </button>

      <button id="add-success-metrics-report-cancel-btn" class="btn" ng-click="vm.dismiss()">Cancel</button>
    </footer>
  </form>
</section>
