<div class='inline-policy-editor' ng-controller='PolicyEditorController' style="width:875px;">
	<div>
		<h3>Constraints</h3>
	</div>
	<div class="accordion">
		<div class="accordion-group" ng-repeat='constraint in policy.constraints'>
			<div class="common-accordion-header">
	            <div class='inline' style='display: inline;'>
                    <span id='constraintName' name='constraintName' ng-model='constraint.name' xeditable href='javascript:;' data-type='text' alpha-numeric adjustable='true' ng-click="editConstraint(constraint)"></span>
                </div>
	            <div class='floatRight'>
	                <div class='btn-group hover-buttons'>
						<a class="btn btn-mini policy-button" title="Edit Constraint" ng-click="editConstraint(constraint)"><i class="icon-pencil" style="margin-top: 0px;"></i></a>
						<a class="btn btn-mini policy-button" title="Add Constraint" ng-click="addConstraint()"><i class="icon-plus" style="margin-top: 0px;"></i></a>
						<a class="btn btn-mini policy-button" title="Remove Constraint" ng-show="policy.constraints.length > 1" ng-click="removeConstraint(constraint)"><i class="icon-trash" style="margin-top: 0px;"></i></a>
					</div>
	            </div>
			</div>
			<a class="common-accordion-toggle" data-toggle="collapse" data-parent="policy.constraints" href="#collapse{{constraint.id}}"></a>
			<div id="collapse{{constraint.id}}" class="common-accordion-body accordion-body collapse">
				<div class="accordion-inner">
					<div ng-include='"../assets/components/policy-editor/constraint-editor.html"'></div>
				</div>
			</div>
		</div>
	</div>
	<div>
		<h3>Actions</h3>
	</div>
	<table class="table table-striped table-bordered table-condensed">
		<thead>
			<tr>
				<th>Stage</th>
				<th style="text-align:center;">Warn</th>
				<th style="text-align:center;">Fail</th>
				<th>Custom Actions</th>
			</tr>
		</thead>
		<tr ng-repeat="actionStage in actionStages">
			<td>{{actionStage.name}}</td>
			<td style="height: 22px;text-align:center;cursor:pointer;" ng-click='toggleWarnAction(actionStage,policy)'><img ng-show='showWarningIcon(actionStage, policy)' src='../assets/img/policyalert.png' style="height: 20px; width: 20px;" /></td>
			<td style="text-align:center;cursor:pointer;" ng-click='toggleFailureAction(actionStage,policy)'><img ng-show='showFailureIcon(actionStage, policy)' src='../assets/img/policyerror.png' style="height: 20px; width: 20px;" /></i></td>
			<td><i class="icon-user" style="cursor:pointer;padding-right:5px;" ng-click='editNotification(actionStage,policy)'></i>{{getEmailList(actionStage,policy)}}</td>
		</tr>
	</table>
	<div clm-alerts='alerts'></div>
	<div class='btn-group pull-right' style='padding-bottom:10px;'>
		<a class='btn' ng-click='policy.edit=false;angular.extend(policy, policy.$original);'>Cancel</a>
		<a class='btn btn-primary' ng-disabled='isFormValid()' ng-click="savePolicy()">Save</a>
	</div>
	<div notificationmanagement></div>
</div>
