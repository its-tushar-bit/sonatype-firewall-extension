<script type="text/ng-template" id="violations-table-row">
  <td class="iq-cell iq-cell--threat">
    <span class="iq-threat-indication" threat-class="vm.risk.threatLevel"></span>
    <span class="iq-threat-number">{{::vm.risk.threatLevel}}</span>
  </td><!--
--><td class="iq-cell iq-cell--label iq-cell--policy"
       iq-tooltip
       tooltip-attach-to-body
       tooltip-class="dashboard-tooltip"
       tooltip-delay=500
       tooltip-only-on-overflow="true"
       tooltip-text="{{::vm.risk.policyName}}">
    {{::vm.risk.policyName}}
  </td><!--
--><td class="iq-cell iq-cell--application"
       iq-tooltip
       tooltip-attach-to-body
       tooltip-class="dashboard-tooltip"
       tooltip-delay=500
       tooltip-only-on-overflow="true"
       tooltip-text="{{::vm.risk.applicationName}}">
    {{::vm.risk.applicationName}}
  </td><!--
--><td class="iq-cell iq-cell--component"
       iq-tooltip
       tooltip-attach-to-body
       tooltip-class="dashboard-tooltip {{::!vm.risk.displayName && vm.risk.pathnames ? 'pathname' : ''}}"
       tooltip-delay=500
       tooltip-only-on-overflow="true"
       tooltip-overflow-element-selector=".truncate-ellipsis"
       tooltip-text="{{::vm.risk.derivedComponentName}}">
    <span component-display component="vm.risk" truncate="true"></span>
  </td><!--
--><td class="iq-cell iq-cell--age">{{::vm.risk.firstOccurrenceTime | terseAgo}}</td><!--
--><td class="iq-cell iq-cell--report">
     <a class="link" ng-click="vm.openReport(vm.risk.applicationPublicId, vm.risk.scanId)">
       <i class="fa fa-external-link fa-fw"></i><!--
    --><span>{{::vm.stageTypes[vm.risk.stageTypeId].shortName}}</span><!--
    --><i ng-class="::{
            'fa fa-exclamation-triangle warn' : vm.risk.actionTypeId === 'warn',
            'fa fa-exclamation-circle fail' : vm.risk.actionTypeId === 'fail'
          }">
      </i>
    </a>
  </td>
</script>

<div id="dashboard-violations" ng-init="sortVm.sortFields = ['-firstOccurrenceTime', '-threatLevel']">
  <div class="iq-tile iq-tile--dashboard-table-container">
    <div class="iq-scrollable" detect-scrollbar>
      <table class="iq-table iq-table--dashboard-violations">
        <thead class="dashboard-headers iq-dashboard-headers">
          <tr class="iq-table-row"
              sort="sortVm.sortFields"
              on-sort-change="sortVm.sortFields = sortFields">
            <th class="iq-cell iq-cell--header iq-cell--threat" sort-column="-threatLevel,-firstOccurrenceTime">
              <span class="iq-cell__text--header">Threat</span>
            </th><!--
         --><th class="iq-cell iq-cell--header iq-cell--policy" sort-column="policyName,-firstOccurrenceTime">
              <span class="iq-cell__text--header">Policy</span>
            </th><!--
         --><th class="iq-cell iq-cell--header iq-cell--application" sort-column="applicationName,-threatLevel">
              <span class="iq-cell__text--header">Application</span>
            </th><!--
         --><th class="iq-cell iq-cell--header iq-cell--component" sort-column="derivedComponentName,-threatLevel">
              <span class="iq-cell__text--header">Component</span>
            </th><!--
         --><th class="iq-cell iq-cell--header iq-cell--age" sort-column="-firstOccurrenceTime,-threatLevel" sort-inverted="true">
              <span class="iq-cell__text--header">Age</span>
            </th><!--
         --><th class="iq-cell iq-cell--header iq-cell--report">
              <span class="iq-cell__text--header">Latest Report</span>
            </th>
          </tr>
        </thead>
        <tbody id="dashboard-results"
               class="iq-violations-results"
               violations-results
               form-mask="maskController"
               mask-message="">
          <tr violations-table-row risk="risk"
              ng-repeat="risk in data | limitTo: maxResults | emptyToEnd:sortVm.sortFields"
              class="iq-table-row">
          </tr>
        </tbody>
      </table>
      <dashboard-common-results results="data"
                                needs-acknowledgement="needsAcknowledgement"
                                max-results="maxResults"
                                max-days-old="maxDaysOld"
                                error="error"
                                reload="reload()">
      </dashboard-common-results>
    </div>
  </div>
</div>
