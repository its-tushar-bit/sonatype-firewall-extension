<div class='container'>
    <div id='applicationManagement' class='content-container' style='padding: 20px;'>
        <button class='btn floatRight' ng-click='editApplication()'><i class='icon-plus'></i> Register New
            Application
        </button>
        <div class='input-prepend floatLeft'>
        <span class='add-on'><i ng-class="{'icon-search': !searchText, 'icon-remove': searchText}"
                                ng-click="searchText = ''"></i></span>
            <input type='text' ng-model='searchText' autocomplete="off" type-Ahead='getApplicationNames'/>
        </div>
        <table class='table table-striped table-bordered' style='margin-bottom:0px; margin-right: 10px;'>
            <thead>
            <tr>
                <th style='padding: 0px'>
                    <button ng-class="{ 'buttonColumn' : orderColumn != 'name', 'buttonColumn buttonColumnSorted' : orderColumn == 'name' }"
                            style='width: 100%' ng-click="order('name');">
                        Application Name
                        <i ng-class="{ 'icon-chevron-down' : orderColumn == 'name' && orderDirection,
                            'icon-chevron-up' : orderColumn == 'name' && !orderDirection,
                            'emptyIconGlyph' : orderColumn != 'name' }"></i>
                    </button>
                </th>
                <th ng-repeat='stage in stages | filterReportColumns' style='padding: 0px'>
                    <button ng-class="{ 'buttonColumn' : orderColumn != stage.id, 'buttonColumn buttonColumnSorted' : orderColumn == stage.id }"
                            style='width: 100%' ng-click="order(stage.id);">
                        {{stage.name}} Report
                        <i ng-class="{ 'icon-chevron-down' : orderColumn == stage.id && orderDirection,
                            'icon-chevron-up' : orderColumn == stage.id && !orderDirection,
                            'emptyIconGlyph' : orderColumn != stage.id }"></i>
                    </button>
                </th>
            </tr>
            </thead>
            <tr ng-repeat='application in applications | filter: searchText | orderBy: orderBy:!orderDirection'>
                <td>
                    <button ng-click='editApplication(application);' class='btn btn-mini btn-edit'
                            title='Edit Application'><i class='icon-pencil' style='margin-top:0px;'></i>
                    </button>
                    <button ng-click='confirmDeleteApplication(application);' class='btn btn-mini btn-delete'
                            title='Delete Application'><i class='icon-trash' style='margin-top:0px;'></i>
                    </button>
                    <img ng-src='../rest/application/icon/{{application.publicId}}' width='48px' height='48px'/>
                    <a href='../policy-assets/index.html?appId={{application.publicId}}'>{{application.name}}</a>
                </td>
                <td ng-repeat='stage in stages | filterReportColumns'>
                    <a ng-show='application.policyEvaluation.stage.stageTypeId == stage.id'
                       href='#/report/{{application.publicId}}/{{application.policyEvaluation.scanId}}'>
                        {{application.policyEvaluation.time | date:'yyyy-MM-dd'}}</a>
                </td>
            </tr>
        </table>
        <div id='newApplicationModal' data-backdrop='static' class='modal hide'>
            <div class='modal-header'>
                <button type='button' class='close' data-dismiss='modal'>&times;</button>
                <h3 ng-show='selectedApplication.id == null'>New Application</h3>

                <h3 ng-show='selectedApplication.id != null'>Edit Application</h3>
            </div>
            <div ng-include='newApplicationUrl'></div>
        </div>
        <div id='addApplicationModal' data-backdrop='static' class='modal hide'>
            <div class='modal-header'>
                <button type='button' class='close' data-dismiss='modal'>&times;</button>
                <h3>New Application</h3>
            </div>
            <div class='modal-body'>
                <div class='form-horizontal'>
                    <div class='control-group'>
                        <label class='control-label' for='inputApplicationId'>Application Id:</label>

                        <div class='controls'>
                            <input id='inputApplicationId' type='text' ng-model='applicationPublicId'/>
                        </div>
                    </div>
                </div>
            </div>
            <div ng-show='addApplicationError'>
                <div class='alert alert-error'>
                    <button type='button' class='close' ng-click='clearAddApplicationError()'>&times;</button>
                    <strong>Error</strong> {{addApplicationError}}
                </div>
            </div>
            <div class='modal-footer'>
                <button class='btn btn-primary' ng-click='addApplication()' ng-disabled='!applicationPublicId'>Add
                </button>
            </div>
        </div>
        <div error-Modal></div>
    </div>
</div>
