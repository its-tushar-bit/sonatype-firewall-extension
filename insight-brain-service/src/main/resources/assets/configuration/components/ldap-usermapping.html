<div>
  <form name='ldapUserMappingEditor' style='margin-bottom: 0px; max-width: 510px;'>
    <div class="form-horizontal configuration">
      <div class="content-header">
        <h4>User Element Mapping</h4>
      </div>
      <div class="control-group">
        <label class="control-label">Base DN:</label>
        <div class="controls">
          <input type='text' maxlength='255' name='userBaseDN' ng-model="ldapUserMapping.userBaseDN">
        </div>
      </div>
      <div class="control-group">
        <label class="control-label">User Subtree:</label>
        <div class="controls">
          <input type='checkbox' name='userSubtree' ng-model="ldapUserMapping.userSubtree">
        </div>
      </div>
      <div class="control-group" ng-class='{ error : ldapUserMappingEditor.userObjectClass.$invalid }'>
        <label class="control-label">Object Class:</label>
        <div class="controls">
          <input type='text' maxlength='255' name='userObjectClass' ng-model='ldapUserMapping.userObjectClass' required>
        </div>
      </div>
      <div class="control-group">
        <label class="control-label">User Filter:</label>
        <div class="controls">
          <input type='text' maxlength='255' name='userFilter' ng-model='ldapUserMapping.userFilter'>
        </div>
      </div>
      <div class="control-group" ng-class='{ error : ldapUserMappingEditor.userIDAttribute.$invalid }'>
        <label class="control-label">User ID Attribute:</label>
        <div class="controls">
          <input type='text' maxlength='255' name='userIDAttribute' ng-model='ldapUserMapping.userIDAttribute' required>
        </div>
      </div>
      <div class="control-group" ng-class='{ error : ldapUserMappingEditor.userRealNameAttribute.$invalid }'>
        <label class="control-label">Real Name Attribute:</label>
        <div class="controls">
          <input type='text' maxlength='255' name='userRealNameAttribute' ng-model='ldapUserMapping.userRealNameAttribute' required>
        </div>
      </div>
      <div class="control-group" ng-class='{ error : ldapUserMappingEditor.userEmailAttribute.$invalid }'>
        <label class="control-label">E-Mail Attribute:</label>
        <div class="controls">
          <input type='text' maxlength='255' name='userEmailAttribute' ng-model='ldapUserMapping.userEmailAttribute' required>
        </div>
      </div>



      <div class="content-header">
        <label class="checkbox">
          <input type='checkbox' name='useUserPasswordAttribute' ng-model="useUserPasswordAttribute">
          <h4>Use Password Attribute</h4>
        </label>
      </div>
      <div ng-show="useUserPasswordAttribute" class="control-group" ng-class='{ error : ldapUserMappingEditor.userPasswordAttribute.$invalid }'>
        <label class="control-label">Password Attribute:</label>
        <div class="controls">
          <input type='text' maxlength='255' name='userPasswordAttribute' ng-model='ldapUserMapping.userPasswordAttribute' ng-required="useUserPasswordAttribute">
        </div>
      </div>



      <div class="content-header">
        <h4>Group Element Mapping</h4>
      </div>
      <div class="control-group" ng-class='{ error : ldapUserMappingEditor.groupMappingType.$invalid }'>
        <label class="control-label">Group Type:</label>
        <div class="controls">
          <select name='groupMappingType' ng-model='ldapUserMapping.groupMappingType' ng-options="p for p in groupMappingTypes" required></select>
        </div>
      </div>
      <div ng-show='ldapUserMapping.groupMappingType == "STATIC"'>
        <div class="control-group">
          <label class="control-label">Base DN:</label>
          <div class="controls">
            <input type='text' maxlength='255' name='groupBaseDN' ng-model='ldapUserMapping.groupBaseDN'>
          </div>
        </div>
        <div class="control-group">
          <label class="control-label">Group Subtree:</label>
          <div class="controls">
            <input type='checkbox' name='groupSubtree' ng-model='ldapUserMapping.groupSubtree'>
          </div>
        </div>
        <div class="control-group" ng-class='{ error : ldapUserMappingEditor.groupObjectClass.$invalid }'>
          <label class="control-label">Object Class:</label>
          <div class="controls">
            <input type='text' maxlength='255' name='groupObjectClass' ng-model='ldapUserMapping.groupObjectClass' ng-required='isGroupFieldRequired("STATIC")'>
          </div>
        </div>
        <div class="control-group" ng-class='{ error : ldapUserMappingEditor.groupIDAttribute.$invalid }'>
          <label class="control-label">Group ID Attribute:</label>
          <div class="controls">
            <input type='text' maxlength='255' name='groupIDAttribute' ng-model='ldapUserMapping.groupIDAttribute' ng-required='isGroupFieldRequired("STATIC")'>
          </div>
        </div>
        <div class="control-group" ng-class='{ error : ldapUserMappingEditor.groupMemberAttribute.$invalid }'>
          <label class="control-label">Group Member Attribute:</label>
          <div class="controls">
            <input type='text' maxlength='255' name='groupMemberAttribute' ng-model='ldapUserMapping.groupMemberAttribute' ng-required='isGroupFieldRequired("STATIC")'>
          </div>
        </div>
        <div class="control-group" ng-class='{ error : ldapUserMappingEditor.groupMemberFormat.$invalid }'>
          <label class="control-label">Group Member Format:</label>
          <div class="controls">
            <input type='text' maxlength='255' name='groupMemberFormat' ng-model='ldapUserMapping.groupMemberFormat' ng-required='isGroupFieldRequired("STATIC")'>
          </div>
        </div>
      </div>
      <div ng-show='ldapUserMapping.groupMappingType == "DYNAMIC"'>
        <div class="control-group" ng-class='{ error : ldapUserMappingEditor.userMemberOfGroupAttribute.$invalid }'>
          <label class="control-label">Member of Attribute:</label>
          <div class="controls">
            <input type='text' maxlength='255' name='userMemberOfGroupAttribute' ng-model='ldapUserMapping.userMemberOfGroupAttribute' ng-required='isGroupFieldRequired("DYNAMIC")'>
          </div>
        </div>
      </div>
    </div>
  </form>
  <div style="max-width: 510px;">
    <div clm-alerts='alerts'></div>
    <div style="margin: 20px 0 10px 25px;">
      <button class='btn btn-success' ng-disabled="true" ng-click="testMapping()">Test Mapping</button>
      <div style="float: right;">
        <button class="btn" ng-disabled="!isDirty()" ng-click="reset()">Reset</button>
        <button class="btn btn-primary" ng-disabled="!canSaveEdit()" ng-click="save()">Save</button>
      </div>
    </div>
    <span ng-show='saving' style='height: 30px'><i class='icon-time'></i> Saving</span>
  </div>
  <div error-Modal></div>
</div>
