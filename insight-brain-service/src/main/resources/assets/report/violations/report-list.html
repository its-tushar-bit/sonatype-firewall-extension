<div class='content report-content'>
	<div load-error='error' reload='doLoad()'></div>
	<div ng-hide='error'>
		<div ng-hide='stages'><h5><i class='icon icon-time'></i> Loading...</h5></div>
		<div ng-show='applications.length == 0'>
          <h5>
            Welcome to Sonatype CLM. Get started by <a href='index.html#/management/organization/_new_'>creating an organization</a>.
          </h5>
        </div>
		<div ng-show='applications.length > 0'>
			<div class='input-prepend'>
				<span class='add-on'><i ng-class="{'icon-search': !appFilter.name, 'icon-remove': appFilter.name}" ng-click="appFilter.name = ''"></i></span>
				<input type='text' ng-model='appFilter.name' autocomplete="off" placeholder='Filter Applications' />
			</div>
			<table class='clm-table table table-striped table-bordered' style='margin-bottom:0px;background-color: white'>
				<thead>
					<tr>
						<th class='sortable' ng-click="orderColumn='name'; orderDirection=!orderDirection"
							ng-class="{ 'sorted' : orderColumn == 'name' }">
							Application Name
							<i ng-class="{ 'icon-chevron-down' : orderColumn == 'name' && orderDirection,
									'icon-chevron-up' : orderColumn == 'name' && !orderDirection,
									'emptyIconGlyph' : orderColumn != 'name' }"></i>
						</th>
						<th ng-repeat='stage in stages | filterReportColumns'>
							{{stage.name}} Violations
						</th>
					</tr>
				</thead>
				<tr ng-repeat='application in applications | filter: appFilter | orderBy:orderColumn:orderDirection'>
					<td>
						<a href='index.html#/management/application/{{encodeURIComponent(application.publicId)}}/policies'>
							<img ng-src='../rest/application/icon/{{encodeURIComponent(application.publicId)}}'
								onerror="this.src='../assets/img/defaulticon_application.png';"
								style='height: 24px; width: 24px; margin-right:5px;'/>{{application.name}}
						</a>
					</td>
					<td ng-repeat='stage in stages | filterReportColumns'>
						<div show-if='application.policyEvaluationsResults[stage.id]'>
							<div>
								<a class='no-hover-underline' style='vertical-align: middle;' title='View Report' href='#/reports/{{encodeURIComponent(application.publicId)}}/{{stage.id}}'>
                                                                  <div chiclets critical="application.policyEvaluationsResults[stage.id].criticalComponentCount"
                                                                       severe="application.policyEvaluationsResults[stage.id].severeComponentCount"
                                                                       moderate="application.policyEvaluationsResults[stage.id].moderateComponentCount"></div>
									<span ng-show='!(application.policyEvaluationsResults[stage.id].criticalComponentCount + application.policyEvaluationsResults[stage.id].severeComponentCount + application.policyEvaluationsResults[stage.id].moderateComponentCount)' style="color:#000000;">No violations</span>
								</a>
							</div>
							<div>
								<a title='View Report' href='#/reports/{{encodeURIComponent(application.publicId)}}/{{stage.id}}'>
									{{application.policyEvaluations[stage.id].time | ago}}</a>
							</div>
						</div>
					</td>
				</tr>
			</table>
		</div>
	</div>
</div>
