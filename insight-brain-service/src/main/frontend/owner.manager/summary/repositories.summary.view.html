<div class="tile-container">
  <div class="summary-tile-container">
    <div class="tile summary-tile" id="repositories-summary" ng-controller="repositories.summary.controller as vm">
      <div load-wrapper="vm.error" loading="!vm.repositories" reload="vm.doLoad()">
        <h1><i class="fa fa-database"></i> Repositories</h1>

        <ul class="nav nav-pills">
          <li class="active"><a data-toggle="pill" id="repositories-config-button" data-target="#repositories-pill-config">Configuration</a></li>
          <li><a data-toggle="pill" id="repositories-access-button" data-target="#repositories-pill-access">Access</a></li>
        </ul>
      </div>
    </div>
  </div>

  <div class="tile-scroll-container" scrollspy="#repositories-summary">
    <div class="tile" id="repositories-pill-config">
      <h2><i class="fa fa-sliders size-20px inverse"></i>Configuration</h2>
    </div>

    <access-tile id="repositories-pill-access"></access-tile>
  </div>
</div>
