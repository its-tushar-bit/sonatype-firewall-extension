<div id='applicationManagement' xmlns='http://www.w3.org/1999/html'>
    <button class='btn floatLeft' ng-click='registerNewApplication()'><i class='icon-plus'></i> Register New Application
    </button>
    <div class='input-prepend floatRight'>
        <span class='add-on'><i class='icon-search'></i></span>
        <input type='text' ng-model='searchText'/>
    </div>
    <table class='table table-striped' style='margin-bottom:0px'>
        <thead>
        <tr>
            <th>Public Id</th>
            <th>Stage Release</th>
            <th></th>
        </tr>
        </thead>
        <tr ng-repeat='application in applications | filter: searchText'>
            <td>{{application.publicId}}</td>
            <td><a href='/rest/report/{{application.publicId}}/{{application.reportName}}/embedReport/index.html'>{{application.lastModified
                | date:'yyyy-MM-dd'}}</a>
            </td>
            <td><a href="/policy-assets/index.html?appId={{application.publicId}}">Manage Policy</a></td>
        </tr>
        <tfoot>
        <tr>
            <td colspan='2' style='text-align:right;'>
            </td>
        </tr>
        </tfoot>
    </table>
    <div error-Modal></div>
</div>
