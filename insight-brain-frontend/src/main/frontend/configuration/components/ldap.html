<div id="ldap-configuration-editor"
     class="iq-body-container iq-body-container--single-pane"
     authorization-wrapper="isAuthorized"
     maximize-container-height>
  <div load-wrapper="loadError" reload="doLoad()" loading="!ldap">
    <div class="iq-sys-prefs-back-button">
      <iq-back-button state="ldap-servers"></iq-back-button>
    </div>
    <div id="ldap-name" class="iq-tile iq-tile--sys-prefs">
      <div class="iq-tile__actions" ng-show="ldap.id">
        <button id="ldap-connection-delete"
                class="iq-btn"
                title="Remove Configuration"
                ng-click="confirmDeleteConfiguration(ldap)">
          <i class="fa fa-trash"></i>Remove configuration
        </button>
      </div>
      <div class="iq-tile-content">
        <div class="iq-ldap-name-editor head"
             clm-editable
             e-form="$parent.$parent.$parent.$parent.$parent.$parent.ldapNameForm"
             invalid="$parent.$parent.$parent.$parent.$parent.$parent.ldapEditor.$invalid"
             model="ldap"
             model-field="name"
             empty-text="Enter Server Name"
             whitespace-check="true">
        </div>
      </div>
      <div class="iq-tile-footer"
           id="ldap-name-edit-btns"
           ng-show="!saving && (ldap.id == null || isDirty()) || ldapNameForm.$visible">
        <div ng-show="saving" class="iq-ldap-saving-message"><i class="icon-time"></i> Saving</div>
        <button type="button" class="iq-btn iq-btn--primary" ng-disabled="!canSaveEdit()" ng-click="save()">
          Save
        </button><!--
     --><button type="button" class="iq-btn" ng-click="cancel()">Cancel</button>
      </div>
      <div class="iq-tile-content" ng-if="ldap.id">
        <div class="iq-tab-bar">
          <a class="iq-tab"
             id="tab-connection"
             ng-class="{ active : $state.includes('edit-ldap.connection') }"
             ng-click="setCurrentTab('connection')">
            CONNECTION
          </a><!--
       --><a class="iq-tab"
             id="tab-user"
             ng-class="{ active : $state.includes('edit-ldap.usermapping') }"
             ng-click="setCurrentTab('usermapping')" >
            USER &amp; GROUP SETTINGS
          </a>
        </div>
      </div>
      <div ui-view></div>
    </div>
  </div>
</div>
