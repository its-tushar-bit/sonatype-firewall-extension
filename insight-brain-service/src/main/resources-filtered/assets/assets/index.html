<html lang="en" ng-app="dashboardApp">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>CLM Management</title>
    <link href="lib/bootstrap/bootstrap-2.3.1.min.css" rel="stylesheet" />
    <link href="lib/X-editable/bootstrap-editable.css" rel="stylesheet" />
    <link href="lib/glyphicon/glyphicons.css" rel="stylesheet" />
    <link href="lib/glyphicon/halflings.css" rel="stylesheet" />
    <link href="css/glyphicons-sonatype.css?${build.timestamp}" rel="stylesheet" />
    <link href="css/management.css?${build.timestamp}" rel="stylesheet"/>
    <link href="css/insight.css?${build.timestamp}" rel="stylesheet"/>
    <link href="../policy-assets/css/policy.css?${build.timestamp}" rel="stylesheet"/>
    <link rel='shortcut icon' href='favicon.ico'/>
    <script type='text/javascript'>
        var clmBuildTimestamp = '${build.timestamp}';
    </script>
    <script src='lib/jquery/jquery-1.8.3.min.js'></script>
    <script src="lib/bootstrap/bootstrap-2.3.1.min.js"></script>
    <script src="lib/X-editable/bootstrap-editable.min.js"></script>
    <script src='lib/angular/angular-${angularjs.version}.min.js'></script>
    <script src='lib/angular/angular-sanitize-${angularjs.version}.min.js'></script>
    <script src='lib/angular-ui-router-0.0.1.min.js'></script>
    <script src="lib/ui-bootstrap-tpls-0.3.0.min.js"></script>
    <script src='util/CLMLocation.js?${build.timestamp}'></script>
    <script src='util/CLMAppLocation.js?${build.timestamp}'></script>
    <script src='util/AngularCommon.js?${build.timestamp}'></script>
    <script src='js/Resource.js?${build.timestamp}'></script>
    <script src='js/Hudson.js?${build.timestamp}'></script>
    <script src='js/EditorTools.js?${build.timestamp}'></script>
    <script src='components/policy-editor/PolicyEditor.js?${build.timestamp}'></script>
    <script src='../policy-assets/components/label-editor/LabelsController.js?${build.timestamp}'></script>
    <script src='../policy-assets/components/policy/PolicyController.js?${build.timestamp}'></script>
    <script src='../policy-assets/components/license-threat-group/LicenseThreatGroupsController.js?${build.timestamp}'></script>
    <script src='../application-assets/ApplicationController.js?${build.timestamp}'></script>
    <script src='../organization-assets/OrganizationController.js?${build.timestamp}'></script>
    <script src='components/notification-manager/NotificationManager.js?${build.timestamp}'></script>
    <script src='ManagementApp.js?${build.timestamp}'></script>
</head>
<body ng-controller='dashboardController'>
	<div class="first-row navbar navbar-fixed-top">
		<div class="navbar-inner">
			<div class="container-fluid">
				<a class="title brand" href="#">
					<img src="img/sonatype-32.png" alt="Logo" height="32" width="32"/>&nbsp;Sonatype CLM
				</a>
			</div>
		</div>
	</div>
	<div ng-show='!error'>
		<div class="second-row navbar navbar-inverse navbar-fixed-top">
			<div class="navbar-inner">
				<div class="container-fluid">
					<div class="btn-group">
						<a class="btn btn-inverse btn-black dropdown-toggle" data-toggle="dropdown" href="#">
							{{ selectedDashboard.name }} <span class="caret"></span>
						</a>
						<ul class="dropdown-menu">
							<li ng-repeat="dashboard in availableDashboards">
								<a href='#/{{dashboard.state}}'>{{ dashboard.name }}</a>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</div>
		<div class="third-row" ui-view>
		</div>
	</div>
	<div ng-show='error' class='alert alert-error' style='margin:86px auto;width:50%;max-width:400px'>
		<h3>Error</h3>
		<p>An unrecoverable error has occurred while loading the page.</p>
		<p>Please try to reload the page, if the problem persists contact your server administrator. ({{error}})</p>
	</div>
</body>
</html>
