<div id="application-report"
     class="iq-root-container"
     maximize-container-height
     form-mask="vm.formMaskController"
     mask-message="Re-Evaluating"
     mask-attach-to-body>
  <aside class="iq-sidebar iq-sidebar--theme-dark" id="application-report-sidebar">
    <fieldset class="iq-radio-group iq-form-group">
      <legend class="iq-label">Aggregation</legend>
      <iq-radio id="aggregate-by-component-radio"
                model="vm.aggregate"
                value="true"
                on-click="vm.setAggregateReportEntries(value)">
        Aggregated by Component
      </iq-radio>
      <iq-radio id="no-aggregation-radio"
                model="vm.aggregate"
                value="false"
                on-click="vm.setAggregateReportEntries(value)">
        All Violations
      </iq-radio>
    </fieldset>
    <fieldset class="iq-form-group">
      <legend class="iq-label">Filters</legend>
      <iq-tree-view-multi-select id="proprietary-filter"
                                 available="vm.availableProprietaryFilterOptions"
                                 selected="vm.exactValueFilters.proprietary"
                                 on-change="vm.setProprietaryFilterOptions(selected)">
        Proprietary
      </iq-tree-view-multi-select>
      <iq-tree-view-multi-select id="match-state-filter"
                                 available="vm.availableMatchStateFilterOptions"
                                 selected="vm.exactValueFilters.matchState"
                                 on-change="vm.setMatchStateFilterOptions(selected)">
        Component Match State
      </iq-tree-view-multi-select>
    </fieldset>
  </aside><!--
--><main class="iq-body-container">
    <application-report-results></application-report-results>
  </main>
</div>
