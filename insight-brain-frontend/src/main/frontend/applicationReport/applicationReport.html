<div class="iq-root-container" id="application-report" maximize-container-height>
  <aside class="iq-sidebar iq-sidebar--theme-dark" id="application-report-sidebar">
    <fieldset class="iq-radio-group iq-form-group">
      <legend class="iq-label">Aggregation</legend>
      <iq-radio id="aggregate-by-component-radio"
                model="vm.aggregate"
                value="true"
                on-click="vm.setAggregateReportEntries(value)">
        Aggregated by Component
      </iq-radio>
      <iq-radio id="no-aggregation-radio"
                model="vm.aggregate"
                value="false"
                on-click="vm.setAggregateReportEntries(value)">
        All Violations
      </iq-radio>
    </fieldset>
  </aside><!--
--><main class="iq-body-container">
    <application-report-results></application-report-results>
  </main>
</div>
